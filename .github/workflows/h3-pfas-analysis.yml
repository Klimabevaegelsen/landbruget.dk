name: H3 PFAS Exposure Analysis

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Years to process (comma-separated, e.g., "2022,2023" or leave empty for all)'
        required: false
        default: ''
      analysis_modes:
        description: 'Analysis modes to run'
        required: true
        default: 'h3,kommune'
        type: choice
        options:
          - 'h3'
          - 'kommune'
          - 'h3,kommune'
      h3_resolutions:
        description: 'H3 resolutions to run (comma-separated, e.g., "7,8,9,10" or leave empty for all resolutions)'
        required: false
        default: '7,8,9,10'
      memory_limit:
        description: 'Memory limit for processing (optimized for 16GB GitHub Actions)'
        required: false
        default: '14GB'
      thread_count:
        description: 'Number of threads (optimized for 4 CPU GitHub Actions)'
        required: false
        default: '4'
      chunk_size:
        description: 'H3 cells per chunk (optimized for 16GB RAM)'
        required: false
        default: '10000'
  
  schedule:
    # Run weekly on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  
  push:
    paths:
      - 'backend/pipelines/h3_pfas_exposure_pipeline/**'
      - '.github/workflows/h3-pfas-analysis.yml'
    branches:
      - main

env:
  GCS_BUCKET: landbrugsdata-raw-data
  PIPELINE_DIR: backend/pipelines/h3_pfas_exposure_pipeline

jobs:
  # Prepare matrix strategy
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set year-based matrix (optimized to avoid redundant annual data downloads)
        id: set-matrix
        run: |
          # Parse analysis modes (h3 and kommune are different aggregation levels)
          analysis_modes_input="${{ github.event.inputs.analysis_modes || 'h3,kommune' }}"
          if [[ "$analysis_modes_input" == *","* ]]; then
            IFS=',' read -ra modes <<< "$analysis_modes_input"
          else
            modes=("$analysis_modes_input")
          fi
          
          # Parse H3 resolutions (only relevant for h3 mode)
          h3_resolutions_input="${{ github.event.inputs.h3_resolutions || '7,8,9,10' }}"
          if [[ "$h3_resolutions_input" == *","* ]]; then
            IFS=',' read -ra resolutions <<< "$h3_resolutions_input"
          else
            resolutions=("$h3_resolutions_input")
          fi
          
          # Parse years - create one job per year
          if [[ -n "${{ github.event.inputs.years }}" ]]; then
            if [[ "${{ github.event.inputs.years }}" == *","* ]]; then
              IFS=',' read -ra years <<< "${{ github.event.inputs.years }}"
            else
              years=("${{ github.event.inputs.years }}")
            fi
          else
            # Default to all available years (2015-2023)
            years=("2015" "2016" "2017" "2018" "2019" "2020" "2021" "2022" "2023")
          fi
          
          # Build matrix combinations - one job per YEAR
          # Each job processes ALL requested aggregation levels (h3 resolutions + kommune) for that year
          # This avoids downloading the same large annual data files (pesticide disaggregation, FVM fields) multiple times
          matrix_items=()
          for year in "${years[@]}"; do
            # Build list of all aggregation levels to process
            aggregation_levels=()
            
            # Add H3 resolutions if h3 mode is requested
            if [[ " ${modes[@]} " =~ " h3 " ]]; then
              for res in "${resolutions[@]}"; do
                aggregation_levels+=("h3:$res")
              done
            fi
            
            # Add kommune if kommune mode is requested
            if [[ " ${modes[@]} " =~ " kommune " ]]; then
              aggregation_levels+=("kommune")
            fi
            
            # Convert to comma-separated string
            aggregation_levels_str=$(IFS=','; echo "${aggregation_levels[*]}")
            
            matrix_items+=("{\"year\":\"$year\",\"aggregation_levels\":\"$aggregation_levels_str\"}")
          done
          
          # Convert to JSON array
          matrix_json="[$(IFS=','; echo "${matrix_items[*]}")]"
          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
          echo "Generated optimized matrix (one job per year, processes all aggregation levels): $matrix_json"

  # Matrix job for parallel analysis by year and resolution
  h3-pfas-analysis:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false  # Allow other jobs to continue if one fails
      max-parallel: 4   # Limit concurrent jobs to avoid overwhelming GCS
    
    name: Process Year ${{ matrix.year }} - All Aggregation Levels
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgeos-dev \
            libproj-dev \
            libgdal-dev \
            git \
            libsqlite3-dev \
            zlib1g-dev
          
          # Install tippecanoe for PMTiles generation
          echo "🗺️ Installing tippecanoe for PMTiles generation..."
          
          # Build tippecanoe from source (no pre-built binaries available)
          echo "Building tippecanoe from source..."
          git clone https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe
          make -j$(nproc)
          sudo make install
          cd /
          rm -rf /tmp/tippecanoe
          
          # Verify installation
          if command -v tippecanoe &> /dev/null; then
            echo "✅ Tippecanoe installed successfully: $(tippecanoe --version)"
          else
            echo "❌ Tippecanoe installation failed"
            exit 1
          fi
      
      - name: Install Python dependencies
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          # Install unified pipeline dependencies FIRST (needed for GCS access)
          cd ../unified_pipeline
          uv pip install --system -e .
          
          # Install H3 PFAS pipeline dependencies
          cd ../h3_pfas_exposure_pipeline
          uv pip install --system -e ".[production]"
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Verify GCS access
        run: |
          gsutil ls gs://${{ env.GCS_BUCKET }}/ | head -5
      
      - name: Run H3 PFAS Analysis - Year ${{ matrix.year }} - All Aggregation Levels
        working-directory: ${{ env.PIPELINE_DIR }}
        env:
          GCS_BUCKET: ${{ env.GCS_BUCKET }}
          # Optimized for single-year, multi-aggregation processing with 16GB RAM, 4 CPU
          MEMORY_LIMIT: ${{ github.event.inputs.memory_limit || '14GB' }}
          THREAD_COUNT: ${{ github.event.inputs.thread_count || '4' }}
          CHUNK_SIZE: ${{ github.event.inputs.chunk_size || '10000' }}
          LOG_LEVEL: INFO
          ENABLE_PROGRESS_TRACKING: true
          LOG_CHUNK_DETAILS: true
          LOG_STAGE_TIMINGS: true
          PYTHONPATH: ${{ github.workspace }}/${{ env.PIPELINE_DIR }}/src
        run: |
          # Parse aggregation levels for this year
          IFS=',' read -ra aggregation_levels <<< "${{ matrix.aggregation_levels }}"
          
          # Optimized parameters for GitHub Actions 16GB RAM, 4 CPU
          memory_limit="${{ github.event.inputs.memory_limit || '14GB' }}"
          thread_count="${{ github.event.inputs.thread_count || '4' }}"
          chunk_size="${{ github.event.inputs.chunk_size || '10000' }}"
          
          echo "🚀 Running H3 PFAS Analysis with optimized single-year processing:"
          echo "   💾 Memory: $memory_limit (of 16GB available)"
          echo "   ⚙️ Threads: $thread_count (of 4 CPUs available)"
          echo "   📦 Chunk size: $chunk_size (optimized for 16GB RAM)"
          echo "   📅 Year: ${{ matrix.year }} (SINGLE YEAR PER JOB)"
          echo "   🎯 Aggregation levels: ${{ matrix.aggregation_levels }}"
          echo "   ⚡ Efficiency: Large annual data files (pesticide disaggregation, FVM fields) downloaded once per year"
          echo ""
          
          # Process each aggregation level for this year
          for level in "${aggregation_levels[@]}"; do
            echo "Processing aggregation level: $level"
            
            if [[ "$level" == "kommune" ]]; then
              # Run kommune analysis
              cmd="python main.py --mode kommune --verbose"
              cmd="$cmd --years ${{ matrix.year }}"
              cmd="$cmd --memory-limit $memory_limit"
              cmd="$cmd --thread-count $thread_count"
              cmd="$cmd --chunk-size $chunk_size"
              
              echo "🏛️ Running kommune analysis for year ${{ matrix.year }}"
              echo "Command: $cmd"
              eval $cmd
              
            elif [[ "$level" == h3:* ]]; then
              # Extract H3 resolution
              resolution="${level#h3:}"
              
              # Run H3 analysis
              cmd="python main.py --mode h3 --verbose"
              cmd="$cmd --h3-resolution $resolution"
              cmd="$cmd --years ${{ matrix.year }}"
              cmd="$cmd --memory-limit $memory_limit"
              cmd="$cmd --thread-count $thread_count"
              cmd="$cmd --chunk-size $chunk_size"
              
              echo "🔷 Running H3 analysis (resolution $resolution) for year ${{ matrix.year }}"
              echo "Command: $cmd"
              eval $cmd
              
            else
              echo "⚠️ Unknown aggregation level: $level"
            fi
            
            echo ""
          done
          
          echo "✅ Completed all aggregation levels for year ${{ matrix.year }}"
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-year${{ matrix.year }}-${{ github.run_id }}
          path: |
            ${{ env.PIPELINE_DIR }}/*.log
            /tmp/*.log
          retention-days: 7
      
      - name: Verify output upload
        run: |
          echo "Checking for output files in GCS for year ${{ matrix.year }}..."
          # List recent outputs for this year across all aggregation levels
          gsutil ls -l gs://${{ env.GCS_BUCKET }}/gold/ | grep -E "(h3_pesticide|kommune_pesticide)" | grep "${{ matrix.year }}" | tail -10

  # Summary job
  analysis-summary:
    needs: [prepare-matrix, h3-pfas-analysis]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "=== H3 PFAS Analysis Summary ==="
          echo "Matrix jobs: ${{ needs.prepare-matrix.outputs.matrix }}"
          echo "Analysis results: ${{ needs.h3-pfas-analysis.result }}"
          
          if [[ "${{ needs.h3-pfas-analysis.result }}" == "success" ]]; then
            echo "✅ All year-based analyses completed successfully!"
          else
            echo "❌ Some year-based analyses failed. Check the logs for details."
            exit 1
          fi
      
      - name: Authenticate to Google Cloud
        if: needs.h3-pfas-analysis.result == 'success'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        if: needs.h3-pfas-analysis.result == 'success'
        uses: google-github-actions/setup-gcloud@v2
      
      - name: List final outputs
        if: needs.h3-pfas-analysis.result == 'success'
        run: |
          echo "=== Final Output Files by Year ==="
          echo "Recent H3 outputs:"
          gsutil ls -l gs://${{ env.GCS_BUCKET }}/gold/h3_pesticide_*/*/h3_pesticide_*.parquet | tail -10
          echo ""
          echo "Recent kommune outputs:"
          gsutil ls -l gs://${{ env.GCS_BUCKET }}/gold/kommune_pesticide_*/*/kommune_pesticide_*.parquet | tail -10

  # Notification job
  notify:
    needs: [analysis-summary]
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'push'
    
    steps:
      - name: Send notification
        if: needs.analysis-summary.result == 'success'
        run: |
          echo "🎉 H3 PFAS Analysis completed successfully!"
          echo "✅ All years processed with individual resource isolation"
          echo "Check the Actions tab for detailed logs and output locations."
      
      - name: Send failure notification
        if: needs.analysis-summary.result == 'failure'
        run: |
          echo "❌ H3 PFAS Analysis failed!"
          echo "Check the Actions tab for error details and logs." 