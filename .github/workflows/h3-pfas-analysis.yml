name: H3 PFAS Exposure Analysis

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Years to process (comma-separated, e.g., "2022,2023" or leave empty for all)'
        required: false
        default: ''
      analysis_modes:
        description: 'Analysis modes to run'
        required: true
        default: 'h3,kommune'
        type: choice
        options:
          - 'h3'
          - 'kommune'
          - 'h3,kommune'
          - 'all'
      h3_resolutions:
        description: 'H3 resolutions to run (comma-separated, e.g., "7,8,9,10" or leave empty for default 10)'
        required: false
        default: '10'
      memory_limit:
        description: 'Memory limit for DuckDB'
        required: false
        default: '12GB'
      thread_count:
        description: 'Number of threads'
        required: false
        default: '4'
      chunk_size:
        description: 'H3 cells per chunk'
        required: false
        default: '25000'
  
  schedule:
    # Run weekly on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  
  push:
    paths:
      - 'backend/pipelines/h3_pfas_exposure_pipeline/**'
      - '.github/workflows/h3-pfas-analysis.yml'
    branches:
      - main

env:
  GCS_BUCKET: landbrugsdata-raw-data
  PIPELINE_DIR: backend/pipelines/h3_pfas_exposure_pipeline

jobs:
  # Prepare matrix strategy
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      years: ${{ steps.set-years.outputs.years }}
    steps:
      - name: Set analysis modes and resolutions matrix
        id: set-matrix
        run: |
          # Parse analysis modes
          if [[ "${{ github.event.inputs.analysis_modes }}" == "all" ]]; then
            modes=("h3" "kommune")
          elif [[ "${{ github.event.inputs.analysis_modes }}" == *","* ]]; then
            IFS=',' read -ra modes <<< "${{ github.event.inputs.analysis_modes }}"
          else
            modes=("${{ github.event.inputs.analysis_modes || 'h3' }}")
          fi
          
          # Parse H3 resolutions (only relevant for h3 mode)
          if [[ "${{ github.event.inputs.h3_resolutions }}" == *","* ]]; then
            IFS=',' read -ra resolutions <<< "${{ github.event.inputs.h3_resolutions }}"
          else
            resolutions=("${{ github.event.inputs.h3_resolutions || '10' }}")
          fi
          
          # Build matrix combinations
          matrix_items=()
          for mode in "${modes[@]}"; do
            if [[ "$mode" == "h3" ]]; then
              # For h3 mode, create entries for each resolution
              for res in "${resolutions[@]}"; do
                matrix_items+=("{\"mode\":\"$mode\",\"h3_resolution\":\"$res\"}")
              done
            else
              # For non-h3 modes, don't include resolution
              matrix_items+=("{\"mode\":\"$mode\"}")
            fi
          done
          
          # Special handling for "all" - ensure kommune is always included
          if [[ "${{ github.event.inputs.analysis_modes }}" == "all" ]]; then
            # Check if kommune is already in the matrix
            has_kommune=false
            for item in "${matrix_items[@]}"; do
              if [[ "$item" == *"\"mode\":\"kommune\""* ]]; then
                has_kommune=true
                break
              fi
            done
            
            # Add kommune if not already present
            if [[ "$has_kommune" == false ]]; then
              matrix_items+=("{\"mode\":\"kommune\"}")
            fi
          fi
          
          # Convert to JSON array
          matrix_json="[$(IFS=','; echo "${matrix_items[*]}")]"
          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
          echo "Generated matrix: $matrix_json"
      
      - name: Set years parameter
        id: set-years
        run: |
          if [[ -n "${{ github.event.inputs.years }}" ]]; then
            # Convert comma-separated to space-separated for CLI
            years=$(echo "${{ github.event.inputs.years }}" | tr ',' ' ')
            echo "years=$years" >> $GITHUB_OUTPUT
          else
            echo "years=" >> $GITHUB_OUTPUT
          fi

  # Matrix job for parallel analysis
  h3-pfas-analysis:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false  # Allow other jobs to continue if one fails
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgeos-dev \
            libproj-dev \
            libgdal-dev
      
      - name: Install Python dependencies
        working-directory: ${{ env.PIPELINE_DIR }}
        run: |
          # Install unified pipeline dependencies FIRST (needed for GCS access)
          cd ../unified_pipeline
          uv pip install --system -e .
          
          # Install H3 PFAS pipeline dependencies
          cd ../h3_pfas_exposure_pipeline
          uv pip install --system -e ".[production]"
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Verify GCS access
        run: |
          gsutil ls gs://${{ env.GCS_BUCKET }}/ | head -5
      
      - name: Run H3 PFAS Analysis - ${{ matrix.mode }}${{ matrix.h3_resolution && format(' (res {0})', matrix.h3_resolution) || '' }}
        working-directory: ${{ env.PIPELINE_DIR }}
        env:
          GCS_BUCKET: ${{ env.GCS_BUCKET }}
          H3_RESOLUTION: ${{ matrix.h3_resolution || '10' }}
          MEMORY_LIMIT: ${{ github.event.inputs.memory_limit || '12GB' }}
          THREAD_COUNT: ${{ github.event.inputs.thread_count || '4' }}
          CHUNK_SIZE: ${{ github.event.inputs.chunk_size || '25000' }}
          LOG_LEVEL: INFO
          ENABLE_PROGRESS_TRACKING: true
          LOG_CHUNK_DETAILS: true
          LOG_STAGE_TIMINGS: true
          PYTHONPATH: ${{ github.workspace }}/${{ env.PIPELINE_DIR }}/src
        run: |
          # Build the command
          cmd="python main.py --mode ${{ matrix.mode }} --verbose"
          
          # Add H3 resolution if specified (only for h3 mode)
          if [[ "${{ matrix.mode }}" == "h3" && -n "${{ matrix.h3_resolution }}" ]]; then
            cmd="$cmd --h3-resolution ${{ matrix.h3_resolution }}"
          fi
          
          # Add years if specified
          if [[ -n "${{ needs.prepare-matrix.outputs.years }}" ]]; then
            cmd="$cmd --years ${{ needs.prepare-matrix.outputs.years }}"
          fi
          
          # Add custom parameters
          cmd="$cmd --memory-limit ${{ github.event.inputs.memory_limit || '12GB' }}"
          cmd="$cmd --thread-count ${{ github.event.inputs.thread_count || '4' }}"
          cmd="$cmd --chunk-size ${{ github.event.inputs.chunk_size || '25000' }}"
          
          echo "Running: $cmd"
          eval $cmd
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.mode }}${{ matrix.h3_resolution && format('-res{0}', matrix.h3_resolution) || '' }}-${{ github.run_id }}
          path: |
            ${{ env.PIPELINE_DIR }}/*.log
            /tmp/*.log
          retention-days: 7
      
      - name: Verify output files
        run: |
          echo "Checking for output files in GCS..."
          # List recent outputs for this mode
          gsutil ls -l gs://${{ env.GCS_BUCKET }}/gold/ | grep -E "(h3_pesticide|kommune_pesticide)" | tail -10

  # Summary job
  analysis-summary:
    needs: [prepare-matrix, h3-pfas-analysis]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "=== H3 PFAS Analysis Summary ==="
          echo "Matrix jobs: ${{ needs.prepare-matrix.outputs.matrix }}"
          echo "Years processed: ${{ needs.prepare-matrix.outputs.years || 'all available' }}"
          echo "Analysis results: ${{ needs.h3-pfas-analysis.result }}"
          
          if [[ "${{ needs.h3-pfas-analysis.result }}" == "success" ]]; then
            echo "✅ All analyses completed successfully!"
          else
            echo "❌ Some analyses failed. Check the logs for details."
            exit 1
          fi
      
      - name: Authenticate to Google Cloud
        if: needs.h3-pfas-analysis.result == 'success'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        if: needs.h3-pfas-analysis.result == 'success'
        uses: google-github-actions/setup-gcloud@v2
      
      - name: List final outputs
        if: needs.h3-pfas-analysis.result == 'success'
        run: |
          echo "=== Final Output Files ==="
          echo "Recent H3 outputs:"
          gsutil ls -l gs://${{ env.GCS_BUCKET }}/gold/h3_pesticide_*/*/h3_pesticide_*.parquet | tail -5
          echo ""
          echo "Recent kommune outputs:"
          gsutil ls -l gs://${{ env.GCS_BUCKET }}/gold/kommune_pesticide_*/*/kommune_pesticide_*.parquet | tail -5

  # Notification job
  notify:
    needs: [analysis-summary]
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'push'
    
    steps:
      - name: Send notification
        if: needs.analysis-summary.result == 'success'
        run: |
          echo "🎉 H3 PFAS Analysis completed successfully!"
          echo "Check the Actions tab for detailed logs and output locations."
      
      - name: Send failure notification
        if: needs.analysis-summary.result == 'failure'
        run: |
          echo "❌ H3 PFAS Analysis failed!"
          echo "Check the Actions tab for error details and logs." 