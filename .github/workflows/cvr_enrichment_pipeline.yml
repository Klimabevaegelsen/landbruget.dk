name: CVR Enrichment Pipeline
# Supports both full pipeline execution and independent step execution
# Use 'run_only_step' to run a single step independently (will fetch latest data from GCS)

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: "Test limit (number of CVR numbers to process, empty for no limit)"
        required: false
        type: string
      # batch_count:
      # description: 'Number of batches for parallel processing'
      # required: false
      # default: '5'
      # type: string
      skip_steps:
        description: "Comma-separated list of steps to skip (collection,company_fetching,data_parsing,data_consolidation,pnumber_fetching,financial_documents,address_geocoding)"
        required: false
        type: string
      run_only_step:
        description: "Run only a specific step independently (collection,company_fetching,pnumber_fetching,financial_documents,address_geocoding). Note: data_parsing and data_consolidation require full pipeline run."
        required: false
        type: choice
        options:
          - none
          - collection
          - company_fetching
          - pnumber_fetching
          - financial_documents
          - address_geocoding
        default: "none"
      log_level:
        description: "Logging level"
        type: choice
        required: true
        options:
          - INFO
          - DEBUG
          - WARNING
          - ERROR
        default: "INFO"
  workflow_call:
    inputs:
      test_limit:
        description: "Test limit (number of CVR numbers to process, empty for no limit)"
        required: false
        type: string
      skip_steps:
        description: "Comma-separated list of steps to skip (collection,company_fetching,data_parsing,data_consolidation,pnumber_fetching,financial_documents,address_geocoding)"
        required: false
        type: string
      run_only_step:
        description: "Run only a specific step independently (collection,company_fetching,pnumber_fetching,financial_documents,address_geocoding). Note: data_parsing and data_consolidation require full pipeline run."
        required: false
        type: string
        default: "none"
      log_level:
        description: "Logging level"
        type: string
        required: false
        default: "INFO"
    secrets:
      GCP_SA_KEY:
        required: true
      CVR_USERNAME:
        required: true
      CVR_PASSWORD:
        required: true
      GCS_ACCESS_KEY_ID:
        required: true
      GCS_SECRET_ACCESS_KEY:
        required: true
      LANDBRUGSDATA_UUID_NAMESPACE:
        required: true
  schedule:
    # Run monthly on the 1st at 02:00 UTC
    - cron: "0 2 1 * *"

env:
  BUCKET_NAME: landbrugsdata-raw-data
  PYTHON_VERSION: "3.11"
  # Shared timestamp for all pipeline steps to ensure consistent file paths
  PIPELINE_START_TIME: ${{ github.run_started_at }}
  GCS_ACCESS_KEY_ID: ${{ secrets.GCS_ACCESS_KEY_ID }}
  GCS_SECRET_ACCESS_KEY: ${{ secrets.GCS_SECRET_ACCESS_KEY }}
  LANDBRUGSDATA_UUID_NAMESPACE: ${{ secrets.LANDBRUGSDATA_UUID_NAMESPACE }}

jobs:
  # Step 1: CVR Collection (Sequential - must run first)
  cvr_collection:
    name: "CVR Collection"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.run_only_step == 'none' && !contains(github.event.inputs.skip_steps, 'collection')) || github.event.inputs.run_only_step == 'collection' }}
    outputs:
      collection_success: ${{ steps.collection.outputs.success }}
      pipeline_timestamp: ${{ steps.set_timestamp.outputs.timestamp }}

    steps:
      - name: Set Pipeline Timestamp
        id: set_timestamp
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "📅 Pipeline timestamp: $TIMESTAMP"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run CVR Collection
        id: collection
        env:
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
          PYTHONUNBUFFERED: 1
        run: |
          cd backend/pipelines/unified_pipeline

          # Build command with optional parameters - force unbuffered output
          CMD="python -u -m unified_pipeline run -s cvr_enrichment -j collection"

          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi

          echo "🚀 Starting CVR Collection Step"
          echo "Running with Log Level: $LOG_LEVEL"
          echo "Running: $CMD"
          echo "🚀 Command starting now..."

          # Run command directly like other pipelines - no tee redirection
          $CMD

          echo "✅ CVR Collection completed successfully"

          # Set outputs
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Upload CVR Collection Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-collection-data
          path: /tmp/cvr_collection_data.parquet
          retention-days: 1

  # Step 2a: Company Fetching Part 1 (First half of CVR numbers)
  company_fetching_part1:
    name: "Company Fetching (Part 1/2)"
    runs-on: ubuntu-latest
    needs: cvr_collection
    if: ${{ !cancelled() && ((github.event.inputs.run_only_step == 'none' && needs.cvr_collection.outputs.collection_success == 'true' && !contains(github.event.inputs.skip_steps, 'company_fetching')) || github.event.inputs.run_only_step == 'company_fetching') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download CVR Collection Data
        if: ${{ github.event.inputs.run_only_step == 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-collection-data
          path: /tmp/
        continue-on-error: true

      - name: Run Company Fetching Part 1
        env:
          CVR_USERNAME: ${{ secrets.CVR_USERNAME }}
          CVR_PASSWORD: ${{ secrets.CVR_PASSWORD }}
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
          PYTHONUNBUFFERED: 1
          PIPELINE_START_TIME: ${{ needs.cvr_collection.outputs.pipeline_timestamp }}
        run: |
          cd backend/pipelines/unified_pipeline

          CMD="python -u -m unified_pipeline run -s cvr_enrichment -j company_fetching --batch-number 1 --total-batches 2"

          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi

          echo "🚀 Starting Company Fetching Part 1/2"
          echo "Running with Log Level: $LOG_LEVEL"
          echo "Running: $CMD"
          echo "🚀 Command starting now..."

          $CMD

          echo "✅ Company Fetching Part 1 completed successfully"

  # Step 2b: Company Fetching Part 2 (Second half of CVR numbers)
  company_fetching_part2:
    name: "Company Fetching (Part 2/2)"
    runs-on: ubuntu-latest
    needs: [cvr_collection, company_fetching_part1]
    if: ${{ !cancelled() && ((github.event.inputs.run_only_step == 'none' && !contains(github.event.inputs.skip_steps, 'company_fetching')) || github.event.inputs.run_only_step == 'company_fetching') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download CVR Collection Data
        if: ${{ github.event.inputs.run_only_step == 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-collection-data
          path: /tmp/
        continue-on-error: true

      - name: Run Company Fetching Part 2
        env:
          CVR_USERNAME: ${{ secrets.CVR_USERNAME }}
          CVR_PASSWORD: ${{ secrets.CVR_PASSWORD }}
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
          PYTHONUNBUFFERED: 1
          PIPELINE_START_TIME: ${{ needs.cvr_collection.outputs.pipeline_timestamp }}
        run: |
          cd backend/pipelines/unified_pipeline

          CMD="python -u -m unified_pipeline run -s cvr_enrichment -j company_fetching --batch-number 2 --total-batches 2"

          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi

          echo "🚀 Starting Company Fetching Part 2/2"
          echo "Running with Log Level: $LOG_LEVEL"
          echo "Running: $CMD"
          echo "🚀 Command starting now..."

          $CMD

          echo "✅ Company Fetching Part 2 completed successfully"

  # Step 2c: Consolidate Company Fetching Parts (Merge all parts into single file)
  company_fetching_consolidate:
    name: "Company Fetching (Consolidate)"
    runs-on: ubuntu-latest
    needs: company_fetching_part2
    if: ${{ !cancelled() && ((github.event.inputs.run_only_step == 'none' && !contains(github.event.inputs.skip_steps, 'company_fetching')) || github.event.inputs.run_only_step == 'company_fetching') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install duckdb gcsfs pyarrow

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Consolidate Parts from GCS
        env:
          GCS_ACCESS_KEY_ID: ${{ secrets.GCS_ACCESS_KEY_ID }}
          GCS_SECRET_ACCESS_KEY: ${{ secrets.GCS_SECRET_ACCESS_KEY }}
        run: |
          echo "🔄 Consolidating company fetching parts from GCS..."

          # Find today's timestamp directory
          TODAY=$(date -u +%Y%m%d)
          echo "Looking for data from: $TODAY"

          # List available part directories
          PART_DIRS=$(gsutil ls gs://landbrugsdata-raw-data/bronze/cvr_raw_companies/${TODAY}*/ 2>/dev/null | head -1 || echo "")

          if [ -z "$PART_DIRS" ]; then
            echo "❌ No data directories found for today"
            exit 1
          fi

          # Extract timestamp from the first directory found
          TIMESTAMP=$(echo "$PART_DIRS" | sed 's|.*/bronze/cvr_raw_companies/||' | sed 's|/.*||')
          echo "Found timestamp: $TIMESTAMP"

          # Check for part directories
          PART1_EXISTS=$(gsutil ls gs://landbrugsdata-raw-data/bronze/cvr_raw_companies/${TIMESTAMP}/part1/consolidated.parquet 2>/dev/null || echo "")
          PART2_EXISTS=$(gsutil ls gs://landbrugsdata-raw-data/bronze/cvr_raw_companies/${TIMESTAMP}/part2/consolidated.parquet 2>/dev/null || echo "")

          echo "Part 1 exists: ${PART1_EXISTS:-no}"
          echo "Part 2 exists: ${PART2_EXISTS:-no}"

          if [ -z "$PART1_EXISTS" ] || [ -z "$PART2_EXISTS" ]; then
            echo "❌ Missing part files - cannot consolidate"
            echo "Part 1: $PART1_EXISTS"
            echo "Part 2: $PART2_EXISTS"
            exit 1
          fi

          # Use Python/DuckDB to merge the parts
          python3 << EOF
          import duckdb
          import gcsfs
          import os

          # Set up GCS filesystem with HMAC credentials (same pattern as gcs_access.py)
          gcs_access_key = os.getenv("GCS_ACCESS_KEY_ID")
          gcs_secret_key = os.getenv("GCS_SECRET_ACCESS_KEY")

          if gcs_access_key and gcs_secret_key:
              print("Using HMAC authentication for gcsfs")
              fs = gcsfs.GCSFileSystem(
                  access_key_id=gcs_access_key,
                  secret_access_key=gcs_secret_key
              )
          else:
              print("Using default authentication for gcsfs")
              fs = gcsfs.GCSFileSystem()

          conn = duckdb.connect()
          conn.install_extension("spatial")
          conn.load_extension("spatial")
          conn.register_filesystem(fs)

          timestamp = "${TIMESTAMP}"
          bucket = "landbrugsdata-raw-data"

          # Read both parts
          part1_path = f"gs://{bucket}/bronze/cvr_raw_companies/{timestamp}/part1/consolidated.parquet"
          part2_path = f"gs://{bucket}/bronze/cvr_raw_companies/{timestamp}/part2/consolidated.parquet"

          print(f"📖 Reading Part 1: {part1_path}")
          print(f"📖 Reading Part 2: {part2_path}")

          # Merge parts into consolidated table
          conn.execute(f"""
              CREATE TABLE consolidated AS
              SELECT * FROM read_parquet(['{part1_path}', '{part2_path}'])
              ORDER BY cvr_number
          """)

          count = conn.execute("SELECT COUNT(*) FROM consolidated").fetchone()[0]
          print(f"✅ Merged {count:,} total company records from both parts")

          # Save to final consolidated location
          final_path = f"gs://{bucket}/bronze/cvr_raw_companies/{timestamp}/consolidated.parquet"
          conn.execute(f"""
              COPY consolidated TO '{final_path}'
              (FORMAT 'parquet', COMPRESSION 'zstd', ROW_GROUP_SIZE 100000)
          """)
          print(f"✅ Saved consolidated data to: {final_path}")

          # Also save locally for artifact
          conn.execute("COPY consolidated TO '/tmp/cvr_raw_data.parquet' (FORMAT 'parquet', COMPRESSION 'zstd')")
          print("💾 Saved local artifact: /tmp/cvr_raw_data.parquet")

          conn.close()
          EOF

          echo "✅ Consolidation completed successfully"

      - name: Cleanup Part Directories
        run: |
          echo "🧹 Cleaning up part directories to save storage space..."

          # Find the timestamp we used
          TODAY=$(date -u +%Y%m%d)
          PART_DIRS=$(gsutil ls gs://landbrugsdata-raw-data/bronze/cvr_raw_companies/${TODAY}*/ 2>/dev/null | head -1 || echo "")
          TIMESTAMP=$(echo "$PART_DIRS" | sed 's|.*/bronze/cvr_raw_companies/||' | sed 's|/.*||')

          if [ -n "$TIMESTAMP" ]; then
            echo "Cleaning up part directories for timestamp: $TIMESTAMP"

            # Delete part1 directory
            if gsutil ls gs://landbrugsdata-raw-data/bronze/cvr_raw_companies/${TIMESTAMP}/part1/ &>/dev/null; then
              echo "Deleting part1 directory..."
              gsutil -m rm -r gs://landbrugsdata-raw-data/bronze/cvr_raw_companies/${TIMESTAMP}/part1/ || true
              echo "✅ Deleted part1 directory"
            fi

            # Delete part2 directory
            if gsutil ls gs://landbrugsdata-raw-data/bronze/cvr_raw_companies/${TIMESTAMP}/part2/ &>/dev/null; then
              echo "Deleting part2 directory..."
              gsutil -m rm -r gs://landbrugsdata-raw-data/bronze/cvr_raw_companies/${TIMESTAMP}/part2/ || true
              echo "✅ Deleted part2 directory"
            fi

            echo "✅ Cleanup completed"
          else
            echo "⚠️ Could not determine timestamp for cleanup"
          fi

      - name: Upload Consolidated Raw Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-raw-company-data
          path: /tmp/cvr_raw_data.parquet
          retention-days: 1

  # Step 3: Data Parsing (Silver Layer - Parse raw JSON into structured data)
  data_parsing:
    name: "Data Parsing (Silver Layer)"
    runs-on: ubuntu-latest
    needs: company_fetching_consolidate
    if: ${{ !cancelled() && (github.event.inputs.run_only_step == 'none' && !contains(github.event.inputs.skip_steps, 'data_parsing')) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Raw Company Data
        if: ${{ github.event.inputs.run_only_step == 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-raw-company-data
          path: /tmp/
        continue-on-error: true

      - name: Run Data Parsing
        env:
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
          PYTHONUNBUFFERED: 1
        run: |
          cd backend/pipelines/unified_pipeline

          CMD="python -u -m unified_pipeline run -s cvr_enrichment -j data_parsing"

          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi

          echo "🚀 Starting Data Parsing Step"
          echo "Running with Log Level: $LOG_LEVEL"
          echo "Running: $CMD"
          echo "🚀 Command starting now..."

          $CMD

          echo "✅ Data Parsing completed successfully"

      - name: Upload Silver Layer Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-silver-data
          path: /tmp/cvr_companies_silver.parquet
          retention-days: 1

  # Step 4: Data Consolidation (Gold Layer - Compatibility bridge)
  data_consolidation:
    name: "Data Consolidation (Gold Layer)"
    runs-on: ubuntu-latest
    needs: data_parsing
    if: ${{ !cancelled() && (github.event.inputs.run_only_step == 'none' && !contains(github.event.inputs.skip_steps, 'data_consolidation')) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Silver Layer Data
        if: ${{ github.event.inputs.run_only_step == 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-silver-data
          path: /tmp/
        continue-on-error: true

      - name: Run Data Consolidation
        env:
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
          PYTHONUNBUFFERED: 1
        run: |
          cd backend/pipelines/unified_pipeline

          CMD="python -u -m unified_pipeline run -s cvr_enrichment -j data_consolidation"

          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi

          echo "🚀 Starting Data Consolidation Step"
          echo "Running with Log Level: $LOG_LEVEL"
          echo "Running: $CMD"
          echo "🚀 Command starting now..."

          $CMD

          echo "✅ Data Consolidation completed successfully"

      - name: Upload Company Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/cvr_company_data.parquet
          retention-days: 1

  # Step 5: P-Number Fetching (Sequential - single job with API-level batching)
  pnumber_fetching:
    name: "P-Number Fetching"
    runs-on: ubuntu-latest
    needs: [cvr_collection, data_consolidation]
    if: ${{ !cancelled() && ((github.event.inputs.run_only_step == 'none' && !contains(github.event.inputs.skip_steps, 'pnumber_fetching')) || github.event.inputs.run_only_step == 'pnumber_fetching') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Company Data
        if: ${{ github.event.inputs.run_only_step == 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/
        continue-on-error: true

      - name: Run P-Number Fetching
        env:
          CVR_USERNAME: ${{ secrets.CVR_USERNAME }}
          CVR_PASSWORD: ${{ secrets.CVR_PASSWORD }}
        run: |
          cd backend/pipelines/unified_pipeline

          CMD="python -u -m unified_pipeline run -s cvr_enrichment -j pnumber_fetching"

          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Verify P-Number Data Artifact
        run: |
          # Check if the P-number fetching step already created the artifact file
          if [ -f "/tmp/cvr_pnumber_data.parquet" ]; then
            echo "✅ P-number data artifact already exists from the fetching step"
            ls -lh /tmp/cvr_pnumber_data.parquet
          else
            echo "⚠️ P-number data artifact not found, looking for latest available data..."

            # Find the latest P-number data file from today's runs
            LATEST_PNUMBER_PATH=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment_pnumbers/*/data.parquet 2>/dev/null | grep "$(date -u +%Y%m%d)" | sort -r | head -1 || echo "")

            if [ -n "$LATEST_PNUMBER_PATH" ]; then
              echo "✅ Found latest P-number file: $LATEST_PNUMBER_PATH"
              gsutil cp "$LATEST_PNUMBER_PATH" /tmp/cvr_pnumber_data.parquet
              echo "✅ Created P-number artifact from: $LATEST_PNUMBER_PATH"
            else
              echo "⚠️ No P-number data files found from today"
              echo "Trying to find any recent P-number data file..."

              # Fallback: find any recent P-number file
              RECENT_PNUMBER_PATH=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment_pnumbers/*/data.parquet 2>/dev/null | sort -r | head -1 || echo "")

              if [ -n "$RECENT_PNUMBER_PATH" ]; then
                echo "✅ Found recent P-number file: $RECENT_PNUMBER_PATH"
                gsutil cp "$RECENT_PNUMBER_PATH" /tmp/cvr_pnumber_data.parquet
                echo "✅ Created P-number artifact from recent file: $RECENT_PNUMBER_PATH"
              else
                echo "❌ No P-number data files found at all"
                echo "Creating empty artifact to prevent downstream failures"
                touch /tmp/cvr_pnumber_data.parquet
                echo "Created empty P-number artifact"
              fi
            fi
          fi

      - name: Upload P-Number Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-pnumber-data
          path: /tmp/cvr_pnumber_data.parquet
          retention-days: 1

  # Step 6: Financial Documents (Sequential - process all companies)
  financial_documents:
    name: "Financial Documents"
    runs-on: ubuntu-latest
    needs: [cvr_collection, data_consolidation]
    if: ${{ !cancelled() && ((github.event.inputs.run_only_step == 'none' && !contains(github.event.inputs.skip_steps, 'financial_documents')) || github.event.inputs.run_only_step == 'financial_documents') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Company Data
        if: ${{ github.event.inputs.run_only_step == 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/
        continue-on-error: true

      - name: Run Financial Documents
        env:
          CVR_USERNAME: ${{ secrets.CVR_USERNAME }}
          CVR_PASSWORD: ${{ secrets.CVR_PASSWORD }}
        run: |
          cd backend/pipelines/unified_pipeline

          CMD="python -u -m unified_pipeline run -s cvr_enrichment -j financial_documents"

          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Create Financial Data Artifact
        run: |
          echo "🔍 Finding latest financial data..."

          # Find the latest financial data file from today's runs
          LATEST_FINANCIAL_PATH=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment_financial/*/data.parquet 2>/dev/null | grep "$(date -u +%Y%m%d)" | sort -r | head -1 || echo "")

          if [ -n "$LATEST_FINANCIAL_PATH" ]; then
            echo "✅ Found latest financial file: $LATEST_FINANCIAL_PATH"
            gsutil cp "$LATEST_FINANCIAL_PATH" /tmp/cvr_financial_data.parquet
            echo "✅ Created financial artifact from: $LATEST_FINANCIAL_PATH"
          else
            echo "⚠️ No financial data files found from today"
            echo "Trying to find any recent financial data file..."

            # Fallback: find any recent financial file
            RECENT_FINANCIAL_PATH=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment_financial/*/data.parquet 2>/dev/null | sort -r | head -1 || echo "")

            if [ -n "$RECENT_FINANCIAL_PATH" ]; then
              echo "✅ Found recent financial file: $RECENT_FINANCIAL_PATH"
              gsutil cp "$RECENT_FINANCIAL_PATH" /tmp/cvr_financial_data.parquet
              echo "✅ Created financial artifact from recent file: $RECENT_FINANCIAL_PATH"
            else
              echo "❌ No financial data files found at all"
              echo "Creating empty artifact to prevent downstream failures"
              touch /tmp/cvr_financial_data.parquet
              echo "Created empty financial artifact"
            fi
          fi

      - name: Upload Financial Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cvr-financial-data
          path: /tmp/cvr_financial_data.parquet
          retention-days: 1

  # Step 7: Address Geocoding (Sequential - process all addresses)
  address_geocoding:
    name: "Address Geocoding"
    runs-on: ubuntu-latest
    needs: [cvr_collection, data_consolidation, pnumber_fetching]
    if: ${{ !cancelled() && ((github.event.inputs.run_only_step == 'none' && !contains(github.event.inputs.skip_steps, 'address_geocoding')) || github.event.inputs.run_only_step == 'address_geocoding') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Company and P-Number Data
        if: ${{ github.event.inputs.run_only_step == 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/
        continue-on-error: true

      - name: Download P-Number Data
        if: ${{ github.event.inputs.run_only_step == 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-pnumber-data
          path: /tmp/
        continue-on-error: true

      - name: Run Address Geocoding
        run: |
          cd backend/pipelines/unified_pipeline

          CMD="python -u -m unified_pipeline run -s cvr_enrichment -j address_geocoding"

          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Create Address Data Artifact
        run: |
          echo "🔍 Finding latest address geocoding data..."

          # Find the latest address geocoding file from today's runs
          LATEST_ADDRESS_PATH=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment/*/address_geocoding.parquet 2>/dev/null | grep "$(date -u +%Y%m%d)" | sort -r | head -1 || echo "")

          if [ -n "$LATEST_ADDRESS_PATH" ]; then
            echo "✅ Found latest address file: $LATEST_ADDRESS_PATH"
            gsutil cp "$LATEST_ADDRESS_PATH" /tmp/cvr_address_data.parquet
            echo "✅ Created address artifact from: $LATEST_ADDRESS_PATH"
          else
            echo "⚠️ No address geocoding files found from today"
            echo "Trying to find any recent address geocoding file..."

            # Fallback: find any recent address file within the last 7 days
            RECENT_ADDRESS_PATH=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment/*/address_geocoding.parquet 2>/dev/null | sort -r | head -1 || echo "")

            if [ -n "$RECENT_ADDRESS_PATH" ]; then
              echo "✅ Found recent address file: $RECENT_ADDRESS_PATH"
              gsutil cp "$RECENT_ADDRESS_PATH" /tmp/cvr_address_data.parquet
              echo "✅ Created address artifact from recent file: $RECENT_ADDRESS_PATH"
            else
              echo "❌ No address geocoding files found at all"
              echo "Creating empty artifact to prevent downstream failures"
              touch /tmp/cvr_address_data.parquet
              echo "Created empty address artifact"
            fi
          fi

      - name: Upload Address Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cvr-address-data
          path: /tmp/cvr_address_data.parquet
          retention-days: 1

  # Step 8: Pipeline Summary
  pipeline_summary:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs:
      [
        cvr_collection,
        company_fetching_part1,
        company_fetching_part2,
        company_fetching_consolidate,
        data_parsing,
        data_consolidation,
        pnumber_fetching,
        financial_documents,
        address_geocoding,
      ]
    if: always()

    steps:
      - name: Pipeline Summary
        run: |
          echo "🎉 CVR Enrichment Pipeline completed!"
          echo "📊 Pipeline Configuration:"
          echo "   • Test limit: ${{ github.event.inputs.test_limit || 'None (full dataset)' }}"
          echo "   • Processing mode: Split into 2 parts (to avoid 6h timeout)"
          echo "   • Skipped steps: ${{ github.event.inputs.skip_steps || 'None' }}"
          echo ""
          echo "📋 Steps Status:"
          echo "   • CVR Collection: ${{ needs.cvr_collection.result }}"
          echo "   • Company Fetching Part 1 (Bronze): ${{ needs.company_fetching_part1.result }}"
          echo "   • Company Fetching Part 2 (Bronze): ${{ needs.company_fetching_part2.result }}"
          echo "   • Company Fetching Consolidate: ${{ needs.company_fetching_consolidate.result }}"
          echo "   • Data Parsing (Silver): ${{ needs.data_parsing.result }}"
          echo "   • Data Consolidation (Gold): ${{ needs.data_consolidation.result }}"
          echo "   • P-Number Fetching: ${{ needs.pnumber_fetching.result }}"
          echo "   • Financial Documents: ${{ needs.financial_documents.result }}"
          echo "   • Address Geocoding: ${{ needs.address_geocoding.result }}"
          echo ""
          echo "✅ New Bronze→Silver→Gold architecture implemented successfully"
          echo "   • Bronze: Raw JSON data streaming (split into 2 parts)"
          echo "   • Silver: Structured data parsing"
          echo "   • Gold: Compatibility consolidation"

  # Notification job (runs regardless of success/failure)
  notify:
    name: "Pipeline Notification"
    runs-on: ubuntu-latest
    needs:
      [
        cvr_collection,
        company_fetching_part1,
        company_fetching_part2,
        company_fetching_consolidate,
        data_parsing,
        data_consolidation,
        pnumber_fetching,
        financial_documents,
        address_geocoding,
        pipeline_summary,
      ]
    if: always()

    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.address_geocoding.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=CVR Enrichment Pipeline completed successfully! 🎉" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.cvr_collection.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=CVR Enrichment Pipeline failed at collection step ❌" >> $GITHUB_OUTPUT
          else
            echo "status=partial" >> $GITHUB_OUTPUT
            echo "message=CVR Enrichment Pipeline completed with some failures ⚠️" >> $GITHUB_OUTPUT
          fi

      - name: Log final status
        run: |
          echo "${{ steps.status.outputs.message }}"
          echo ""
          echo "🔗 View detailed logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
