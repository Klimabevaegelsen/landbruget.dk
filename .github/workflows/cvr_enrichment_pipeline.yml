name: CVR Enrichment Pipeline

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Test limit (number of CVR numbers to process, empty for no limit)'
        required: false
        type: string
      batch_count:
        description: 'Number of batches for parallel processing'
        required: false
        default: '5'
        type: string
      skip_steps:
        description: 'Comma-separated list of steps to skip (collection,company_fetching,pnumber_fetching,financial_documents,address_geocoding,data_consolidation)'
        required: false
        type: string
      log_level:
        description: 'Logging level'
        type: choice
        required: true
        options:
          - INFO
          - DEBUG
          - WARNING
          - ERROR
        default: 'INFO'
  schedule:
    # Run monthly on the 1st at 02:00 UTC
    - cron: '0 2 1 * *'

env:
  BUCKET_NAME: landbrugsdata-raw-data
  PYTHON_VERSION: '3.11'

jobs:
  # Step 1: CVR Collection (Sequential - must run first)
  cvr_collection:
    name: "CVR Collection"
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.inputs.skip_steps, 'collection') }}
    outputs:
      batch_count: ${{ steps.collection.outputs.batch_count }}
      collection_success: ${{ steps.collection.outputs.success }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Run CVR Collection
        id: collection
        env:
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
          PYTHONUNBUFFERED: 1
        run: |
          cd backend/pipelines/unified_pipeline
          
          # Build command with optional parameters - force unbuffered output
          CMD="python -u -m unified_pipeline --source cvr_enrichment --stage collection"
          
          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi
          
          echo "🚀 Starting CVR Collection Step"
          echo "Running with Log Level: $LOG_LEVEL"
          echo "Running: $CMD"
          echo "🚀 Command starting now..."
          
          # Run command directly like other pipelines - no tee redirection
          $CMD
          
          echo "✅ CVR Collection completed successfully"
          
          # Set outputs
          echo "success=true" >> $GITHUB_OUTPUT
          echo "batch_count=${{ github.event.inputs.batch_count || '5' }}" >> $GITHUB_OUTPUT

      - name: Upload CVR Collection Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-collection-data
          path: /tmp/cvr_collection_data.parquet
          retention-days: 1

  # Step 2: Company Fetching (Sequential with API-level batching)
  company_fetching:
    name: "Company Fetching"
    runs-on: ubuntu-latest
    needs: cvr_collection
    if: ${{ needs.cvr_collection.outputs.collection_success == 'true' && !contains(github.event.inputs.skip_steps, 'company_fetching') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Download CVR Collection Data
        uses: actions/download-artifact@v4
        with:
          name: cvr-collection-data
          path: /tmp/
      
      - name: Run Company Fetching
        env:
          CVR_USERNAME: ${{ secrets.CVR_USERNAME }}
          CVR_PASSWORD: ${{ secrets.CVR_PASSWORD }}
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
          PYTHONUNBUFFERED: 1
        run: |
          cd backend/pipelines/unified_pipeline
          
          CMD="python -u -m unified_pipeline --source cvr_enrichment --stage company_fetching"
          
          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi
          
          echo "🚀 Starting Company Fetching Step"
          echo "Running with Log Level: $LOG_LEVEL"
          echo "Running: $CMD"
          echo "🚀 Command starting now..."
          
          # Run command directly like other pipelines - no tee redirection
          $CMD
          
          echo "✅ Company Fetching completed successfully"

      - name: Upload Company Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/cvr_company_data.parquet
          retention-days: 1

  # Step 3: P-Number Fetching (Sequential with API-level batching)
  pnumber_fetching:
    name: "P-Number Fetching"
    runs-on: ubuntu-latest
    needs: company_fetching
    if: ${{ !contains(github.event.inputs.skip_steps, 'pnumber_fetching') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Download Company Data
        uses: actions/download-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/
      
      - name: Run P-Number Fetching
        env:
          CVR_USERNAME: ${{ secrets.CVR_USERNAME }}
          CVR_PASSWORD: ${{ secrets.CVR_PASSWORD }}
        run: |
          cd backend/pipelines/unified_pipeline
          
          CMD="python -u -m unified_pipeline --source cvr_enrichment --stage pnumber_fetching"
          
          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi
          
          echo "Running: $CMD"
          $CMD

      - name: Upload P-Number Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-pnumber-data
          path: /tmp/cvr_pnumber_data.parquet
          retention-days: 1

  # Step 4: Financial Documents (Parallel - individual API calls required)
  financial_documents:
    name: "Financial Documents (Batch ${{ matrix.batch }})"
    runs-on: ubuntu-latest
    needs: company_fetching
    if: ${{ !contains(github.event.inputs.skip_steps, 'financial_documents') }}
    
    strategy:
      matrix:
        batch: [1, 2, 3, 4, 5]  # Parallel batches for individual API calls
      fail-fast: false
      max-parallel: 2  # Lower limit for financial document processing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Download Company Data
        uses: actions/download-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/
      
      - name: Run Financial Documents
        env:
          CVR_USERNAME: ${{ secrets.CVR_USERNAME }}
          CVR_PASSWORD: ${{ secrets.CVR_PASSWORD }}
        run: |
          cd backend/pipelines/unified_pipeline
          
          CMD="python -u -m unified_pipeline --source cvr_enrichment --stage financial_documents --batch-number ${{ matrix.batch }} --total-batches 5"
          
          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi
          
          echo "Running: $CMD"
          $CMD

      - name: Upload Financial Documents Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-financial-data-batch-${{ matrix.batch }}
          path: /tmp/cvr_financial_data_batch_*.parquet
          retention-days: 1

  # Step 5: Address Geocoding (Parallel - individual DAWA API calls required)
  address_geocoding:
    name: "Address Geocoding (Batch ${{ matrix.batch }})"
    runs-on: ubuntu-latest
    needs: [company_fetching, pnumber_fetching]
    if: ${{ !contains(github.event.inputs.skip_steps, 'address_geocoding') }}
    
    strategy:
      matrix:
        batch: [1, 2, 3, 4, 5]  # Parallel batches for individual DAWA calls
      fail-fast: false
      max-parallel: 4  # Higher limit for geocoding (less API intensive)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Download Company and P-Number Data
        uses: actions/download-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/
      
      - name: Download P-Number Data
        uses: actions/download-artifact@v4
        with:
          name: cvr-pnumber-data
          path: /tmp/
      
      - name: Run Address Geocoding
        run: |
          cd backend/pipelines/unified_pipeline
          
          CMD="python -u -m unified_pipeline --source cvr_enrichment --stage address_geocoding --batch-number ${{ matrix.batch }} --total-batches 5"
          
          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi
          
          echo "Running: $CMD"
          $CMD

      - name: Upload Address Geocoding Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-address-data-batch-${{ matrix.batch }}
          path: /tmp/cvr_address_data_batch_*.parquet
          retention-days: 1

  # Step 6: Data Consolidation (Sequential - must run last)
  data_consolidation:
    name: "Data Consolidation"
    runs-on: ubuntu-latest
    needs: [cvr_collection, company_fetching, pnumber_fetching, financial_documents, address_geocoding]
    if: ${{ always() && needs.cvr_collection.outputs.collection_success == 'true' && !contains(github.event.inputs.skip_steps, 'data_consolidation') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Download Company Data
        uses: actions/download-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/
      
      - name: Download P-Number Data
        uses: actions/download-artifact@v4
        with:
          name: cvr-pnumber-data
          path: /tmp/
      
      - name: Download Financial Documents Data (All Batches)
        uses: actions/download-artifact@v4
        with:
          pattern: cvr-financial-data-batch-*
          path: /tmp/
          merge-multiple: true
      
      - name: Download Address Geocoding Data (All Batches)
        uses: actions/download-artifact@v4
        with:
          pattern: cvr-address-data-batch-*
          path: /tmp/
          merge-multiple: true
      
      - name: Run Data Consolidation
        run: |
          cd backend/pipelines/unified_pipeline
          
          CMD="python -u -m unified_pipeline --source cvr_enrichment --stage data_consolidation --total-batches 5"
          
          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi
          
          echo "Running: $CMD"
          $CMD
      
      - name: Pipeline Summary
        if: always()
        run: |
          echo "🎉 CVR Enrichment Pipeline completed!"
          echo "📊 Pipeline Configuration:"
          echo "   • Test limit: ${{ github.event.inputs.test_limit || 'None (full dataset)' }}"
          echo "   • Batch count: 5"
          echo "   • Skipped steps: ${{ github.event.inputs.skip_steps || 'None' }}"
          echo ""
          echo "📋 Steps Status:"
          echo "   • CVR Collection: ${{ needs.cvr_collection.result }}"
          echo "   • Company Fetching: ${{ needs.company_fetching.result }}"
          echo "   • P-Number Fetching: ${{ needs.pnumber_fetching.result }}"
          echo "   • Financial Documents: ${{ needs.financial_documents.result }}"
          echo "   • Address Geocoding: ${{ needs.address_geocoding.result }}"
          echo "   • Data Consolidation: ${{ job.status }}"

  # Notification job (runs regardless of success/failure)
  notify:
    name: "Pipeline Notification"
    runs-on: ubuntu-latest
    needs: [cvr_collection, company_fetching, pnumber_fetching, financial_documents, address_geocoding, data_consolidation]
    if: always()
    
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.data_consolidation.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=CVR Enrichment Pipeline completed successfully! 🎉" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.cvr_collection.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=CVR Enrichment Pipeline failed at collection step ❌" >> $GITHUB_OUTPUT
          else
            echo "status=partial" >> $GITHUB_OUTPUT
            echo "message=CVR Enrichment Pipeline completed with some failures ⚠️" >> $GITHUB_OUTPUT
          fi
      
      - name: Log final status
        run: |
          echo "${{ steps.status.outputs.message }}"
          echo ""
          echo "🔗 View detailed logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"