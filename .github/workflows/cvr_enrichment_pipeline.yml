name: CVR Enrichment Pipeline
# Supports both full pipeline execution and independent step execution
# Use 'run_only_step' to run a single step independently (will fetch latest data from GCS)

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Test limit (number of CVR numbers to process, empty for no limit)'
        required: false
        type: string
      # batch_count:
        # description: 'Number of batches for parallel processing'
        # required: false
        # default: '5'
        # type: string
      skip_steps:
        description: 'Comma-separated list of steps to skip (collection,company_fetching,pnumber_fetching,financial_documents,address_geocoding,data_consolidation)'
        required: false
        type: string
      run_only_step:
        description: 'Run only a specific step independently (collection,company_fetching,pnumber_fetching,financial_documents,address_geocoding,data_consolidation)'
        required: false
        type: choice
        options:
          - ''
          - collection
          - company_fetching
          - pnumber_fetching
          - financial_documents
          - address_geocoding
          - data_consolidation
        default: ''
      log_level:
        description: 'Logging level'
        type: choice
        required: true
        options:
          - INFO
          - DEBUG
          - WARNING
          - ERROR
        default: 'INFO'
  schedule:
    # Run monthly on the 1st at 02:00 UTC
    - cron: '0 2 1 * *'

env:
  BUCKET_NAME: landbrugsdata-raw-data
  PYTHON_VERSION: '3.11'

jobs:
  # Step 1: CVR Collection (Sequential - must run first)
  cvr_collection:
    name: "CVR Collection"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.run_only_step == '' && !contains(github.event.inputs.skip_steps, 'collection')) || github.event.inputs.run_only_step == 'collection' }}
    outputs:
      collection_success: ${{ steps.collection.outputs.success }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Run CVR Collection
        id: collection
        env:
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
          PYTHONUNBUFFERED: 1
        run: |
          cd backend/pipelines/unified_pipeline
          
          # Build command with optional parameters - force unbuffered output
          CMD="python -u -m unified_pipeline --source cvr_enrichment --stage collection"
          
          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi
          
          echo "🚀 Starting CVR Collection Step"
          echo "Running with Log Level: $LOG_LEVEL"
          echo "Running: $CMD"
          echo "🚀 Command starting now..."
          
          # Run command directly like other pipelines - no tee redirection
          $CMD
          
          echo "✅ CVR Collection completed successfully"
          
          # Set outputs
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Upload CVR Collection Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-collection-data
          path: /tmp/cvr_collection_data.parquet
          retention-days: 1

  # Step 2: Company Fetching (Sequential - single job with API-level batching)
  company_fetching:
    name: "Company Fetching"
    runs-on: ubuntu-latest
    needs: cvr_collection
    if: ${{ always() && ((github.event.inputs.run_only_step == '' && needs.cvr_collection.outputs.collection_success == 'true' && !contains(github.event.inputs.skip_steps, 'company_fetching')) || github.event.inputs.run_only_step == 'company_fetching') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Download CVR Collection Data
        if: ${{ github.event.inputs.run_only_step == '' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-collection-data
          path: /tmp/
        continue-on-error: true
      
      - name: Run Company Fetching
        env:
          CVR_USERNAME: ${{ secrets.CVR_USERNAME }}
          CVR_PASSWORD: ${{ secrets.CVR_PASSWORD }}
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
          PYTHONUNBUFFERED: 1
        run: |
          cd backend/pipelines/unified_pipeline
          
          CMD="python -u -m unified_pipeline --source cvr_enrichment --stage company_fetching"
          
          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi
          
          echo "🚀 Starting Company Fetching Step"
          echo "Running with Log Level: $LOG_LEVEL"
          echo "Running: $CMD"
          echo "🚀 Command starting now..."
          
          # Run command directly like other pipelines - no tee redirection
          $CMD
          
          echo "✅ Company Fetching completed successfully"

      - name: Upload Company Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/cvr_company_data.parquet
          retention-days: 1

  # Step 3: P-Number Fetching (Sequential - single job with API-level batching)
  pnumber_fetching:
    name: "P-Number Fetching"
    runs-on: ubuntu-latest
    needs: [cvr_collection, company_fetching]
    if: ${{ always() && ((github.event.inputs.run_only_step == '' && !contains(github.event.inputs.skip_steps, 'pnumber_fetching')) || github.event.inputs.run_only_step == 'pnumber_fetching') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Download Company Data
        if: ${{ github.event.inputs.run_only_step == '' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/
        continue-on-error: true
      
      - name: Run P-Number Fetching
        env:
          CVR_USERNAME: ${{ secrets.CVR_USERNAME }}
          CVR_PASSWORD: ${{ secrets.CVR_PASSWORD }}
        run: |
          cd backend/pipelines/unified_pipeline
          
          CMD="python -u -m unified_pipeline --source cvr_enrichment --stage pnumber_fetching"
          
          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi
          
          echo "Running: $CMD"
          $CMD

      - name: Upload P-Number Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-pnumber-data
          path: /tmp/cvr_pnumber_data.parquet
          retention-days: 1

  # Step 4: Financial Documents (Sequential - process all companies)
  financial_documents:
    name: "Financial Documents"
    runs-on: ubuntu-latest
    needs: [cvr_collection, company_fetching]
    if: ${{ always() && ((github.event.inputs.run_only_step == '' && !contains(github.event.inputs.skip_steps, 'financial_documents')) || github.event.inputs.run_only_step == 'financial_documents') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Download Company Data
        if: ${{ github.event.inputs.run_only_step == '' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/
        continue-on-error: true
      
      - name: Run Financial Documents
        env:
          CVR_USERNAME: ${{ secrets.CVR_USERNAME }}
          CVR_PASSWORD: ${{ secrets.CVR_PASSWORD }}
        run: |
          cd backend/pipelines/unified_pipeline
          
          CMD="python -u -m unified_pipeline --source cvr_enrichment --stage financial_documents"
          
          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi
          
          echo "Running: $CMD"
          $CMD
      
      - name: Create Financial Data Artifact
        run: |
          # Get the latest financial data from GCS and save as artifact
          LATEST_DIR=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment_financial/ | tail -1)
          if [ ! -z "$LATEST_DIR" ]; then
            FINANCIAL_PATH="${LATEST_DIR}data.parquet"
            gsutil cp "$FINANCIAL_PATH" /tmp/cvr_financial_data.parquet
            echo "Created financial artifact from: $FINANCIAL_PATH"
          else
            echo "No financial data found, creating empty artifact"
            touch /tmp/cvr_financial_data.parquet
          fi
      
      - name: Upload Financial Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cvr-financial-data
          path: /tmp/cvr_financial_data.parquet
          retention-days: 1



  # Step 5: Address Geocoding (Sequential - process all addresses)
  address_geocoding:
    name: "Address Geocoding"
    runs-on: ubuntu-latest
    needs: [cvr_collection, company_fetching, pnumber_fetching]
    if: ${{ always() && ((github.event.inputs.run_only_step == '' && !contains(github.event.inputs.skip_steps, 'address_geocoding')) || github.event.inputs.run_only_step == 'address_geocoding') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Download Company and P-Number Data
        if: ${{ github.event.inputs.run_only_step == '' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/
        continue-on-error: true
      
      - name: Download P-Number Data
        if: ${{ github.event.inputs.run_only_step == '' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-pnumber-data
          path: /tmp/
        continue-on-error: true
      
      - name: Run Address Geocoding
        run: |
          cd backend/pipelines/unified_pipeline
          
          CMD="python -u -m unified_pipeline --source cvr_enrichment --stage address_geocoding"
          
          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi
          
          echo "Running: $CMD"
          $CMD
      
      - name: Create Address Data Artifact
        run: |
          # Get the latest address data from GCS and save as artifact
          LATEST_DIR=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment/ | tail -1)
          if [ ! -z "$LATEST_DIR" ]; then
            ADDRESS_PATH="${LATEST_DIR}address_geocoding.parquet"
            gsutil cp "$ADDRESS_PATH" /tmp/cvr_address_data.parquet
            echo "Created address artifact from: $ADDRESS_PATH"
          else
            echo "No address data found, creating empty artifact"
            touch /tmp/cvr_address_data.parquet
          fi
      
      - name: Upload Address Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cvr-address-data
          path: /tmp/cvr_address_data.parquet
          retention-days: 1



  # Step 6: Data Consolidation (Sequential - must run last)
  data_consolidation:
    name: "Data Consolidation"
    runs-on: ubuntu-latest
    needs: [cvr_collection, company_fetching, pnumber_fetching, financial_documents, address_geocoding]
    if: ${{ always() && ((github.event.inputs.run_only_step == '' && needs.cvr_collection.outputs.collection_success == 'true' && !contains(github.event.inputs.skip_steps, 'data_consolidation')) || github.event.inputs.run_only_step == 'data_consolidation') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Download Company Data
        if: ${{ github.event.inputs.run_only_step == '' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/
        continue-on-error: true
      
      - name: Download P-Number Data
        if: ${{ github.event.inputs.run_only_step == '' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-pnumber-data
          path: /tmp/
        continue-on-error: true
      
      - name: Download Financial Data
        if: ${{ github.event.inputs.run_only_step == '' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-financial-data
          path: /tmp/
        continue-on-error: true  # Don't fail if financial data not available
      
      - name: Download Address Data
        if: ${{ github.event.inputs.run_only_step == '' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-address-data
          path: /tmp/
        continue-on-error: true  # Don't fail if address data not available

      
      - name: Run Data Consolidation
        run: |
          cd backend/pipelines/unified_pipeline
          
          CMD="python -u -m unified_pipeline --source cvr_enrichment --stage data_consolidation"
          
          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi
          
          echo "Running: $CMD"
          $CMD
      
      - name: Pipeline Summary
        if: always()
        run: |
          echo "🎉 CVR Enrichment Pipeline completed!"
          echo "📊 Pipeline Configuration:"
          echo "   • Test limit: ${{ github.event.inputs.test_limit || 'None (full dataset)' }}"
          echo "   • Processing mode: Single job (no batching)"
          echo "   • Skipped steps: ${{ github.event.inputs.skip_steps || 'None' }}"
          echo ""
          echo "📋 Steps Status:"
          echo "   • CVR Collection: ${{ needs.cvr_collection.result }}"
          echo "   • Company Fetching: ${{ needs.company_fetching.result }}"
          echo "   • P-Number Fetching: ${{ needs.pnumber_fetching.result }}"
          echo "   • Financial Documents: ${{ needs.financial_documents.result }}"
          echo "   • Address Geocoding: ${{ needs.address_geocoding.result }}"
          echo "   • Data Consolidation: ${{ job.status }}"

  # Notification job (runs regardless of success/failure)
  notify:
    name: "Pipeline Notification"
    runs-on: ubuntu-latest
    needs: [cvr_collection, company_fetching, pnumber_fetching, financial_documents, address_geocoding, data_consolidation]
    if: always()
    
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.data_consolidation.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=CVR Enrichment Pipeline completed successfully! 🎉" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.cvr_collection.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=CVR Enrichment Pipeline failed at collection step ❌" >> $GITHUB_OUTPUT
          else
            echo "status=partial" >> $GITHUB_OUTPUT
            echo "message=CVR Enrichment Pipeline completed with some failures ⚠️" >> $GITHUB_OUTPUT
          fi
      
      - name: Log final status
        run: |
          echo "${{ steps.status.outputs.message }}"
          echo ""
          echo "🔗 View detailed logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"