name: CVR Enrichment Pipeline
# Supports both full pipeline execution and independent step execution
# Use 'run_only_step' to run a single step independently (will fetch latest data from GCS)

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Test limit (number of CVR numbers to process, empty for no limit)'
        required: false
        type: string
      # batch_count:
        # description: 'Number of batches for parallel processing'
        # required: false
        # default: '5'
        # type: string
      skip_steps:
        description: 'Comma-separated list of steps to skip (collection,company_fetching,pnumber_fetching,financial_documents,address_geocoding)'
        required: false
        type: string
      run_only_step:
        description: 'Run only a specific step independently (collection,company_fetching,pnumber_fetching,financial_documents,address_geocoding)'
        required: false
        type: choice
        options:
          - none
          - collection
          - company_fetching
          - pnumber_fetching
          - financial_documents
          - address_geocoding
        default: 'none'
      log_level:
        description: 'Logging level'
        type: choice
        required: true
        options:
          - INFO
          - DEBUG
          - WARNING
          - ERROR
        default: 'INFO'
  schedule:
    # Run monthly on the 1st at 02:00 UTC
    - cron: '0 2 1 * *'

env:
  BUCKET_NAME: landbrugsdata-raw-data
  PYTHON_VERSION: '3.11'
  # Shared timestamp for all pipeline steps to ensure consistent file paths
  PIPELINE_START_TIME: ${{ github.run_started_at }}
  GCS_ACCESS_KEY_ID: ${{ secrets.GCS_ACCESS_KEY_ID }}
  GCS_SECRET_ACCESS_KEY: ${{ secrets.GCS_SECRET_ACCESS_KEY }}

jobs:
  # Step 1: CVR Collection (Sequential - must run first)
  cvr_collection:
    name: "CVR Collection"
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.run_only_step == 'none' && !contains(github.event.inputs.skip_steps, 'collection')) || github.event.inputs.run_only_step == 'collection' }}
    outputs:
      collection_success: ${{ steps.collection.outputs.success }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run CVR Collection
        id: collection
        env:
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
          PYTHONUNBUFFERED: 1
        run: |
          cd backend/pipelines/unified_pipeline

          # Build command with optional parameters - force unbuffered output
          CMD="python -u -m unified_pipeline run -s cvr_enrichment -j collection"

          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi

          echo "🚀 Starting CVR Collection Step"
          echo "Running with Log Level: $LOG_LEVEL"
          echo "Running: $CMD"
          echo "🚀 Command starting now..."

          # Run command directly like other pipelines - no tee redirection
          $CMD

          echo "✅ CVR Collection completed successfully"

          # Set outputs
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Upload CVR Collection Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-collection-data
          path: /tmp/cvr_collection_data.parquet
          retention-days: 1

  # Step 2: Company Fetching (Sequential - single job with API-level batching)
  company_fetching:
    name: "Company Fetching"
    runs-on: ubuntu-latest
    needs: cvr_collection
    if: ${{ !cancelled() && ((github.event.inputs.run_only_step == 'none' && needs.cvr_collection.outputs.collection_success == 'true' && !contains(github.event.inputs.skip_steps, 'company_fetching')) || github.event.inputs.run_only_step == 'company_fetching') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download CVR Collection Data
        if: ${{ github.event.inputs.run_only_step == 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-collection-data
          path: /tmp/
        continue-on-error: true

      - name: Run Company Fetching
        env:
          CVR_USERNAME: ${{ secrets.CVR_USERNAME }}
          CVR_PASSWORD: ${{ secrets.CVR_PASSWORD }}
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
          PYTHONUNBUFFERED: 1
        run: |
          cd backend/pipelines/unified_pipeline

          CMD="python -u -m unified_pipeline run -s cvr_enrichment -j company_fetching"

          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi

          echo "🚀 Starting Company Fetching Step"
          echo "Running with Log Level: $LOG_LEVEL"
          echo "Running: $CMD"
          echo "🚀 Command starting now..."

          # Run command directly like other pipelines - no tee redirection
          $CMD

          echo "✅ Company Fetching completed successfully"

      - name: Verify Company Data Artifact
        run: |
          # Check if the company fetching step already created the artifact file
          if [ -f "/tmp/cvr_company_data.parquet" ]; then
            echo "✅ Company data artifact already exists from the fetching step"
            ls -lh /tmp/cvr_company_data.parquet
          else
            echo "⚠️ Company data artifact not found, looking for latest available data..."

            # Find the latest company data file from today's runs
            LATEST_COMPANY_PATH=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment_companies/*/data.parquet 2>/dev/null | grep "$(date -u +%Y%m%d)" | sort -r | head -1 || echo "")

            if [ -n "$LATEST_COMPANY_PATH" ]; then
              echo "✅ Found latest company file: $LATEST_COMPANY_PATH"
              gsutil cp "$LATEST_COMPANY_PATH" /tmp/cvr_company_data.parquet
              echo "✅ Created company artifact from: $LATEST_COMPANY_PATH"
            else
              echo "⚠️ No company data files found from today"
              echo "Trying to find any recent company data file..."

              # Fallback: find any recent company file
              RECENT_COMPANY_PATH=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment_companies/*/data.parquet 2>/dev/null | sort -r | head -1 || echo "")

              if [ -n "$RECENT_COMPANY_PATH" ]; then
                echo "✅ Found recent company file: $RECENT_COMPANY_PATH"
                gsutil cp "$RECENT_COMPANY_PATH" /tmp/cvr_company_data.parquet
                echo "✅ Created company artifact from recent file: $RECENT_COMPANY_PATH"
              else
                echo "❌ No company data files found at all"
                echo "Creating empty artifact to prevent downstream failures"
                touch /tmp/cvr_company_data.parquet
                echo "Created empty company artifact"
              fi
            fi
          fi

      - name: Upload Company Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/cvr_company_data.parquet
          retention-days: 1

  # Step 3: P-Number Fetching (Sequential - single job with API-level batching)
  pnumber_fetching:
    name: "P-Number Fetching"
    runs-on: ubuntu-latest
    needs: [cvr_collection, company_fetching]
    if: ${{ !cancelled() && ((github.event.inputs.run_only_step == 'none' && !contains(github.event.inputs.skip_steps, 'pnumber_fetching')) || github.event.inputs.run_only_step == 'pnumber_fetching') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Company Data
        if: ${{ github.event.inputs.run_only_step == 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/
        continue-on-error: true

      - name: Run P-Number Fetching
        env:
          CVR_USERNAME: ${{ secrets.CVR_USERNAME }}
          CVR_PASSWORD: ${{ secrets.CVR_PASSWORD }}
        run: |
          cd backend/pipelines/unified_pipeline

          CMD="python -u -m unified_pipeline run -s cvr_enrichment -j pnumber_fetching"

          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Verify P-Number Data Artifact
        run: |
          # Check if the P-number fetching step already created the artifact file
          if [ -f "/tmp/cvr_pnumber_data.parquet" ]; then
            echo "✅ P-number data artifact already exists from the fetching step"
            ls -lh /tmp/cvr_pnumber_data.parquet
          else
            echo "⚠️ P-number data artifact not found, looking for latest available data..."

            # Find the latest P-number data file from today's runs
            LATEST_PNUMBER_PATH=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment_pnumbers/*/data.parquet 2>/dev/null | grep "$(date -u +%Y%m%d)" | sort -r | head -1 || echo "")

            if [ -n "$LATEST_PNUMBER_PATH" ]; then
              echo "✅ Found latest P-number file: $LATEST_PNUMBER_PATH"
              gsutil cp "$LATEST_PNUMBER_PATH" /tmp/cvr_pnumber_data.parquet
              echo "✅ Created P-number artifact from: $LATEST_PNUMBER_PATH"
            else
              echo "⚠️ No P-number data files found from today"
              echo "Trying to find any recent P-number data file..."

              # Fallback: find any recent P-number file
              RECENT_PNUMBER_PATH=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment_pnumbers/*/data.parquet 2>/dev/null | sort -r | head -1 || echo "")

              if [ -n "$RECENT_PNUMBER_PATH" ]; then
                echo "✅ Found recent P-number file: $RECENT_PNUMBER_PATH"
                gsutil cp "$RECENT_PNUMBER_PATH" /tmp/cvr_pnumber_data.parquet
                echo "✅ Created P-number artifact from recent file: $RECENT_PNUMBER_PATH"
              else
                echo "❌ No P-number data files found at all"
                echo "Creating empty artifact to prevent downstream failures"
                touch /tmp/cvr_pnumber_data.parquet
                echo "Created empty P-number artifact"
              fi
            fi
          fi

      - name: Upload P-Number Data
        uses: actions/upload-artifact@v4
        with:
          name: cvr-pnumber-data
          path: /tmp/cvr_pnumber_data.parquet
          retention-days: 1

  # Step 4: Financial Documents (Sequential - process all companies)
  financial_documents:
    name: "Financial Documents"
    runs-on: ubuntu-latest
    needs: [cvr_collection, company_fetching]
    if: ${{ !cancelled() && ((github.event.inputs.run_only_step == 'none' && !contains(github.event.inputs.skip_steps, 'financial_documents')) || github.event.inputs.run_only_step == 'financial_documents') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Company Data
        if: ${{ github.event.inputs.run_only_step == 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/
        continue-on-error: true

      - name: Run Financial Documents
        env:
          CVR_USERNAME: ${{ secrets.CVR_USERNAME }}
          CVR_PASSWORD: ${{ secrets.CVR_PASSWORD }}
        run: |
          cd backend/pipelines/unified_pipeline

          CMD="python -u -m unified_pipeline run -s cvr_enrichment -j financial_documents"

          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Create Financial Data Artifact
        run: |
          echo "🔍 Finding latest financial data..."

          # Find the latest financial data file from today's runs
          LATEST_FINANCIAL_PATH=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment_financial/*/data.parquet 2>/dev/null | grep "$(date -u +%Y%m%d)" | sort -r | head -1 || echo "")

          if [ -n "$LATEST_FINANCIAL_PATH" ]; then
            echo "✅ Found latest financial file: $LATEST_FINANCIAL_PATH"
            gsutil cp "$LATEST_FINANCIAL_PATH" /tmp/cvr_financial_data.parquet
            echo "✅ Created financial artifact from: $LATEST_FINANCIAL_PATH"
          else
            echo "⚠️ No financial data files found from today"
            echo "Trying to find any recent financial data file..."

            # Fallback: find any recent financial file
            RECENT_FINANCIAL_PATH=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment_financial/*/data.parquet 2>/dev/null | sort -r | head -1 || echo "")

            if [ -n "$RECENT_FINANCIAL_PATH" ]; then
              echo "✅ Found recent financial file: $RECENT_FINANCIAL_PATH"
              gsutil cp "$RECENT_FINANCIAL_PATH" /tmp/cvr_financial_data.parquet
              echo "✅ Created financial artifact from recent file: $RECENT_FINANCIAL_PATH"
            else
              echo "❌ No financial data files found at all"
              echo "Creating empty artifact to prevent downstream failures"
              touch /tmp/cvr_financial_data.parquet
              echo "Created empty financial artifact"
            fi
          fi

      - name: Upload Financial Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cvr-financial-data
          path: /tmp/cvr_financial_data.parquet
          retention-days: 1



  # Step 5: Address Geocoding (Sequential - process all addresses)
  address_geocoding:
    name: "Address Geocoding"
    runs-on: ubuntu-latest
    needs: [cvr_collection, company_fetching, pnumber_fetching]
    if: ${{ !cancelled() && ((github.event.inputs.run_only_step == 'none' && !contains(github.event.inputs.skip_steps, 'address_geocoding')) || github.event.inputs.run_only_step == 'address_geocoding') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Company and P-Number Data
        if: ${{ github.event.inputs.run_only_step == 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-company-data
          path: /tmp/
        continue-on-error: true

      - name: Download P-Number Data
        if: ${{ github.event.inputs.run_only_step == 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: cvr-pnumber-data
          path: /tmp/
        continue-on-error: true

      - name: Run Address Geocoding
        run: |
          cd backend/pipelines/unified_pipeline

          CMD="python -u -m unified_pipeline run -s cvr_enrichment -j address_geocoding"

          if [ -n "${{ github.event.inputs.test_limit }}" ]; then
            CMD="$CMD --test-limit ${{ github.event.inputs.test_limit }}"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Create Address Data Artifact
        run: |
          echo "🔍 Finding latest address geocoding data..."

          # Find the latest address geocoding file from today's runs
          LATEST_ADDRESS_PATH=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment/*/address_geocoding.parquet 2>/dev/null | grep "$(date -u +%Y%m%d)" | sort -r | head -1 || echo "")

          if [ -n "$LATEST_ADDRESS_PATH" ]; then
            echo "✅ Found latest address file: $LATEST_ADDRESS_PATH"
            gsutil cp "$LATEST_ADDRESS_PATH" /tmp/cvr_address_data.parquet
            echo "✅ Created address artifact from: $LATEST_ADDRESS_PATH"
          else
            echo "⚠️ No address geocoding files found from today"
            echo "Trying to find any recent address geocoding file..."

            # Fallback: find any recent address file within the last 7 days
            RECENT_ADDRESS_PATH=$(gsutil ls gs://landbrugsdata-raw-data/gold/cvr_enrichment/*/address_geocoding.parquet 2>/dev/null | sort -r | head -1 || echo "")

            if [ -n "$RECENT_ADDRESS_PATH" ]; then
              echo "✅ Found recent address file: $RECENT_ADDRESS_PATH"
              gsutil cp "$RECENT_ADDRESS_PATH" /tmp/cvr_address_data.parquet
              echo "✅ Created address artifact from recent file: $RECENT_ADDRESS_PATH"
            else
              echo "❌ No address geocoding files found at all"
              echo "Creating empty artifact to prevent downstream failures"
              touch /tmp/cvr_address_data.parquet
              echo "Created empty address artifact"
            fi
          fi

      - name: Upload Address Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cvr-address-data
          path: /tmp/cvr_address_data.parquet
          retention-days: 1



  # Step 6: Pipeline Summary (moved from data_consolidation step)
  pipeline_summary:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [cvr_collection, company_fetching, pnumber_fetching, financial_documents, address_geocoding]
    if: always()

    steps:
      - name: Pipeline Summary
        run: |
          echo "🎉 CVR Enrichment Pipeline completed!"
          echo "📊 Pipeline Configuration:"
          echo "   • Test limit: ${{ github.event.inputs.test_limit || 'None (full dataset)' }}"
          echo "   • Processing mode: Single job (no batching)"
          echo "   • Skipped steps: ${{ github.event.inputs.skip_steps || 'None' }}"
          echo ""
          echo "📋 Steps Status:"
          echo "   • CVR Collection: ${{ needs.cvr_collection.result }}"
          echo "   • Company Fetching: ${{ needs.company_fetching.result }}"
          echo "   • P-Number Fetching: ${{ needs.pnumber_fetching.result }}"
          echo "   • Financial Documents: ${{ needs.financial_documents.result }}"
          echo "   • Address Geocoding: ${{ needs.address_geocoding.result }}"
          echo ""
          echo "✅ Data consolidation is now handled directly in the financial documents step"
          echo "   as part of the CVR Enrichment Architecture Redesign"

  # Notification job (runs regardless of success/failure)
  notify:
    name: "Pipeline Notification"
    runs-on: ubuntu-latest
    needs: [cvr_collection, company_fetching, pnumber_fetching, financial_documents, address_geocoding, pipeline_summary]
    if: always()

    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.address_geocoding.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=CVR Enrichment Pipeline completed successfully! 🎉" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.cvr_collection.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=CVR Enrichment Pipeline failed at collection step ❌" >> $GITHUB_OUTPUT
          else
            echo "status=partial" >> $GITHUB_OUTPUT
            echo "message=CVR Enrichment Pipeline completed with some failures ⚠️" >> $GITHUB_OUTPUT
          fi

      - name: Log final status
        run: |
          echo "${{ steps.status.outputs.message }}"
          echo ""
          echo "🔗 View detailed logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
