name: FVM WFS Matrix Download

on:
  workflow_dispatch:
    inputs:
      layer_types:
        description: 'Layer types to process (comma-separated: markblokke,marker,smaabiotoper or "all")'
        required: false
        default: 'all'
      years:
        description: 'Specific years to process (comma-separated, e.g., "2024,2023" or "all")'
        required: false
        default: 'all'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: set-matrix
        run: |
          # Define all layer configurations
          if [ "${{ github.event.inputs.layer_types }}" = "all" ]; then
            layer_types="markblokke,marker,smaabiotoper"
          else
            layer_types="${{ github.event.inputs.layer_types }}"
          fi
          
          # Generate matrix based on layer types and years
          matrix_items=()
          
          for layer_type in $(echo $layer_types | tr ',' ' '); do
            case $layer_type in
              "markblokke")
                if [ "${{ github.event.inputs.years }}" = "all" ]; then
                  years=$(seq 2005 2026)
                else
                  years=$(echo "${{ github.event.inputs.years }}" | tr ',' ' ')
                fi
                ;;
              "marker")
                if [ "${{ github.event.inputs.years }}" = "all" ]; then
                  years=$(seq 2008 2025)
                else
                  years=$(echo "${{ github.event.inputs.years }}" | tr ',' ' ')
                fi
                ;;
              "smaabiotoper")
                if [ "${{ github.event.inputs.years }}" = "all" ]; then
                  years="2023 2024 2025"
                else
                  years=$(echo "${{ github.event.inputs.years }}" | tr ',' ' ')
                fi
                ;;
            esac
            
            for year in $years; do
              # Validate year ranges
              case $layer_type in
                "markblokke")
                  if [ $year -ge 2005 ] && [ $year -le 2026 ]; then
                    matrix_items+=("{\"layer_type\":\"$layer_type\",\"year\":$year}")
                  fi
                  ;;
                "marker")
                  if [ $year -ge 2008 ] && [ $year -le 2025 ]; then
                    matrix_items+=("{\"layer_type\":\"$layer_type\",\"year\":$year}")
                  fi
                  ;;
                "smaabiotoper")
                  if [ $year -ge 2023 ] && [ $year -le 2025 ]; then
                    matrix_items+=("{\"layer_type\":\"$layer_type\",\"year\":$year}")
                  fi
                  ;;
              esac
            done
          done
          
          # Join matrix items
          matrix_json="[$(IFS=','; echo "${matrix_items[*]}")]"
          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
          echo "Generated matrix with ${#matrix_items[@]} jobs:"
          echo "$matrix_json" | jq '.'

  download:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10  # Limit concurrent jobs to avoid overwhelming the FVM server
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    
    name: Download ${{ matrix.layer_type }}_${{ matrix.year }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download FVM WFS Layer
        run: |
          cd backend/pipelines/unified_pipeline
          echo "Downloading ${{ matrix.layer_type }} for year ${{ matrix.year }}"
          python -m unified_pipeline \
            -s fvm_wfs \
            -j bronze \
            --fvm-layer-type ${{ matrix.layer_type }} \
            --fvm-year ${{ matrix.year }}
        timeout-minutes: 30  # Timeout per layer (should be sufficient based on testing)

      - name: Report completion
        if: success()
        run: |
          echo "✅ Successfully downloaded ${{ matrix.layer_type }}_${{ matrix.year }}"
          echo "Data saved to: gs://landbrugsdata-raw-data/bronze/fvm_${{ matrix.layer_type }}_${{ matrix.year }}/"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Failed to download ${{ matrix.layer_type }}_${{ matrix.year }}"
          exit 1

  summary:
    needs: [generate-matrix, download]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download Summary
        run: |
          echo "## FVM WFS Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Layer Type | Years | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # This would need to be enhanced to show actual results
          # For now, just show that the workflow completed
          echo "| All layers | As requested | Completed |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Performance Notes" >> $GITHUB_STEP_SUMMARY
          echo "- Each layer downloads ~400k-600k features in 60-120 seconds" >> $GITHUB_STEP_SUMMARY
          echo "- Matrix jobs run in parallel (max 10 concurrent)" >> $GITHUB_STEP_SUMMARY
          echo "- Total time for all 43 layers: ~15-20 minutes (vs 45+ minutes sequential)" >> $GITHUB_STEP_SUMMARY
          echo "- Data stored in: \`gs://landbrugsdata-raw-data/bronze/fvm_*\`" >> $GITHUB_STEP_SUMMARY 