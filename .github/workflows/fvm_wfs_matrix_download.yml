name: FVM WFS Matrix Download

on:
  workflow_dispatch:
    inputs:
      layer_types:
        description: 'Layer types to process (comma-separated: markblokke,marker,smaabiotoper,organic_areas,organic_subsidies,grassland_subsidies,environmental_subsidies or "all")'
        required: false
        default: 'all'
      years:
        description: 'Specific years to process (comma-separated, e.g., "2024,2023" or "all")'
        required: false
        default: 'all'
      stage:
        description: 'Pipeline stage to run (bronze, silver, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - bronze
          - silver
          - all
  repository_dispatch:
    types: [fvm_wfs_trigger]

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: set-matrix
        run: |
          # Define all layer configurations
          if [ "${{ github.event.inputs.layer_types }}" = "all" ]; then
            layer_types="markblokke,marker,smaabiotoper,organic_areas,organic_subsidies,grassland_subsidies,environmental_subsidies"
          else
            layer_types="${{ github.event.inputs.layer_types }}"
          fi
          
          # Generate matrix based on layer types and years
          matrix_items=()
          
          for layer_type in $(echo $layer_types | tr ',' ' '); do
            case $layer_type in
              "markblokke")
                if [ "${{ github.event.inputs.years }}" = "all" ]; then
                  years=$(seq 2005 2026)
                else
                  years=$(echo "${{ github.event.inputs.years }}" | tr ',' ' ')
                fi
                ;;
              "marker")
                if [ "${{ github.event.inputs.years }}" = "all" ]; then
                  years=$(seq 2008 2025)
                else
                  years=$(echo "${{ github.event.inputs.years }}" | tr ',' ' ')
                fi
                ;;
              "smaabiotoper")
                if [ "${{ github.event.inputs.years }}" = "all" ]; then
                  years="2023 2024 2025"
                else
                  years=$(echo "${{ github.event.inputs.years }}" | tr ',' ' ')
                fi
                ;;
              "organic_areas")
                if [ "${{ github.event.inputs.years }}" = "all" ]; then
                  years=$(seq 2012 2024)
                else
                  years=$(echo "${{ github.event.inputs.years }}" | tr ',' ' ')
                fi
                ;;
              "organic_subsidies")
                if [ "${{ github.event.inputs.years }}" = "all" ]; then
                  years=$(seq 2019 2024)
                else
                  years=$(echo "${{ github.event.inputs.years }}" | tr ',' ' ')
                fi
                ;;
              "grassland_subsidies")
                if [ "${{ github.event.inputs.years }}" = "all" ]; then
                  years=$(seq 2019 2024)
                else
                  years=$(echo "${{ github.event.inputs.years }}" | tr ',' ' ')
                fi
                ;;
              "environmental_subsidies")
                if [ "${{ github.event.inputs.years }}" = "all" ]; then
                  years=$(seq 2019 2023)
                else
                  years=$(echo "${{ github.event.inputs.years }}" | tr ',' ' ')
                fi
                ;;
            esac
            
            for year in $years; do
              # Validate year ranges
              case $layer_type in
                "markblokke")
                  if [ $year -ge 2005 ] && [ $year -le 2026 ]; then
                    matrix_items+=("{\"layer_type\":\"$layer_type\",\"year\":$year}")
                  fi
                  ;;
                "marker")
                  if [ $year -ge 2008 ] && [ $year -le 2025 ]; then
                    matrix_items+=("{\"layer_type\":\"$layer_type\",\"year\":$year}")
                  fi
                  ;;
                "smaabiotoper")
                  if [ $year -ge 2023 ] && [ $year -le 2025 ]; then
                    matrix_items+=("{\"layer_type\":\"$layer_type\",\"year\":$year}")
                  fi
                  ;;
                "organic_areas")
                  if [ $year -ge 2012 ] && [ $year -le 2024 ]; then
                    matrix_items+=("{\"layer_type\":\"$layer_type\",\"year\":$year}")
                  fi
                  ;;
                "organic_subsidies")
                  if [ $year -ge 2019 ] && [ $year -le 2024 ]; then
                    matrix_items+=("{\"layer_type\":\"$layer_type\",\"year\":$year}")
                  fi
                  ;;
                "grassland_subsidies")
                  if [ $year -ge 2019 ] && [ $year -le 2024 ]; then
                    matrix_items+=("{\"layer_type\":\"$layer_type\",\"year\":$year}")
                  fi
                  ;;
                "environmental_subsidies")
                  if [ $year -ge 2019 ] && [ $year -le 2023 ]; then
                    matrix_items+=("{\"layer_type\":\"$layer_type\",\"year\":$year}")
                  fi
                  ;;
              esac
            done
          done
          
          # Join matrix items
          matrix_json="[$(IFS=','; echo "${matrix_items[*]}")]"
          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
          echo "Generated matrix with ${#matrix_items[@]} jobs:"
          echo "$matrix_json" | jq '.'

  process:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10  # Limit concurrent jobs to avoid overwhelming the FVM server
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    
    name: Process ${{ matrix.layer_type }}_${{ matrix.year }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Process FVM WFS Layer
        run: |
          cd backend/pipelines/unified_pipeline
          STAGE="${{ github.event.inputs.stage || github.event.client_payload.stage || 'bronze' }}"
          echo "Processing ${{ matrix.layer_type }} for year ${{ matrix.year }} (stage: $STAGE)"
          python -m unified_pipeline \
            -s fvm_wfs \
            -j "$STAGE" \
            --fvm-layer-type ${{ matrix.layer_type }} \
            --fvm-year ${{ matrix.year }}
        # timeout-minutes: 30  # Removed timeout to allow organic areas processing to complete

      - name: Report completion
        if: success()
        run: |
          STAGE="${{ github.event.inputs.stage || github.event.client_payload.stage || 'bronze' }}"
          echo "✅ Successfully processed ${{ matrix.layer_type }}_${{ matrix.year }} (stage: $STAGE)"
          echo "Data saved to: gs://landbrugsdata-raw-data/$STAGE/fvm_${{ matrix.layer_type }}_${{ matrix.year }}/"

      - name: Report failure
        if: failure()
        run: |
          STAGE="${{ github.event.inputs.stage || github.event.client_payload.stage || 'bronze' }}"
          echo "❌ Failed to process ${{ matrix.layer_type }}_${{ matrix.year }} (stage: $STAGE)"
          exit 1

  organic-enrichment:
    needs: process
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.stage == 'silver' || github.event.inputs.stage == 'all') && always() && !failure() }}
    name: Enrich Fields with Organic Data and Subsidy UUIDs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Field Enrichment
        run: |
          cd backend/pipelines/unified_pipeline
          echo "🌱 Running organic enrichment of marker fields and field UUID enrichment of subsidy fields..."
          python -m unified_pipeline \
            -s fvm_wfs \
            -j silver
        # This will trigger both organic enrichment (2012-2024) and subsidy field UUID enrichment (2019-2024)

      - name: Report enrichment completion
        if: success()
        run: |
          echo "✅ Successfully enriched marker fields with organic data and subsidy fields with field UUIDs"
          echo "🌱 Organic information added to marker fields for all overlapping years"
          echo "🔗 Field UUIDs added to subsidy fields for direct field linkage"

      - name: Report enrichment failure
        if: failure()
        run: |
          echo "❌ Failed to enrich fields with organic data and subsidy UUIDs"
          exit 1

  summary:
    needs: [generate-matrix, process, organic-enrichment]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Processing Summary
        run: |
          STAGE="${{ github.event.inputs.stage || github.event.client_payload.stage || 'bronze' }}"
          echo "## FVM WFS Processing Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Layer Type | Years | Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # This would need to be enhanced to show actual results
          # For now, just show that the workflow completed
          echo "| All layers | As requested | $STAGE | Completed |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Performance Notes" >> $GITHUB_STEP_SUMMARY
          echo "- Each layer processes ~400k-600k features in 60-120 seconds" >> $GITHUB_STEP_SUMMARY
          echo "- Matrix jobs run in parallel (max 10 concurrent)" >> $GITHUB_STEP_SUMMARY
          echo "- Total time for all 73 layers: ~25-30 minutes (vs 70+ minutes sequential)" >> $GITHUB_STEP_SUMMARY
          echo "- Organic enrichment runs after silver processing (adds ~92% organic field coverage)" >> $GITHUB_STEP_SUMMARY
          echo "- Subsidy field UUID enrichment runs after silver processing (enables direct field linkage)" >> $GITHUB_STEP_SUMMARY
          echo "- Data stored in: \`gs://landbrugsdata-raw-data/$STAGE/fvm_*\`" >> $GITHUB_STEP_SUMMARY 