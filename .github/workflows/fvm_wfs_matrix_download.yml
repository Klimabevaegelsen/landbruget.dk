name: FVM WFS Matrix Download

on:
  workflow_dispatch:
    inputs:
      layer_types:
        description: 'Layer types to process (comma-separated: markblokke,marker,smaabiotoper,organic_areas,organic_subsidies,grassland_subsidies,environmental_subsidies or "all")'
        required: false
        default: "all"
      years:
        description: 'Specific years to process (comma-separated, e.g., "2024,2023" or "all")'
        required: false
        default: "all"
      stage:
        description: "Pipeline stage to run (bronze, silver, all)"
        required: false
        default: "all"
        type: choice
        options:
          - bronze
          - silver
          - all
  repository_dispatch:
    types: [fvm_wfs_trigger]


jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      enrichment_years: ${{ steps.set-matrix.outputs.enrichment_years }}
    steps:
      - name: Generate matrix
        id: set-matrix
        shell: bash
        run: |
          INPUT_LAYER_TYPES="${{ github.event.inputs.layer_types || github.event.client_payload.layer_types || 'all' }}"
          INPUT_YEARS="${{ github.event.inputs.years || github.event.client_payload.years || 'all' }}"

          INPUT_LAYER_TYPES="$INPUT_LAYER_TYPES" INPUT_YEARS="$INPUT_YEARS" python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          all_layers = [
              "markblokke",
              "marker",
              "smaabiotoper",
              "organic_areas",
              "organic_subsidies",
              "grassland_subsidies",
              "environmental_subsidies",
          ]

          input_layer_types = os.environ["INPUT_LAYER_TYPES"].strip()
          input_years = os.environ["INPUT_YEARS"].strip()

          if not input_layer_types or input_layer_types == "all":
              layer_types = list(all_layers)
          else:
              layer_types = [layer.strip() for layer in input_layer_types.split(",") if layer.strip()]

          unknown_layers = sorted(set(layer_types) - set(all_layers))
          if unknown_layers:
              raise SystemExit(f"Unknown layer types: {', '.join(unknown_layers)}")

          requested_years = None
          if input_years and input_years != "all":
              requested_years = []
              for value in input_years.split(","):
                  year_str = value.strip()
                  if not year_str:
                      continue
                  if not year_str.isdigit():
                      raise SystemExit(f"Invalid year value '{year_str}' in years input: {input_years}")
                  requested_years.append(int(year_str))
              requested_years = sorted(set(requested_years))
              if not requested_years:
                  raise SystemExit("No valid years found after parsing years input.")

          wfs_url = "https://geodata.fvm.dk/geoserver/wfs"
          capabilities_url = (
              f"{wfs_url}?service=WFS&version=2.0.0&request=GetCapabilities"
          )
          fallback_dynamic_years = {
              "markblokke": list(range(2005, 2027)),
              "marker": list(range(2008, 2027)),
              "smaabiotoper": [2023, 2024, 2025, 2026],
          }
          try:
              with urllib.request.urlopen(capabilities_url, timeout=30) as response:
                  capabilities_xml = response.read().decode("utf-8", errors="ignore")
          except Exception as exc:  # noqa: BLE001
              print(
                  f"Warning: failed to fetch WFS capabilities from {wfs_url}; "
                  f"using configured fallback years: {exc}"
              )
              dynamic_years = fallback_dynamic_years
          else:
              dynamic_years = {
                  "markblokke": sorted(
                      {int(year) for year in re.findall(r"\bMarkblokke:Markblokke_(\d{4})\b", capabilities_xml)}
                  ),
                  "marker": sorted(
                      {int(year) for year in re.findall(r"\bMarker:Marker_(\d{4})\b", capabilities_xml)}
                  ),
                  "smaabiotoper": sorted(
                      {int(year) for year in re.findall(r"\bMarker:Smaabiotoper_(\d{4})\b", capabilities_xml)}
                  ),
              }
              for layer_name in ("markblokke", "marker", "smaabiotoper"):
                  if layer_name in layer_types and not dynamic_years[layer_name]:
                      print(
                          f"Warning: live year discovery returned no {layer_name} years; "
                          "using configured fallback years"
                      )
                      dynamic_years[layer_name] = fallback_dynamic_years[layer_name]

          print("Discovered dynamic year ranges:")
          for layer_name, years in dynamic_years.items():
              if years:
                  print(f"  - {layer_name}: {years[0]}-{years[-1]} ({len(years)} years)")
              else:
                  print(f"  - {layer_name}: none")

          allowed_years_by_layer = {
              "markblokke": dynamic_years["markblokke"],
              "marker": dynamic_years["marker"],
              "smaabiotoper": dynamic_years["smaabiotoper"],
              "organic_areas": list(range(2012, 2026)),
              "organic_subsidies": list(range(2017, 2025)),
              "grassland_subsidies": list(range(2017, 2025)),
              "environmental_subsidies": list(range(2012, 2024)),
          }

          matrix_items = []
          enrichment_years = set()

          for layer_type in layer_types:
              allowed_years = allowed_years_by_layer[layer_type]
              if requested_years is None:
                  years_for_layer = list(allowed_years)
              else:
                  years_for_layer = [year for year in requested_years if year in allowed_years]
                  skipped_years = [year for year in requested_years if year not in allowed_years]
                  if skipped_years:
                      print(
                          f"Skipping unavailable years for {layer_type}: "
                          + ", ".join(str(year) for year in skipped_years)
                      )

              for year in years_for_layer:
                  matrix_items.append({"layer_type": layer_type, "year": year})

                  if layer_type == "markblokke" and 2012 <= year <= 2025:
                      enrichment_years.add(year)
                  elif layer_type == "marker" and 2012 <= year <= 2025:
                      enrichment_years.add(year)
                  elif layer_type == "smaabiotoper" and 2023 <= year <= 2025:
                      enrichment_years.add(year)
                  elif layer_type in {
                      "organic_areas",
                      "organic_subsidies",
                      "grassland_subsidies",
                      "environmental_subsidies",
                  }:
                      enrichment_years.add(year)

          if not matrix_items:
              raise SystemExit(
                  "No valid matrix jobs generated after applying layer/year filters. "
                  "Check requested years and live availability."
              )

          matrix_json = json.dumps(matrix_items)
          enrichment_json = json.dumps(sorted(enrichment_years))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"matrix={matrix_json}\n")
              output_file.write(f"enrichment_years={enrichment_json}\n")

          print(f"Generated matrix with {len(matrix_items)} jobs:")
          print(matrix_json)
          print(f"Generated enrichment years: {sorted(enrichment_years)}")
          print(f"Enrichment matrix will run for {len(enrichment_years)} years.")
          PY

  process:
    needs: generate-matrix
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.stage == 'bronze' || github.event.inputs.stage == 'all' || github.event.inputs.stage == '' }}

    permissions:
      contents: "read"
      id-token: "write"

    strategy:
      fail-fast: false
      max-parallel: 10 # Limit concurrent jobs to avoid overwhelming the FVM server
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    name: Process ${{ matrix.layer_type }}_${{ matrix.year }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .

      - name: Process FVM WFS Layer
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          LANDBRUGSDATA_UUID_NAMESPACE: ${{ secrets.LANDBRUGSDATA_UUID_NAMESPACE }}
        run: |
          cd backend/pipelines/unified_pipeline
          STAGE="${{ github.event.inputs.stage || github.event.client_payload.stage || 'bronze' }}"
          echo "Processing ${{ matrix.layer_type }} for year ${{ matrix.year }} (stage: $STAGE)"

          # Set up signal handling for graceful cancellation
          trap 'echo "Received cancellation signal, stopping..."; kill -TERM $PID 2>/dev/null; wait $PID 2>/dev/null; exit 130' SIGINT SIGTERM

          python -m unified_pipeline run \
            -s fvm_wfs \
            -j "$STAGE" \
            --fvm-layer-type ${{ matrix.layer_type }} \
            --fvm-year ${{ matrix.year }} &

          PID=$!
          wait $PID

      - name: Report completion
        if: success()
        run: |
          STAGE="${{ github.event.inputs.stage || github.event.client_payload.stage || 'bronze' }}"
          echo "✅ Successfully processed ${{ matrix.layer_type }}_${{ matrix.year }} (stage: $STAGE)"
          echo "Data saved to: r2://landbruget-data/$STAGE/fvm_${{ matrix.layer_type }}_${{ matrix.year }}/"

      - name: Report failure
        if: failure()
        run: |
          STAGE="${{ github.event.inputs.stage || github.event.client_payload.stage || 'bronze' }}"
          echo "❌ Failed to process ${{ matrix.layer_type }}_${{ matrix.year }} (stage: $STAGE)"
          exit 1

  enrichment-matrix:
    needs: [generate-matrix, process]
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.stage == 'silver' || github.event.inputs.stage == 'all') && success() }}

    permissions:
      contents: "read"
      id-token: "write"

    strategy:
      fail-fast: false
      max-parallel: 5 # Limit concurrent enrichment jobs
      matrix:
        year: ${{ fromJson(needs.generate-matrix.outputs.enrichment_years) }}

    name: Enrich Fields ${{ matrix.year }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .

      - name: Run Field Enrichment for ${{ matrix.year }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          LANDBRUGSDATA_UUID_NAMESPACE: ${{ secrets.LANDBRUGSDATA_UUID_NAMESPACE }}
        run: |
          cd backend/pipelines/unified_pipeline
          echo "🌱 Running enrichment for year ${{ matrix.year }}..."

          # Set up signal handling for graceful cancellation
          trap 'echo "Received cancellation signal, stopping enrichment..."; kill -TERM $PID 2>/dev/null; wait $PID 2>/dev/null; exit 130' SIGINT SIGTERM

          python -m unified_pipeline run \
            -s fvm_wfs \
            -j enrichment \
            --fvm-year ${{ matrix.year }} &

          PID=$!
          wait $PID

      - name: Report enrichment completion
        if: success()
        run: |
          echo "✅ Successfully enriched fields for year ${{ matrix.year }}"

      - name: Report enrichment failure
        if: failure()
        run: |
          echo "❌ Failed to enrich fields for year ${{ matrix.year }}"
          exit 1

  summary:
    needs: [generate-matrix, enrichment-matrix]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Processing Summary
        run: |
          STAGE="${{ github.event.inputs.stage || github.event.client_payload.stage || 'bronze' }}"
          ENRICHMENT_YEARS="${{ needs.generate-matrix.outputs.enrichment_years }}"
          ENRICHMENT_COUNT=$(echo "$ENRICHMENT_YEARS" | jq 'length')

          echo "## FVM WFS Processing Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Layer Type | Years | Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------|-------|--------|" >> $GITHUB_STEP_SUMMARY

          # This would need to be enhanced to show actual results
          # For now, just show that the workflow completed
          echo "| As requested | ${{ github.event.inputs.years || 'all' }} | $STAGE | Completed |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Performance Notes" >> $GITHUB_STEP_SUMMARY
          echo "- Processing: Matrix jobs run in parallel (max 10 concurrent)" >> $GITHUB_STEP_SUMMARY
          echo "- Each layer processes ~400k-600k features in 60-120 seconds" >> $GITHUB_STEP_SUMMARY
          echo "- Enrichment: $ENRICHMENT_COUNT year matrix jobs run in parallel (max 5 concurrent)" >> $GITHUB_STEP_SUMMARY
          echo "- Enrichment years: $(echo "$ENRICHMENT_YEARS" | jq -r 'join(", ")')" >> $GITHUB_STEP_SUMMARY
          echo "- Each enrichment job processes only its specific year" >> $GITHUB_STEP_SUMMARY
          echo "- Organic enrichment adds ~92% organic field coverage to marker data" >> $GITHUB_STEP_SUMMARY
          echo "- Subsidy UUID enrichment enables direct field linkage for analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Data stored in: \`r2://landbruget-data/$STAGE/fvm_*\`" >> $GITHUB_STEP_SUMMARY
