name: Field Area Analysis Pipeline

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Analysis year (latest = auto-discover most recent)'
        type: choice
        required: true
        options:
          - 'latest'
          - '2025'
          - '2024'
          - '2023'
        default: 'latest'
      
      batch_size:
        description: 'Fields per batch (smaller = less memory usage)'
        type: number
        default: 1000
        
      max_batches:
        description: 'Maximum batches to process (0 for all fields)'
        type: number
        default: 0
        
      log_level:
        description: 'Logging level'
        type: choice
        required: true
        options:
          - INFO
          - DEBUG
          - WARNING
          - ERROR
        default: 'INFO'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 hours for full dataset processing
    
    # Add permissions for GCS access
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      ENVIRONMENT: production

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space for large dataset processing
      run: |
        echo "=== Initial disk usage ==="
        df -h
        
        echo "=== Freeing up disk space ==="
        # Remove unnecessary software to free up space
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/share/swift
        
        # Clean up docker
        sudo docker system prune -af
        sudo docker image prune -af
        
        # Clean up apt cache
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        
        echo "=== Disk usage after cleanup ==="
        df -h
        
        # Check if we have enough space for dataset processing
        AVAILABLE_GB=$(df / | tail -1 | awk '{print int($4/1024/1024)}')
        echo "Available space: ${AVAILABLE_GB}GB"
        
        if [ $AVAILABLE_GB -lt 5 ]; then
          echo "❌ ERROR: Not enough disk space! Available: ${AVAILABLE_GB}GB, Required: ~5GB"
          echo "💡 The pipeline downloads ~2.6GB of data for processing"
          exit 1
        fi
        
        echo "✅ Sufficient disk space available: ${AVAILABLE_GB}GB"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        cd backend/pipelines/field_area_analysis_pipeline
        uv pip install --system .

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Set up environment variables
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        cd backend/pipelines/field_area_analysis_pipeline
        echo "ENVIRONMENT=production" >> .env
        echo "GCS_BUCKET=$GCS_BUCKET" >> .env
        echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
        echo "LOG_LEVEL=${{ inputs.log_level || 'INFO' }}" >> .env
        echo "ANALYSIS_YEAR=${{ inputs.year }}" >> .env
        echo "BATCH_SIZE=${{ inputs.batch_size }}" >> .env

    - name: Run Field Analysis Pipeline
      working-directory: backend/pipelines/field_area_analysis_pipeline
      timeout-minutes: 200  # Set step-level timeout for full dataset
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        # Build command based on inputs
        CMD="python main.py --year ${{ inputs.year }} --batch-size ${{ inputs.batch_size }}"
        
        # Add max batches if specified (0 means process all fields)
        if [[ "${{ inputs.max_batches }}" != "0" ]]; then
          CMD="$CMD --max-batches ${{ inputs.max_batches }}"
          echo "🧪 Running with limited batches: ${{ inputs.max_batches }}"
        else
          echo "🔄 Processing full dataset (~611K fields)"
        fi
        
        echo "Running command: $CMD"
        
        # Monitor disk space and memory during execution
        (while true; do
          sleep 300  # Check every 5 minutes
          echo "$(date): Disk usage: $(df -h . | tail -1)"
          echo "$(date): Memory usage: $(free -h | grep Mem)"
          
          # Check if we're running low on space (less than 1GB)
          AVAILABLE_MB=$(df . | tail -1 | awk '{print int($4/1024)}')
          if [ $AVAILABLE_MB -lt 1024 ]; then
            echo "⚠️ WARNING: Low disk space: ${AVAILABLE_MB}MB remaining"
          fi
        done) &
        MONITOR_PID=$!
        
        # Run the pipeline with timeout handling
        timeout 11400 $CMD || {
          EXIT_CODE=$?
          kill $MONITOR_PID 2>/dev/null || true
          if [ $EXIT_CODE -eq 124 ]; then
            echo "Pipeline timed out after 190 minutes"
            echo "Full dataset processing requires significant time"
          fi
          exit $EXIT_CODE
        }
        
        # Stop monitoring
        kill $MONITOR_PID 2>/dev/null || true
        
        echo "✅ Field Area Analysis Pipeline completed successfully"
        
        # Show final disk usage
        echo "=== Final disk usage ==="
        df -h

    - name: Validate pipeline output
      if: success()
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      run: |
        echo "Validating field area analysis pipeline output..."
        
        # Check if new analysis data exists in GCS
        LATEST_DIR=$(gsutil ls "gs://${GCS_BUCKET}/silver/field_area_analysis/" 2>/dev/null | sort | tail -1 || echo "")
        
        if [ -n "${LATEST_DIR}" ]; then
          echo "✅ Latest analysis directory: ${LATEST_DIR}"
          
          # List all files in the directory to see what's actually there
          echo "Checking directory contents..."
          DIR_CONTENTS=$(gsutil ls "${LATEST_DIR}" 2>/dev/null || echo "")
          
          if [ -n "${DIR_CONTENTS}" ]; then
            echo "${DIR_CONTENTS}"
            
            # Look for any parquet file that matches the expected pattern
            ANALYSIS_FILE=$(echo "${DIR_CONTENTS}" | grep "data\.parquet" | head -1)
            
            if [ -n "${ANALYSIS_FILE}" ]; then
              echo "✅ Found analysis file: ${ANALYSIS_FILE}"
              
              # Get file info
              gsutil stat "${ANALYSIS_FILE}"
              
              # Basic validation - file should be reasonably sized
              FILE_SIZE=$(gsutil stat "${ANALYSIS_FILE}" | grep "Content-Length" | awk '{print $2}')
              if [ "${FILE_SIZE}" -gt 1000000 ]; then  # > 1MB
                echo "✅ Output file size looks reasonable: ${FILE_SIZE} bytes"
              else
                echo "⚠️ Output file seems small: ${FILE_SIZE} bytes"
              fi
            else
              echo "❌ No data.parquet file found in ${LATEST_DIR}"
              echo "Available files:"
              echo "${DIR_CONTENTS}"
              
              # In development/testing, this might be expected if not uploading to GCS
              if [[ "${{ inputs.max_batches }}" != "0" ]]; then
                echo "ℹ️ This was a test run with limited batches - GCS upload may be skipped"
              else
                exit 1
              fi
            fi
          else
            echo "❌ Directory is empty or inaccessible: ${LATEST_DIR}"
            exit 1
          fi
        else
          echo "ℹ️ No field area analysis directories found in GCS"
          echo "This is expected for development runs or if GCS upload is disabled"
          
          # Check local files were created
          if ls backend/pipelines/field_area_analysis_pipeline/silver/*.parquet 1> /dev/null 2>&1; then
            echo "✅ Local output files were created successfully"
            ls -la backend/pipelines/field_area_analysis_pipeline/silver/*.parquet
          else
            echo "❌ No local output files found either"
            exit 1
          fi
        fi

    - name: Upload results summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: field-area-analysis-results-${{ inputs.year }}
        path: |
          backend/pipelines/field_area_analysis_pipeline/silver/*.parquet
          backend/pipelines/field_area_analysis_pipeline/silver/*.json
        retention-days: 30

    - name: Cleanup temporary files
      if: always()
      run: |
        # Clean up temporary cache files
        rm -rf /tmp/field_analysis_cache
        echo "✅ Cleaned up temporary files" 