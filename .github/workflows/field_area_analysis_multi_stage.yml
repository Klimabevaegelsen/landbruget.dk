name: Field Area Analysis Multi-Stage Pipeline

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Specific stage to run (optional)'
        required: false
        type: choice
        options:
          - 'all'
          - 'stage0'
          - 'stage1'
          - 'stage2'
          - 'stage3'
          - 'stage4'
        default: 'all'
      job:
        description: 'Specific job within stage (optional)'
        required: false
        type: string
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 2AM

env:
  ENVIRONMENT: production
  GCS_BUCKET: ${{ secrets.GCS_BUCKET }}

jobs:
  # Stage 0: Pre-filtering (Sequential for memory management)
  stage0-properties-prefilter:
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'stage0' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Properties Pre-filtering (Critical - 90% reduction)
        run: |
          cd backend/pipelines/unified_pipeline
          python -m unified_pipeline.gold.field_area_analysis.cli \
            --stage=0 --job=properties_prefilter

  stage0-wetlands-prefilter:
    needs: stage0-properties-prefilter
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'stage0' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Wetlands Pre-filtering (85% reduction)
        run: |
          cd backend/pipelines/unified_pipeline
          python -m unified_pipeline.gold.field_area_analysis.cli \
            --stage=0 --job=wetlands_prefilter

  stage0-bnbo-prefilter:
    needs: stage0-wetlands-prefilter
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'stage0' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run BNBO Pre-filtering (70% reduction)
        run: |
          cd backend/pipelines/unified_pipeline
          python -m unified_pipeline.gold.field_area_analysis.cli \
            --stage=0 --job=bnbo_prefilter

  stage0-water-projects-prefilter:
    needs: stage0-bnbo-prefilter
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'stage0' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Water Projects Pre-filtering (80% reduction)
        run: |
          cd backend/pipelines/unified_pipeline
          python -m unified_pipeline.gold.field_area_analysis.cli \
            --stage=0 --job=water_projects_prefilter

  # Stage 1: Base Intersections (Parallel - now using pre-filtered data)
  stage1-water-projects-bnbo:
    needs: stage0-water-projects-prefilter
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'stage1' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Water Projects × BNBO Analysis
        run: |
          cd backend/pipelines/unified_pipeline
          python -m unified_pipeline.gold.field_area_analysis.cli \
            --stage=1 --job=water_projects_bnbo

  stage1-water-projects-wetlands:
    needs: stage0-water-projects-prefilter
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'stage1' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Water Projects × Wetlands Analysis
        run: |
          cd backend/pipelines/unified_pipeline
          python -m unified_pipeline.gold.field_area_analysis.cli \
            --stage=1 --job=water_projects_wetlands

  stage1-fields-properties:
    needs: stage0-water-projects-prefilter
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'stage1' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space for memory-intensive processing
        run: |
          echo "=== Initial disk usage ==="
          df -h
          
          echo "=== Freeing up disk space for memory-intensive processing ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          
          sudo docker system prune -af
          sudo docker image prune -af
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          
          echo "=== Disk usage after cleanup ==="
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Fields × Properties Intersection
        run: |
          cd backend/pipelines/unified_pipeline
          python -m unified_pipeline.gold.field_area_analysis.cli \
            --stage=1 --job=fields_properties

      - name: Cleanup temporary files
        if: always()
        run: |
          sudo rm -rf /tmp/duckdb* || true
          find /tmp -type f -size +100M -delete 2>/dev/null || true

  stage1-fields-soil-types:
    needs: stage0-water-projects-prefilter
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'stage1' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Fields × Soil Types Analysis
        run: |
          cd backend/pipelines/unified_pipeline
          python -m unified_pipeline.gold.field_area_analysis.cli \
            --stage=1 --job=fields_soil_types

  # Stage 2: Environmental Coverage (Parallel)
  stage2-fields-bnbo-water:
    needs: [stage1-water-projects-bnbo]
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'stage2' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Fields × BNBO Water Coverage
        run: |
          cd backend/pipelines/unified_pipeline
          python -m unified_pipeline.gold.field_area_analysis.cli \
            --stage=2 --job=fields_bnbo_water

  stage2-fields-wetland-water:
    needs: [stage1-water-projects-wetlands]
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'stage2' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Fields × Wetland Water Coverage
        run: |
          cd backend/pipelines/unified_pipeline
          python -m unified_pipeline.gold.field_area_analysis.cli \
            --stage=2 --job=fields_wetland_water

  # Stage 3: Final Analysis (Parallel)
  stage3-final-bnbo:
    needs: [stage2-fields-bnbo-water, stage1-fields-properties]
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'stage3' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Final BNBO Analysis
        run: |
          cd backend/pipelines/unified_pipeline
          python -m unified_pipeline.gold.field_area_analysis.cli \
            --stage=3 --job=final_bnbo

  stage3-final-wetland:
    needs: [stage2-fields-wetland-water, stage1-fields-properties]
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'stage3' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Final Wetland Analysis
        run: |
          cd backend/pipelines/unified_pipeline
          python -m unified_pipeline.gold.field_area_analysis.cli \
            --stage=3 --job=final_wetland

  # Stage 4: Consolidation
  stage4-consolidate:
    needs: [stage3-final-bnbo, stage3-final-wetland]
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'stage4' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/pipelines/unified_pipeline
          pip install -e .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Consolidate Results
        run: |
          cd backend/pipelines/unified_pipeline
          python -m unified_pipeline.gold.field_area_analysis.cli \
            --stage=4 --job=consolidate

      - name: Pipeline Summary
        if: always()
        run: |
          echo "🎉 Field Area Analysis Multi-Stage Pipeline Completed"
          echo "✅ All stages executed successfully"
          echo "📊 Final consolidated results available in GCS" 