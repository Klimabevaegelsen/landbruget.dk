name: Arbejdstilsynet Inspections Pipeline

on:
  schedule:
    # Run weekly at 6 AM UTC on Mondays
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Logging level'
        type: choice
        required: true
        options:
          - WARNING
          - INFO
          - DEBUG
          - ERROR
        default: 'WARNING'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      LANDBRUGSDATA_UUID_NAMESPACE: ${{ secrets.LANDBRUGSDATA_UUID_NAMESPACE }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install Xvfb (for headless Playwright with headless=False)
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Install dependencies
      run: |
        cd backend/pipelines/arbejdstilsynet_inspections
        uv pip install --system -e . -vvv
        # Install unified pipeline dependencies needed for R2 access
        cd ../unified_pipeline
        uv pip install --system -e . -vvv

    - name: Install Playwright Browsers
      working-directory: backend/pipelines/arbejdstilsynet_inspections
      run: playwright install --with-deps

    - name: Set up environment variables
      working-directory: backend/pipelines/arbejdstilsynet_inspections
      env:
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
      run: |
        if [ -z "$R2_BUCKET" ]; then
          echo "Error: Required secret R2_BUCKET is not set or is empty."
          exit 1
        fi
        echo "R2_BUCKET=$R2_BUCKET" > .env
        echo "Successfully created .env file with R2_BUCKET."

    - name: Run Pipeline
      working-directory: backend/pipelines/arbejdstilsynet_inspections
      run: |
        LOG_LEVEL=${{ inputs.log_level || 'WARNING' }}
        echo "Running pipeline with xvfb-run, Log Level: $LOG_LEVEL"
        xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
          python main.py --log-level "$LOG_LEVEL"

    - name: Handle pipeline failure
      if: failure()
      run: |
        echo "Pipeline failed. Please check the logs above for details."
        exit 1

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pipeline-output
        path: |
          backend/pipelines/arbejdstilsynet_inspections/bronze/data
          backend/pipelines/arbejdstilsynet_inspections/silver/data
        retention-days: 7
