name: Climate Pipeline

concurrency:
  group: climate-pipeline
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Years to process (comma-separated, e.g., "2021,2022,2023")'
        type: string
        default: '2021,2022,2023'
        required: true
      test_limit:
        description: 'Limit CVRs for testing (0 = no limit)'
        type: string
        default: '0'
        required: false
      max_parallel_jobs:
        description: 'Maximum number of parallel year jobs'
        type: string
        default: '3'
        required: true
      dry_run:
        description: 'Dry run mode (discover CVRs only, no calculations)'
        type: boolean
        default: false

env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.parse.outputs.years }}
      year_count: ${{ steps.parse.outputs.year_count }}

    steps:
      - name: Parse years into matrix
        id: parse
        run: |
          # Convert comma-separated years into JSON array
          years_json=$(echo "${{ inputs.years }}" | tr ',' '\n' | sed 's/ //g' | jq -R 'tonumber' | jq -sc '.')
          year_count=$(echo "$years_json" | jq '. | length')

          echo "years=$years_json" >> $GITHUB_OUTPUT
          echo "year_count=$year_count" >> $GITHUB_OUTPUT
          echo "Processing $year_count years: $years_json"

  process-years:
    if: ${{ !inputs.dry_run }}
    needs: prepare-matrix
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    strategy:
      max-parallel: ${{ fromJson(inputs.max_parallel_jobs) }}
      fail-fast: false
      matrix:
        year: ${{ fromJson(needs.prepare-matrix.outputs.years) }}

    name: Carbon Emissions ${{ matrix.year }}

    env:
      ENVIRONMENT: production
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .

      - name: Run carbon emissions for year ${{ matrix.year }}
        run: |
          cd backend/pipelines/unified_pipeline
          echo "Processing carbon emission estimates for year ${{ matrix.year }}..."

          test_limit="${{ inputs.test_limit }}"
          test_limit_flag=""
          if [ "$test_limit" != "0" ] && [ -n "$test_limit" ]; then
            test_limit_flag="--test-limit $test_limit"
          fi

          trap 'echo "Received cancellation signal, stopping..."; kill -TERM $PID 2>/dev/null; wait $PID 2>/dev/null; exit 130' SIGINT SIGTERM

          python -m unified_pipeline run \
            -s carbon_emissions \
            -j gold \
            --year ${{ matrix.year }} \
            $test_limit_flag &

          PID=$!
          wait $PID

      - name: Report completion
        if: success()
        run: |
          echo "Successfully processed carbon emissions for year ${{ matrix.year }}"
          echo "Data saved to: r2://landbruget-data/gold/carbon_emissions_${{ matrix.year }}/"

      - name: Report failure
        if: failure()
        run: |
          echo "Failed to process carbon emissions for year ${{ matrix.year }}"
          exit 1

  dry-run:
    if: ${{ inputs.dry_run }}
    needs: prepare-matrix
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    strategy:
      max-parallel: ${{ fromJson(inputs.max_parallel_jobs) }}
      fail-fast: false
      matrix:
        year: ${{ fromJson(needs.prepare-matrix.outputs.years) }}

    name: Dry Run ${{ matrix.year }}

    env:
      ENVIRONMENT: production
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .

      - name: Discover CVRs for year ${{ matrix.year }}
        run: |
          cd backend/pipelines/unified_pipeline

          python -c "
          import os, sys
          sys.path.insert(0, 'src')
          from unified_pipeline.util.storage_access import StorageAccess
          from unified_pipeline.util.log_util import Logger

          logger = Logger.get_logger()
          storage = StorageAccess()
          bucket = os.getenv('R2_BUCKET', 'landbruget-data')
          year = ${{ matrix.year }}

          # Check Green Accounts
          try:
              gr_files = storage.list_files(f'{bucket}/silver/gr {year}/*/V_4061GR_*_DYRERK_*_pii_handled.parquet')
              logger.info(f'Green Accounts files for {year}: {len(gr_files or [])}')
          except Exception as e:
              logger.warning(f'Green Accounts query failed: {e}')

          # Check FVM
          try:
              fvm_files = storage.list_files(f'{bucket}/silver/fvm_marker_{year}/*/data.parquet')
              logger.info(f'FVM marker files for {year}: {len(fvm_files or [])}')
          except Exception as e:
              logger.warning(f'FVM query failed: {e}')

          logger.info(f'Dry run complete for year {year}')
          "

  summary:
    needs: [prepare-matrix, process-years]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Pipeline Summary
        run: |
          echo "## Climate Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Years Requested | ${{ inputs.years }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Max Parallel Jobs | ${{ inputs.max_parallel_jobs }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Limit | ${{ inputs.test_limit || 'None' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry Run | ${{ inputs.dry_run }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "This was a dry run - no calculations were performed." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Data Location" >> $GITHUB_STEP_SUMMARY
            echo "- **Individual Years**: \`r2://landbruget-data/gold/carbon_emissions_YYYY/{timestamp}/\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Files**: \`emissions.parquet\`, \`categories.parquet\`, \`metadata.json\`" >> $GITHUB_STEP_SUMMARY
          fi
