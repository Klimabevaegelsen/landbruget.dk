# Coordinate Order Verification Tests
# This workflow analyzes coordinate handling in spatial code.
#
# NOTE: After empirical analysis, Danish government data stores coordinates
# that work DIRECTLY with ST_Area_Spheroid (no ST_FlipCoordinates needed).
# Adding ST_FlipCoordinates produces ~79% error vs official Danish area_ha values,
# while direct ST_Area_Spheroid produces only ~1.4% error.

name: Coordinate Verification

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/pipelines/unified_pipeline/src/unified_pipeline/common/geometry_validator.py"
      - "backend/pipelines/unified_pipeline/src/unified_pipeline/gold/field_area_analysis/**/*.py"
      - "backend/pipelines/unified_pipeline/src/tests/common/test_coordinate_verification.py"
      - ".github/workflows/coordinate-verification.yml"
  push:
    branches: [main]
    paths:
      - "backend/pipelines/unified_pipeline/src/unified_pipeline/common/geometry_validator.py"
      - "backend/pipelines/unified_pipeline/src/unified_pipeline/gold/field_area_analysis/**/*.py"

  # Allow manual triggering for testing
  workflow_dispatch:


jobs:
  static-analysis:
    name: Coordinate Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Analyze coordinate handling in changed files
        run: |
          echo "## 🔍 Coordinate Code Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Analyzing coordinate-related code changes in this PR..." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Get list of changed Python files
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- "*.py" | grep -E "(geometry|spatial|coordinate)" || echo "")
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- "*.py" | grep -E "(geometry|spatial|coordinate)" || echo "")
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "ℹ️ No coordinate-related files changed in this PR" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "📁 **Changed coordinate-related files:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$CHANGED_FILES" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            # Analyze each changed file
            for file in $CHANGED_FILES; do
              if [ -f "$file" ]; then
                echo "### 📄 Analysis of \`$file\`" >> "$GITHUB_STEP_SUMMARY"

                # Check for coordinate verification logging
                if grep -q "COORDINATE ORDER VERIFICATION" "$file"; then
                  echo "✅ Contains coordinate order verification logging" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "ℹ️ No coordinate verification logging found" >> "$GITHUB_STEP_SUMMARY"
                fi

                # Check for ST_FlipCoordinates usage
                FLIP_COUNT=$(grep -c "ST_FlipCoordinates" "$file" || echo "0")
                echo "🔄 ST_FlipCoordinates calls: $FLIP_COUNT" >> "$GITHUB_STEP_SUMMARY"

                # Count ST_Area_Spheroid calls (informational - direct usage is correct for Danish data)
                SPHEROID_CALLS=$(grep -c "ST_Area_Spheroid(" "$file" || echo "0")
                if [ "$SPHEROID_CALLS" -gt "0" ]; then
                  echo "📊 ST_Area_Spheroid calls: $SPHEROID_CALLS (direct usage is correct for Danish data)" >> "$GITHUB_STEP_SUMMARY"
                fi
                echo "" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          fi

  code-quality:
    name: Coordinate Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.5

      - name: Check for coordinate-related code issues
        run: |
          echo "## 🔍 Coordinate-Related Code Quality Checks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Count ST_Area_Spheroid calls (informational only)
          # NOTE: Danish data works DIRECTLY with ST_Area_Spheroid - no flipping needed
          SPHEROID_RESULTS=$(grep -r "ST_Area_Spheroid(" --include="*.py" backend/pipelines/unified_pipeline/ 2>/dev/null || true)
          if [ -n "$SPHEROID_RESULTS" ]; then
            SPHEROID_COUNT=$(echo "$SPHEROID_RESULTS" | wc -l || echo "0")
          else
            SPHEROID_COUNT="0"
          fi
          echo "- ST_Area_Spheroid calls in codebase: **$SPHEROID_COUNT**" >> "$GITHUB_STEP_SUMMARY"
          echo "  ℹ️ Danish government data works directly with ST_Area_Spheroid (no coordinate flip needed)" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Check for other spheroid functions
          OTHER_SPHEROID_RESULTS=$(grep -r "ST_.*_Spheroid(" --include="*.py" backend/pipelines/unified_pipeline/ 2>/dev/null | grep -v "ST_Area_Spheroid" || true)
          if [ -n "$OTHER_SPHEROID_RESULTS" ]; then
            OTHER_SPHEROID=$(echo "$OTHER_SPHEROID_RESULTS" | wc -l)
          else
            OTHER_SPHEROID="0"
          fi
          echo "- Other _Spheroid function calls: **$OTHER_SPHEROID**" >> "$GITHUB_STEP_SUMMARY"

          if [ "$OTHER_SPHEROID" -gt "0" ]; then
            echo "  ℹ️ Found other spheroid functions - verify they handle coordinate order correctly" >> "$GITHUB_STEP_SUMMARY"
            echo '  ```' >> "$GITHUB_STEP_SUMMARY"
            echo "$OTHER_SPHEROID_RESULTS" | head -5 >> "$GITHUB_STEP_SUMMARY" || true
            echo '  ```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "  ✅ No other spheroid functions found" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Check for coordinate verification logging
          COORD_VERIFICATION_RESULTS=$(grep -r "COORDINATE ORDER VERIFICATION" --include="*.py" backend/pipelines/unified_pipeline/ 2>/dev/null || true)
          if [ -n "$COORD_VERIFICATION_RESULTS" ]; then
            COORD_VERIFICATION=$(echo "$COORD_VERIFICATION_RESULTS" | wc -l)
          else
            COORD_VERIFICATION="0"
          fi
          echo "- Files with coordinate order verification: **$COORD_VERIFICATION**" >> "$GITHUB_STEP_SUMMARY"

          if [ "$COORD_VERIFICATION" -gt "0" ]; then
            echo "  ✅ Coordinate verification logging is in place" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "  ⚠️ No coordinate verification logging found" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Informational summary
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **Coordinate analysis complete**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Note:** Danish government data is stored with coordinates that work directly with ST_Area_Spheroid." >> "$GITHUB_STEP_SUMMARY"
          echo "Empirical testing showed adding ST_FlipCoordinates produces ~79% error vs official area_ha values." >> "$GITHUB_STEP_SUMMARY"
