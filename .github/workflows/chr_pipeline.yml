name: CHR Pipeline

# Workflow-level concurrency to prevent multiple CHR pipeline runs from interfering
concurrency:
  group: chr-pipeline
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  workflow_dispatch:
    inputs:
      step:
        description: 'Pipeline step to run'
        type: choice
        required: true
        options:
          - all
          - bronze_foundation
          - bronze_data_collection
          - silver_processing
          - gold_processing
          - veterinary_timeline
          - transportation_analysis
          - stamdata
          - herds
          - herd_details
          - diko
          - animal_movements
          - spf_su
          - ejendom
          - vetstat
          - silver_all
        default: 'all'
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        type: string
        required: false
        default: ''
      end_date:
        description: 'End date (YYYY-MM-DD)'
        type: string
        required: false
        default: ''
      year_range:
        description: 'Year range for processing (e.g., "2020-2024" or single year "2023")'
        type: string
        required: false
        default: '2022-2024'
      max_herds:
        description: 'Maximum number of herds to process'
        type: string
        default: ''
      species_codes:
        description: 'Comma-separated list of species codes'
        type: string
        default: ''
      log_level:
        description: 'Logging level'
        type: choice
        required: true
        options:
          - WARNING
          - INFO
          - DEBUG
          - ERROR
        default: 'WARNING'
      show_progress:
        description: 'Show progress information'
        type: boolean
        default: true
      limit_herds_per_species:
        description: 'Limit number of herds processed per species'
        type: string
        default: ''
      max_concurrent_jobs:
        description: 'Maximum number of concurrent matrix jobs'
        type: string
        default: '6'

# Environment variables are set in individual jobs as needed
# Bronze timestamp is generated in the bronze-foundation job and shared via artifacts

jobs:
  # Job 0: Generate Monthly Matrix
  generate-monthly-matrix:
    runs-on: ubuntu-latest
    outputs:
      months: ${{ steps.generate-matrix.outputs.months }}
      process_by_month: ${{ steps.generate-matrix.outputs.process_by_month }}
    steps:
      - name: Generate monthly matrix
        id: generate-matrix
        run: |
          # Determine if we should process by month based on the step
          STEP="${{ inputs.step || 'all' }}"
          YEAR_RANGE="${{ inputs.year_range || '2022-2024' }}"
          
          # Only use monthly matrix for animal_movements or when processing all steps
          if [[ "$STEP" == "all" || "$STEP" == "bronze_data_collection" || "$STEP" == "animal_movements" ]]; then
            PROCESS_BY_MONTH="true"
            
            # Parse year range
            if [[ "$YEAR_RANGE" == *"-"* ]]; then
              START_YEAR=$(echo "$YEAR_RANGE" | cut -d'-' -f1)
              END_YEAR=$(echo "$YEAR_RANGE" | cut -d'-' -f2)
            else
              START_YEAR="$YEAR_RANGE"
              END_YEAR="$YEAR_RANGE"
            fi
            
            # Generate array of months (year-month format)
            MONTHS="["
            FIRST_MONTH=true
            for ((year=START_YEAR; year<=END_YEAR; year++)); do
              for month in {1..12}; do
                if [[ "$FIRST_MONTH" == "false" ]]; then
                  MONTHS="$MONTHS,"
                fi
                MONTHS="$MONTHS\"$year-$(printf "%02d" $month)\""
                FIRST_MONTH=false
              done
            done
            MONTHS="$MONTHS]"
            
            echo "months=$MONTHS" >> $GITHUB_OUTPUT
            echo "process_by_month=true" >> $GITHUB_OUTPUT
            echo "Generated monthly matrix: $MONTHS"
          else
            # For other steps, don't use monthly matrix
            echo "months=[\"single\"]" >> $GITHUB_OUTPUT
            echo "process_by_month=false" >> $GITHUB_OUTPUT
            echo "Not using monthly matrix for step: $STEP"
          fi

  # Job 1: Foundation Steps (stamdata, herds)
  bronze-foundation:
    runs-on: ubuntu-latest
    if: ${{ (inputs.step || 'all') == 'all' || inputs.step == 'bronze_foundation' || inputs.step == 'bronze_data_collection' || inputs.step == 'stamdata' || inputs.step == 'herds' || inputs.step == 'herd_details' || inputs.step == 'diko' || inputs.step == 'animal_movements' || inputs.step == 'spf_su' || inputs.step == 'ejendom' || inputs.step == 'vetstat' }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          # Install unified pipeline dependencies FIRST (needed for GCS access)
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .
          
          # Install CHR pipeline dependencies
          cd ../chr_pipeline
          uv pip install --system -e .

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Set up environment variables
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          FVM_USERNAME: ${{ secrets.FVM_USERNAME }}
          FVM_PASSWORD: ${{ secrets.FVM_PASSWORD }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          cd backend/pipelines/chr_pipeline
          echo "GCS_BUCKET=$GCS_BUCKET" >> .env
          echo "FVM_USERNAME=$FVM_USERNAME" >> .env
          echo "FVM_PASSWORD=$FVM_PASSWORD" >> .env
          echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
          echo "LOCAL_DATA_PATH=/tmp/data" >> .env
          echo "CONTEXT_EXPORT_PATH=/tmp/chr_context.json" >> .env
          
          # Generate proper timestamp in YYYYMMDD_HHMMSS format like other pipelines
          BRONZE_TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          echo "BRONZE_EXPORT_TIMESTAMP=$BRONZE_TIMESTAMP" >> .env
          echo "Bronze timestamp: $BRONZE_TIMESTAMP"
          
          mkdir -p /tmp/data/bronze/chr
          mkdir -p /tmp/data/silver/chr

      - name: Run Foundation Steps
        working-directory: backend/pipelines/chr_pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          # Determine which foundation step to run
          INPUT_STEP="${{ inputs.step || 'all' }}"
          if [[ "$INPUT_STEP" == "all" || "$INPUT_STEP" == "bronze_foundation" || "$INPUT_STEP" == "bronze_data_collection" || "$INPUT_STEP" == "herd_details" || "$INPUT_STEP" == "diko" || "$INPUT_STEP" == "animal_movements" || "$INPUT_STEP" == "spf_su" || "$INPUT_STEP" == "ejendom" || "$INPUT_STEP" == "vetstat" ]]; then
            STEP="herds"  # This will run stamdata -> herds
          elif [[ "$INPUT_STEP" == "stamdata" || "$INPUT_STEP" == "herds" ]]; then
            STEP="$INPUT_STEP"
          else
            echo "Invalid step for bronze-foundation job: $INPUT_STEP"
            exit 1
          fi
          
          LOG_LEVEL="${{ inputs.log_level || 'WARNING' }}"
          SHOW_PROGRESS="${{ inputs.show_progress || 'true' }}"
          
          CMD="python -m main --steps $STEP --log-level $LOG_LEVEL"
          if [[ "$SHOW_PROGRESS" == "true" ]]; then
            CMD="$CMD --progress"
          fi
          if [[ -n "${{ inputs.max_herds }}" ]]; then
            CMD="$CMD --limit-total-herds ${{ inputs.max_herds }}"
          fi
          if [[ -n "${{ inputs.limit_herds_per_species }}" ]]; then
            CMD="$CMD --limit-herds-per-species ${{ inputs.limit_herds_per_species }}"
          fi
          if [[ -n "${{ inputs.species_codes }}" ]]; then
            CMD="$CMD --test-species-codes ${{ inputs.species_codes }}"
          fi
          
          echo "Running foundation command: $CMD"
          $CMD

      - name: Upload context artifact
        uses: actions/upload-artifact@v4
        with:
          name: chr-context-data
          path: /tmp/chr_context.json
          retention-days: 1

      - name: Create bronze timestamp file
        run: |
          # Read the timestamp from the .env file created earlier
          BRONZE_TIMESTAMP=$(grep "BRONZE_EXPORT_TIMESTAMP=" backend/pipelines/chr_pipeline/.env | cut -d'=' -f2)
          echo "$BRONZE_TIMESTAMP" > /tmp/bronze_timestamp.txt
          echo "Bronze timestamp: $BRONZE_TIMESTAMP"

      - name: Upload bronze timestamp artifact
        uses: actions/upload-artifact@v4
        with:
          name: bronze-timestamp
          path: /tmp/bronze_timestamp.txt
          retention-days: 1

      - name: Upload bronze data summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronze-foundation-logs
          path: |
            /tmp/data/
          retention-days: 1

  # Job 2: Parallel Data Collection - Group 1 (diko + spf_su - only need foundation)
  bronze-parallel-group-1:
    runs-on: ubuntu-latest
    needs: bronze-foundation
    if: ${{ (inputs.step || 'all') == 'all' || inputs.step == 'bronze_data_collection' || inputs.step == 'diko' || inputs.step == 'spf_su' }}
    timeout-minutes: 360  # 6 hours timeout to prevent indefinite hanging
    
    permissions:
      contents: 'read'
      id-token: 'write'

    strategy:
      matrix:
        data_type: [diko, spf_su]
      max-parallel: ${{ fromJson(inputs.max_concurrent_jobs || '2') }}  # Limit concurrent jobs to reduce server load

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          # Install unified pipeline dependencies FIRST (needed for GCS access)
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .
          
          # Install CHR pipeline dependencies
          cd ../chr_pipeline
          uv pip install --system -e .

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Download context artifact
        uses: actions/download-artifact@v4
        with:
          name: chr-context-data
          path: /tmp/

      - name: Download bronze timestamp artifact
        uses: actions/download-artifact@v4
        with:
          name: bronze-timestamp
          path: /tmp/

      - name: Set up environment variables
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          FVM_USERNAME: ${{ secrets.FVM_USERNAME }}
          FVM_PASSWORD: ${{ secrets.FVM_PASSWORD }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          cd backend/pipelines/chr_pipeline
          echo "GCS_BUCKET=$GCS_BUCKET" >> .env
          echo "FVM_USERNAME=$FVM_USERNAME" >> .env
          echo "FVM_PASSWORD=$FVM_PASSWORD" >> .env
          echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
          echo "LOCAL_DATA_PATH=/tmp/data" >> .env
          echo "CONTEXT_IMPORT_PATH=/tmp/chr_context.json" >> .env
          
          mkdir -p /tmp/data/bronze/chr
          mkdir -p /tmp/data/silver/chr

      - name: Download Required Bronze Data from GCS
        working-directory: backend/pipelines/chr_pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: |
          # Download the bronze timestamp from artifact to know which folder to download from
          if [ -f "/tmp/bronze_timestamp.txt" ]; then
            BRONZE_TIMESTAMP=$(cat /tmp/bronze_timestamp.txt)
          else
            # If no timestamp file, try to find the latest timestamp from the foundation job
            echo "No bronze timestamp file found, trying to find latest bronze data..."
            BRONZE_TIMESTAMP=$(gsutil ls gs://$GCS_BUCKET/bronze/chr/ | grep -E '/[0-9]{8}_[0-9]{6}/$' | sort | tail -n 1 | sed 's|.*/\([0-9_]*\)/.*|\1|')
            if [ -z "$BRONZE_TIMESTAMP" ]; then
              echo "❌ Could not determine bronze timestamp"
              exit 1
            fi
          fi
          
          echo "📥 Downloading foundation bronze data for parallel job: $BRONZE_TIMESTAMP"
          
          # Create the target directory with the timestamp
          mkdir -p /tmp/data/bronze/chr/$BRONZE_TIMESTAMP
          
          # Download foundation data files that parallel jobs need
          echo "Downloading foundation files from: gs://$GCS_BUCKET/bronze/chr/$BRONZE_TIMESTAMP/"
          
          # Download besaetning_list.json (needed by most steps)
          gsutil cp gs://$GCS_BUCKET/bronze/chr/$BRONZE_TIMESTAMP/besaetning_list.json /tmp/data/bronze/chr/$BRONZE_TIMESTAMP/ 2>/dev/null || echo "⚠️ besaetning_list.json not found (may not be needed)"
          
          # Download stamdata files if they exist
          gsutil cp gs://$GCS_BUCKET/bronze/chr/$BRONZE_TIMESTAMP/stamdata_*.json /tmp/data/bronze/chr/$BRONZE_TIMESTAMP/ 2>/dev/null || echo "⚠️ stamdata files not found (may not be needed)"
          
          # List what we downloaded
          echo "=== Downloaded foundation files ==="
          ls -la /tmp/data/bronze/chr/$BRONZE_TIMESTAMP/ || echo "No files downloaded"
          
          # Set the bronze timestamp for the pipeline to use
          echo "BRONZE_EXPORT_TIMESTAMP=$BRONZE_TIMESTAMP" >> .env

      - name: Run Parallel Group 1 Step
        working-directory: backend/pipelines/chr_pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          CHR_MAX_WORKERS: ${{ inputs.max_concurrent_jobs || '3' }}
          SPF_SU_MAX_WORKERS: '2'
        run: |
          # Skip if this specific step is not requested
          INPUT_STEP="${{ inputs.step || 'all' }}"
          if [[ "$INPUT_STEP" != "all" && "$INPUT_STEP" != "bronze_data_collection" && "$INPUT_STEP" != "${{ matrix.data_type }}" ]]; then
            echo "Skipping ${{ matrix.data_type }} step for this configuration"
            exit 0
          fi
          
          STEP="${{ matrix.data_type }}"
          LOG_LEVEL="${{ inputs.log_level || 'WARNING' }}"
          SHOW_PROGRESS="${{ inputs.show_progress || 'true' }}"
          
          # IMPORTANT: Only run the specific step, not its dependencies
          # Dependencies have already been satisfied by previous jobs and context import
          CMD="python -m main --steps $STEP --log-level $LOG_LEVEL --skip-dependencies"
          if [[ "$SHOW_PROGRESS" == "true" ]]; then
            CMD="$CMD --progress"
          fi
          if [[ -n "${{ inputs.start_date }}" ]]; then
            CMD="$CMD --start-date ${{ inputs.start_date }}"
          fi
          if [[ -n "${{ inputs.end_date }}" ]]; then
            CMD="$CMD --end-date ${{ inputs.end_date }}"
          fi
          if [[ -n "${{ inputs.max_herds }}" ]]; then
            CMD="$CMD --limit-total-herds ${{ inputs.max_herds }}"
          fi
          if [[ -n "${{ inputs.limit_herds_per_species }}" ]]; then
            CMD="$CMD --limit-herds-per-species ${{ inputs.limit_herds_per_species }}"
          fi
          if [[ -n "${{ inputs.species_codes }}" ]]; then
            CMD="$CMD --test-species-codes ${{ inputs.species_codes }}"
          fi
          
          echo "Running parallel group 1 command for ${{ matrix.data_type }}: $CMD"
          $CMD

  # Job 2b: Animal Movements by Month (MONTHLY MATRIX PROCESSING)
  bronze-animal-movements-by-month:
    runs-on: ubuntu-latest
    needs: [bronze-foundation, generate-monthly-matrix]
    if: ${{ needs.generate-monthly-matrix.outputs.process_by_month == 'true' && ((inputs.step || 'all') == 'all' || inputs.step == 'bronze_data_collection' || inputs.step == 'animal_movements') }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    strategy:
      matrix:
        month: ${{ fromJson(needs.generate-monthly-matrix.outputs.months) }}
      fail-fast: false  # Continue processing other months even if one fails
      max-parallel: ${{ fromJson(inputs.max_concurrent_jobs || '6') }}  # Limit concurrent monthly jobs to prevent overwhelming the server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          # Install unified pipeline dependencies FIRST (needed for GCS access)
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .
          
          # Install CHR pipeline dependencies
          cd ../chr_pipeline
          uv pip install --system -e .

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Download context artifact
        uses: actions/download-artifact@v4
        with:
          name: chr-context-data
          path: /tmp/

      - name: Download bronze timestamp artifact
        uses: actions/download-artifact@v4
        with:
          name: bronze-timestamp
          path: /tmp/

      - name: Set up environment variables
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          FVM_USERNAME: ${{ secrets.FVM_USERNAME }}
          FVM_PASSWORD: ${{ secrets.FVM_PASSWORD }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          cd backend/pipelines/chr_pipeline
          echo "GCS_BUCKET=$GCS_BUCKET" >> .env
          echo "FVM_USERNAME=$FVM_USERNAME" >> .env
          echo "FVM_PASSWORD=$FVM_PASSWORD" >> .env
          echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
          echo "LOCAL_DATA_PATH=/tmp/data" >> .env
          echo "CONTEXT_IMPORT_PATH=/tmp/chr_context.json" >> .env
          
          # Use the shared bronze timestamp from foundation job
          BRONZE_TIMESTAMP=$(cat /tmp/bronze_timestamp.txt)
          echo "BRONZE_EXPORT_TIMESTAMP=$BRONZE_TIMESTAMP" >> .env
          echo "Using shared bronze timestamp: $BRONZE_TIMESTAMP"
          
          mkdir -p /tmp/data/bronze/chr
          mkdir -p /tmp/data/silver/chr

      - name: Run Animal Movements for Month ${{ matrix.month }}
        working-directory: backend/pipelines/chr_pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          CHR_MAX_WORKERS: ${{ inputs.max_concurrent_jobs || '3' }}
          CONTEXT_IMPORT_PATH: /tmp/chr_context.json
        run: |
          MONTH="${{ matrix.month }}"
          
          # Import context from foundation job
          
          # Parse month format (e.g., "2023-06") and set monthly date range
          YEAR=$(echo "$MONTH" | cut -d'-' -f1)
          MONTH_NUM=$(echo "$MONTH" | cut -d'-' -f2)
          
          # Calculate first and last day of the month
          START_DATE="$YEAR-$MONTH_NUM-01"
          
          # Calculate last day of month (handle leap years and different month lengths)
          if [[ "$MONTH_NUM" == "02" ]]; then
            # February - check for leap year
            if [[ $((YEAR % 4)) -eq 0 && ($((YEAR % 100)) -ne 0 || $((YEAR % 400)) -eq 0) ]]; then
              END_DATE="$YEAR-$MONTH_NUM-29"
            else
              END_DATE="$YEAR-$MONTH_NUM-28"
            fi
          elif [[ "$MONTH_NUM" == "04" || "$MONTH_NUM" == "06" || "$MONTH_NUM" == "09" || "$MONTH_NUM" == "11" ]]; then
            # April, June, September, November - 30 days
            END_DATE="$YEAR-$MONTH_NUM-30"
          else
            # All other months - 31 days
            END_DATE="$YEAR-$MONTH_NUM-31"
          fi
          
          echo "Processing animal movements for month $MONTH ($START_DATE to $END_DATE)"
          
          # Determine additional arguments
          ARGS=""
          if [[ "${{ inputs.max_herds }}" != "" ]]; then
            ARGS="$ARGS --limit-total-herds ${{ inputs.max_herds }}"
          fi
          if [[ "${{ inputs.species_codes }}" != "" ]]; then
            ARGS="$ARGS --test-species-codes ${{ inputs.species_codes }}"
          fi
          if [[ "${{ inputs.limit_herds_per_species }}" != "" ]]; then
            ARGS="$ARGS --limit-herds-per-species ${{ inputs.limit_herds_per_species }}"
          fi
          if [[ "${{ inputs.show_progress }}" == "true" ]]; then
            ARGS="$ARGS --progress"
          fi
          
          # Build command
          CMD="python -m main --steps animal_movements --start-date $START_DATE --end-date $END_DATE --skip-dependencies --log-level ${{ inputs.log_level || 'WARNING' }} $ARGS"
          
          echo "Running animal movements command for month $MONTH: $CMD"
          
          # Execute command
          $CMD
          
          if [[ $? -eq 0 ]]; then
            echo "✅ Successfully processed animal movements for month ${{ matrix.month }}"
          else
            echo "❌ Failed to process animal movements for month ${{ matrix.month }}"
            exit 1
          fi

  # Job 2c: Animal Movements Fallback (when monthly matrix is not used)
  bronze-animal-movements-fallback:
    runs-on: ubuntu-latest
    needs: [bronze-foundation, generate-monthly-matrix]
    if: ${{ needs.generate-monthly-matrix.outputs.process_by_month == 'false' && inputs.step == 'animal_movements' }}
    timeout-minutes: 360  # 6 hours timeout for fallback
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          # Install unified pipeline dependencies FIRST (needed for GCS access)
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .
          
          # Install CHR pipeline dependencies
          cd ../chr_pipeline
          uv pip install --system -e .

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Download context artifact
        uses: actions/download-artifact@v4
        with:
          name: chr-context-data
          path: /tmp/

      - name: Download bronze timestamp artifact
        uses: actions/download-artifact@v4
        with:
          name: bronze-timestamp
          path: /tmp/

      - name: Set up environment variables
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          FVM_USERNAME: ${{ secrets.FVM_USERNAME }}
          FVM_PASSWORD: ${{ secrets.FVM_PASSWORD }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          cd backend/pipelines/chr_pipeline
          echo "GCS_BUCKET=$GCS_BUCKET" >> .env
          echo "FVM_USERNAME=$FVM_USERNAME" >> .env
          echo "FVM_PASSWORD=$FVM_PASSWORD" >> .env
          echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
          echo "LOCAL_DATA_PATH=/tmp/data" >> .env
          echo "CONTEXT_IMPORT_PATH=/tmp/chr_context.json" >> .env
          
          # Use the shared bronze timestamp from foundation job
          BRONZE_TIMESTAMP=$(cat /tmp/bronze_timestamp.txt)
          echo "BRONZE_EXPORT_TIMESTAMP=$BRONZE_TIMESTAMP" >> .env
          echo "Using shared bronze timestamp: $BRONZE_TIMESTAMP"
          
          mkdir -p /tmp/data/bronze/chr
          mkdir -p /tmp/data/silver/chr

      - name: Run Animal Movements (Traditional Mode)
        working-directory: backend/pipelines/chr_pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          LOG_LEVEL="${{ inputs.log_level || 'WARNING' }}"
          SHOW_PROGRESS="${{ inputs.show_progress || 'true' }}"
          
          echo "Processing animal movements in traditional mode (not month-based)"
          
          # IMPORTANT: Only run the animal_movements step, not its dependencies
          CMD="python -m main --steps animal_movements --log-level $LOG_LEVEL --skip-dependencies"
          if [[ "$SHOW_PROGRESS" == "true" ]]; then
            CMD="$CMD --progress"
          fi
          if [[ -n "${{ inputs.start_date }}" ]]; then
            CMD="$CMD --start-date ${{ inputs.start_date }}"
          fi
          if [[ -n "${{ inputs.end_date }}" ]]; then
            CMD="$CMD --end-date ${{ inputs.end_date }}"
          fi
          if [[ -n "${{ inputs.max_herds }}" ]]; then
            CMD="$CMD --limit-total-herds ${{ inputs.max_herds }}"
          fi
          if [[ -n "${{ inputs.limit_herds_per_species }}" ]]; then
            CMD="$CMD --limit-herds-per-species ${{ inputs.limit_herds_per_species }}"
          fi
          if [[ -n "${{ inputs.species_codes }}" ]]; then
            CMD="$CMD --test-species-codes ${{ inputs.species_codes }}"
          fi
          
          echo "Running animal movements command (traditional): $CMD"
          $CMD

  # Job 3: Herd Details (needs foundation, required by ejendom + vetstat)
  bronze-herd-details:
    runs-on: ubuntu-latest
    needs: bronze-foundation
    if: ${{ (inputs.step || 'all') == 'all' || inputs.step == 'bronze_data_collection' || inputs.step == 'herd_details' || inputs.step == 'ejendom' || inputs.step == 'vetstat' }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          # Install unified pipeline dependencies FIRST (needed for GCS access)
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .
          
          # Install CHR pipeline dependencies
          cd ../chr_pipeline
          uv pip install --system -e .

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Download context artifact
        uses: actions/download-artifact@v4
        with:
          name: chr-context-data
          path: /tmp/

      - name: Download bronze timestamp artifact
        uses: actions/download-artifact@v4
        with:
          name: bronze-timestamp
          path: /tmp/

      - name: Set up environment variables
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          FVM_USERNAME: ${{ secrets.FVM_USERNAME }}
          FVM_PASSWORD: ${{ secrets.FVM_PASSWORD }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          cd backend/pipelines/chr_pipeline
          echo "GCS_BUCKET=$GCS_BUCKET" >> .env
          echo "FVM_USERNAME=$FVM_USERNAME" >> .env
          echo "FVM_PASSWORD=$FVM_PASSWORD" >> .env
          echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
          echo "LOCAL_DATA_PATH=/tmp/data" >> .env
          echo "CONTEXT_IMPORT_PATH=/tmp/chr_context.json" >> .env
          echo "CONTEXT_EXPORT_PATH=/tmp/chr_context_with_details.json" >> .env
          
          # Use the shared bronze timestamp from foundation job
          BRONZE_TIMESTAMP=$(cat /tmp/bronze_timestamp.txt)
          echo "BRONZE_EXPORT_TIMESTAMP=$BRONZE_TIMESTAMP" >> .env
          echo "Using shared bronze timestamp: $BRONZE_TIMESTAMP"
          
          mkdir -p /tmp/data/bronze/chr
          mkdir -p /tmp/data/silver/chr

      - name: Run Herd Details Step
        working-directory: backend/pipelines/chr_pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          LOG_LEVEL="${{ inputs.log_level || 'WARNING' }}"
          SHOW_PROGRESS="${{ inputs.show_progress || 'true' }}"
          
          # IMPORTANT: Only run the herd_details step, not its dependencies
          # Dependencies have already been satisfied by the foundation job and context import
          CMD="python -m main --steps herd_details --log-level $LOG_LEVEL --skip-dependencies"
          if [[ "$SHOW_PROGRESS" == "true" ]]; then
            CMD="$CMD --progress"
          fi
          if [[ -n "${{ inputs.max_herds }}" ]]; then
            CMD="$CMD --limit-total-herds ${{ inputs.max_herds }}"
          fi
          if [[ -n "${{ inputs.limit_herds_per_species }}" ]]; then
            CMD="$CMD --limit-herds-per-species ${{ inputs.limit_herds_per_species }}"
          fi
          if [[ -n "${{ inputs.species_codes }}" ]]; then
            CMD="$CMD --test-species-codes ${{ inputs.species_codes }}"
          fi
          
          echo "Running herd details command: $CMD"
          $CMD

      - name: Upload updated context artifact
        uses: actions/upload-artifact@v4
        with:
          name: chr-context-with-details
          path: /tmp/chr_context_with_details.json
          retention-days: 1

  # Job 4: Parallel Data Collection - Group 2 (ejendom + vetstat - need herd_details)
  bronze-parallel-group-2:
    runs-on: ubuntu-latest
    needs: bronze-herd-details
    if: ${{ (inputs.step || 'all') == 'all' || inputs.step == 'bronze_data_collection' || inputs.step == 'ejendom' || inputs.step == 'vetstat' }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    strategy:
      matrix:
        data_type: [ejendom, vetstat]
      max-parallel: ${{ fromJson(inputs.max_concurrent_jobs || '2') }}  # Limit concurrent jobs to reduce server load

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          # Install unified pipeline dependencies FIRST (needed for GCS access)
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .
          
          # Install CHR pipeline dependencies
          cd ../chr_pipeline
          uv pip install --system -e .

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Download context artifact
        uses: actions/download-artifact@v4
        with:
          name: chr-context-with-details
          path: /tmp/

      - name: Download bronze timestamp artifact
        uses: actions/download-artifact@v4
        with:
          name: bronze-timestamp
          path: /tmp/

      - name: Set up environment variables
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          FVM_USERNAME: ${{ secrets.FVM_USERNAME }}
          FVM_PASSWORD: ${{ secrets.FVM_PASSWORD }}
          VETSTAT_CERTIFICATE: ${{ secrets.VETSTAT_CERTIFICATE }}
          VETSTAT_CERTIFICATE_PASSWORD: ${{ secrets.VETSTAT_CERTIFICATE_PASSWORD }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          cd backend/pipelines/chr_pipeline
          echo "GCS_BUCKET=$GCS_BUCKET" >> .env
          echo "FVM_USERNAME=$FVM_USERNAME" >> .env
          echo "FVM_PASSWORD=$FVM_PASSWORD" >> .env
          echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
          echo "LOCAL_DATA_PATH=/tmp/data" >> .env
          
          # Add VetStat credentials if provided
          if [[ -n "$VETSTAT_CERTIFICATE" ]]; then
            echo "VETSTAT_CERTIFICATE=$VETSTAT_CERTIFICATE" >> .env
          fi
          if [[ -n "$VETSTAT_CERTIFICATE_PASSWORD" ]]; then
            echo "VETSTAT_CERTIFICATE_PASSWORD=$VETSTAT_CERTIFICATE_PASSWORD" >> .env
          fi
          
          # Read the bronze timestamp from the artifact
          BRONZE_TIMESTAMP=$(cat /tmp/bronze_timestamp.txt)
          echo "BRONZE_EXPORT_TIMESTAMP=$BRONZE_TIMESTAMP" >> .env
          echo "Using shared bronze timestamp: $BRONZE_TIMESTAMP"
          
          # Create local directories
          mkdir -p /tmp/data/bronze/chr/$BRONZE_TIMESTAMP
          mkdir -p /tmp/data/silver/chr

      - name: Download bronze data from GCS
        run: |
          cd backend/pipelines/chr_pipeline
          
          # Read the bronze timestamp
          BRONZE_TIMESTAMP=$(cat /tmp/bronze_timestamp.txt)
          echo "Downloading bronze data for timestamp: $BRONZE_TIMESTAMP"
          
          # Download all bronze files from GCS
          gsutil -m cp -r gs://${{ secrets.GCS_BUCKET }}/bronze/chr/$BRONZE_TIMESTAMP/* /tmp/data/bronze/chr/$BRONZE_TIMESTAMP/ || echo "Some bronze files may not exist (this is normal for optional steps)"
          
          # List what was downloaded
          echo "Downloaded bronze files:"
          ls -la /tmp/data/bronze/chr/$BRONZE_TIMESTAMP/ || echo "No files downloaded"
          echo "CONTEXT_IMPORT_PATH=/tmp/chr_context_with_details.json" >> .env
          
          # Set up VetStat credentials if provided
          if [[ -n "$VETSTAT_CERTIFICATE" ]]; then
            echo "VETSTAT_CERTIFICATE=$VETSTAT_CERTIFICATE" >> .env
          fi
          if [[ -n "$VETSTAT_CERTIFICATE_PASSWORD" ]]; then
            echo "VETSTAT_CERTIFICATE_PASSWORD=$VETSTAT_CERTIFICATE_PASSWORD" >> .env
          fi
          
          mkdir -p /tmp/data/bronze/chr
          mkdir -p /tmp/data/silver/chr

      - name: Run Parallel Group 2 Step
        working-directory: backend/pipelines/chr_pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          CHR_MAX_WORKERS: ${{ inputs.max_concurrent_jobs || '3' }}
          SPF_SU_MAX_WORKERS: '2'
        run: |
          # Skip if this specific step is not requested
          INPUT_STEP="${{ inputs.step || 'all' }}"
          if [[ "$INPUT_STEP" != "all" && "$INPUT_STEP" != "bronze_data_collection" && "$INPUT_STEP" != "${{ matrix.data_type }}" ]]; then
            echo "Skipping ${{ matrix.data_type }} step for this configuration"
            exit 0
          fi
          
          STEP="${{ matrix.data_type }}"
          LOG_LEVEL="${{ inputs.log_level || 'WARNING' }}"
          SHOW_PROGRESS="${{ inputs.show_progress || 'true' }}"
          
          # IMPORTANT: Only run the specific step, not its dependencies
          # Dependencies have already been satisfied by previous jobs and context import
          CMD="python -m main --steps $STEP --log-level $LOG_LEVEL --skip-dependencies"
          if [[ "$SHOW_PROGRESS" == "true" ]]; then
            CMD="$CMD --progress"
          fi
          if [[ -n "${{ inputs.start_date }}" ]]; then
            CMD="$CMD --start-date ${{ inputs.start_date }}"
          fi
          if [[ -n "${{ inputs.end_date }}" ]]; then
            CMD="$CMD --end-date ${{ inputs.end_date }}"
          fi
          if [[ -n "${{ inputs.max_herds }}" ]]; then
            CMD="$CMD --limit-total-herds ${{ inputs.max_herds }}"
          fi
          if [[ -n "${{ inputs.limit_herds_per_species }}" ]]; then
            CMD="$CMD --limit-herds-per-species ${{ inputs.limit_herds_per_species }}"
          fi
          if [[ -n "${{ inputs.species_codes }}" ]]; then
            CMD="$CMD --test-species-codes ${{ inputs.species_codes }}"
          fi
          
          echo "Running parallel group 2 command for $STEP: $CMD"
          $CMD



  # Job 5: Silver Processing
  silver-processing:
    runs-on: ubuntu-latest
    needs: [bronze-foundation, bronze-parallel-group-1, bronze-animal-movements-by-month, bronze-herd-details, bronze-parallel-group-2]
    if: ${{ always() && !cancelled() && ((inputs.step || 'all') == 'all' || inputs.step == 'silver_processing' || startsWith(inputs.step, 'silver_')) }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          # Install unified pipeline dependencies FIRST (needed for GCS access)
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .
          
          # Install CHR pipeline dependencies
          cd ../chr_pipeline
          uv pip install --system -e .

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Download bronze timestamp artifact
        uses: actions/download-artifact@v4
        with:
          name: bronze-timestamp
          path: /tmp/

      - name: Set up environment variables (NO FVM CREDENTIALS)
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          cd backend/pipelines/chr_pipeline
          
          # Read the bronze timestamp from artifact
          BRONZE_TIMESTAMP=$(cat /tmp/bronze_timestamp.txt)
          echo "Using bronze timestamp from artifact: $BRONZE_TIMESTAMP"
          
          # Set up environment WITHOUT FVM credentials (silver doesn't need them)
          echo "GCS_BUCKET=$GCS_BUCKET" >> .env
          echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
          echo "LOCAL_DATA_PATH=/tmp/data" >> .env
          
          mkdir -p /tmp/data/bronze/chr
          mkdir -p /tmp/data/silver/chr

      - name: Verify Bronze Data Exists in GCS (Streaming Mode)
        working-directory: backend/pipelines/chr_pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: |
          # Read the bronze timestamp from artifact
          BRONZE_TIMESTAMP=$(cat /tmp/bronze_timestamp.txt)
          echo "🚀 STREAMING MODE: Verifying bronze data exists in GCS for timestamp: $BRONZE_TIMESTAMP"
          
          # Just verify the data exists in GCS - DON'T download it
          echo "Checking GCS path: gs://$GCS_BUCKET/bronze/chr/$BRONZE_TIMESTAMP/"
          gsutil ls gs://$GCS_BUCKET/bronze/chr/$BRONZE_TIMESTAMP/ | head -10 || {
            echo "❌ No bronze data found in GCS for timestamp: $BRONZE_TIMESTAMP"
            echo "Available timestamp folders:"
            gsutil ls gs://$GCS_BUCKET/bronze/chr/ | head -10
            exit 1
          }
          
          echo "✅ Bronze data verified in GCS - will be processed via streaming mode"
          echo "🔥 NO LOCAL DOWNLOAD - Using direct GCS access for memory efficiency"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          # Install unified pipeline dependencies FIRST (needed for GCS access)
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .
          
          # Install CHR pipeline dependencies
          cd ../chr_pipeline
          uv pip install --system -e .

      - id: 'auth-silver'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Run silver processing (Streaming Mode)
        working-directory: backend/pipelines/chr_pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          CHR_FORCE_STREAMING: "true"
          GITHUB_ACTIONS: "true"
        run: |
          # Read the bronze timestamp from artifact
          BRONZE_TIMESTAMP=$(cat /tmp/bronze_timestamp.txt)
          echo "🚀 STREAMING MODE: Using bronze timestamp from artifact: $BRONZE_TIMESTAMP"
          
          # NO BRONZE_DATE_FOLDER_OVERRIDE - this forces streaming mode
          echo "🔥 Forcing streaming mode - no local file fallbacks"
          
          # Determine which silver step to run
          INPUT_STEP="${{ inputs.step || 'all' }}"
          if [[ "$INPUT_STEP" == "all" || "$INPUT_STEP" == "silver_processing" ]]; then
            STEP="silver_all"
          else
            STEP="$INPUT_STEP"
          fi
          
          LOG_LEVEL="${{ inputs.log_level || 'WARNING' }}"
          SHOW_PROGRESS="${{ inputs.show_progress || 'true' }}"
          
          CMD="python -m main --steps $STEP --log-level $LOG_LEVEL"
          if [[ "$SHOW_PROGRESS" == "true" ]]; then
            CMD="$CMD --progress"
          fi
          
          echo "🚀 Running silver processing in STREAMING MODE: $CMD"
          echo "📊 Processing data directly from GCS without local downloads"
          $CMD

  # Job 6: Gold Processing (Veterinary Timeline + Transportation Analysis)
  gold-processing:
    runs-on: ubuntu-latest
    needs: [silver-processing]
    if: ${{ always() && !cancelled() && (needs.silver-processing.result == 'success' || inputs.step == 'gold_processing' || inputs.step == 'veterinary_timeline' || inputs.step == 'transportation_analysis') && ((inputs.step || 'all') == 'all' || inputs.step == 'gold_processing' || inputs.step == 'veterinary_timeline' || inputs.step == 'transportation_analysis') }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          # Install unified pipeline dependencies FIRST (needed for GCS access)
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .
          
          # Install CHR pipeline dependencies
          cd ../chr_pipeline
          uv pip install --system -e .

      - id: 'auth-gold'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Set up environment variables
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          cd backend/pipelines/chr_pipeline
          
          # Set up environment for gold processing
          echo "GCS_BUCKET=$GCS_BUCKET" >> .env
          echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
          echo "LOCAL_DATA_PATH=/tmp/data" >> .env
          
          mkdir -p /tmp/data/silver/chr
          mkdir -p /tmp/data/gold/chr

      - name: Find latest silver data
        working-directory: backend/pipelines/chr_pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: |
          echo "🔍 Finding latest silver data in GCS..."
          
          # If we have a bronze timestamp (from silver processing), use that
          if [ -f /tmp/bronze_timestamp.txt ]; then
            BRONZE_TIMESTAMP=$(cat /tmp/bronze_timestamp.txt)
            echo "Using bronze timestamp from artifact: $BRONZE_TIMESTAMP"
            
            # Check if corresponding silver data exists
            SILVER_PATH="gs://$GCS_BUCKET/silver/chr/$BRONZE_TIMESTAMP/"
            if gsutil ls "$SILVER_PATH" > /dev/null 2>&1; then
              echo "SILVER_TIMESTAMP=$BRONZE_TIMESTAMP" >> $GITHUB_ENV
              echo "Found silver data at: $SILVER_PATH"
            else
              echo "⚠️ No silver data found for bronze timestamp $BRONZE_TIMESTAMP"
              echo "Looking for latest silver data..."
              LATEST_SILVER=$(gsutil ls gs://$GCS_BUCKET/silver/chr/ | grep -E '/[0-9]{8}_[0-9]{6}/$' | sort | tail -1 | sed 's|.*/\([0-9_]*\)/.*|\1|')
              echo "SILVER_TIMESTAMP=$LATEST_SILVER" >> $GITHUB_ENV
              echo "Using latest silver data: $LATEST_SILVER"
            fi
          else
            # Find latest silver data
            echo "No bronze timestamp found, finding latest silver data..."
            LATEST_SILVER=$(gsutil ls gs://$GCS_BUCKET/silver/chr/ | grep -E '/[0-9]{8}_[0-9]{6}/$' | sort | tail -1 | sed 's|.*/\([0-9_]*\)/.*|\1|')
            echo "SILVER_TIMESTAMP=$LATEST_SILVER" >> $GITHUB_ENV
            echo "Using latest silver data: $LATEST_SILVER"
          fi

      - name: Download bronze timestamp artifact (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bronze-timestamp
          path: /tmp/

      - name: Verify silver data exists
        working-directory: backend/pipelines/chr_pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: |
          echo "🔍 Verifying silver data exists for timestamp: $SILVER_TIMESTAMP"
          
          SILVER_PATH="gs://$GCS_BUCKET/silver/chr/$SILVER_TIMESTAMP/"
          echo "Checking GCS path: $SILVER_PATH"
          
          if ! gsutil ls "$SILVER_PATH" > /dev/null 2>&1; then
            echo "❌ No silver data found for timestamp: $SILVER_TIMESTAMP"
            echo "Available silver timestamps:"
            gsutil ls gs://$GCS_BUCKET/silver/chr/ | head -10
            exit 1
          fi
          
          echo "✅ Silver data verified at: $SILVER_PATH"
          
          # List key files to verify completeness
          echo "📋 Available silver files:"
          gsutil ls "$SILVER_PATH" | head -20

      - name: Run gold processing (Veterinary Timeline)
        working-directory: backend/pipelines/chr_pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GITHUB_ACTIONS: "true"
        run: |
          echo "🥇 Starting Gold Processing (Veterinary Timeline + Transportation Analysis)..."
          echo "Using silver timestamp: $SILVER_TIMESTAMP"
          
          # Generate gold timestamp
          GOLD_TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          echo "Gold timestamp: $GOLD_TIMESTAMP"
          
          # Run gold processing standalone
          python -c "
          import sys
          import logging
          from pathlib import Path
          from gold.chr_gold_processing import process_gold_data
          
          logging.basicConfig(level=logging.INFO)
          
          # Process gold data using the silver timestamp
          success = process_gold_data(
              export_timestamp='$GOLD_TIMESTAMP',
              silver_dir=None  # Will auto-find from GCS
          )
          
          if success:
              print('✅ Gold processing completed successfully')
              sys.exit(0)
          else:
              print('❌ Gold processing failed')
              sys.exit(1)
          "

      - name: Verify gold output
        working-directory: backend/pipelines/chr_pipeline  
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: |
          echo "🔍 Verifying gold output..."
          
          GOLD_TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          GOLD_PATH="gs://$GCS_BUCKET/gold/chr/"
          
          echo "Checking for gold output in: $GOLD_PATH"
          if gsutil ls "$GOLD_PATH" > /dev/null 2>&1; then
            echo "📋 Gold layer contents:"
            gsutil ls -la "$GOLD_PATH" | tail -10
            
            # Check for veterinary timeline specifically
            if gsutil ls "${GOLD_PATH}*/veterinary_timeline.parquet" > /dev/null 2>&1; then
              echo "✅ Veterinary timeline successfully created"
              
              # Get file size
              TIMELINE_SIZE=$(gsutil ls -la "${GOLD_PATH}*/veterinary_timeline.parquet" | awk '{print $1}' | tail -1)
              echo "📊 Timeline file size: $TIMELINE_SIZE bytes"
            else
              echo "⚠️ Veterinary timeline not found in gold output"
            fi
            
            # Check for transportation analysis specifically
            if gsutil ls "${GOLD_PATH}*/transportation_analysis.parquet" > /dev/null 2>&1; then
              echo "✅ Transportation analysis successfully created"
              
              # Get file size
              TRANSPORT_SIZE=$(gsutil ls -la "${GOLD_PATH}*/transportation_analysis.parquet" | awk '{print $1}' | tail -1)
              echo "📊 Transportation analysis file size: $TRANSPORT_SIZE bytes"
            else
              echo "⚠️ Transportation analysis not found in gold output"
            fi
          else
            echo "⚠️ No gold output found in GCS"
          fi

  # Job 7: Single Step Execution (for individual steps not covered above)
  single-step:
    runs-on: ubuntu-latest
    if: ${{ inputs.step && !contains(fromJson('["all", "bronze_foundation", "bronze_data_collection", "silver_processing", "gold_processing", "veterinary_timeline", "transportation_analysis", "stamdata", "herds", "herd_details", "diko", "spf_su", "ejendom", "vetstat"]'), inputs.step) && !startsWith(inputs.step, 'silver_') && inputs.step != 'animal_movements' }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          # Install unified pipeline dependencies FIRST (needed for GCS access)
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .
          
          # Install CHR pipeline dependencies
          cd ../chr_pipeline
          uv pip install --system -e .

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Set up environment variables
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          FVM_USERNAME: ${{ secrets.FVM_USERNAME }}
          FVM_PASSWORD: ${{ secrets.FVM_PASSWORD }}
          VETSTAT_CERTIFICATE: ${{ secrets.VETSTAT_CERTIFICATE }}
          VETSTAT_CERTIFICATE_PASSWORD: ${{ secrets.VETSTAT_CERTIFICATE_PASSWORD }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          cd backend/pipelines/chr_pipeline
          echo "GCS_BUCKET=$GCS_BUCKET" >> .env
          echo "FVM_USERNAME=$FVM_USERNAME" >> .env
          echo "FVM_PASSWORD=$FVM_PASSWORD" >> .env
          echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
          echo "LOCAL_DATA_PATH=/tmp/data" >> .env
          
          # Set up VetStat credentials if provided
          if [[ -n "$VETSTAT_CERTIFICATE" ]]; then
            echo "VETSTAT_CERTIFICATE=$VETSTAT_CERTIFICATE" >> .env
          fi
          if [[ -n "$VETSTAT_CERTIFICATE_PASSWORD" ]]; then
            echo "VETSTAT_CERTIFICATE_PASSWORD=$VETSTAT_CERTIFICATE_PASSWORD" >> .env
          fi
          
          mkdir -p /tmp/data/bronze/chr
          mkdir -p /tmp/data/silver/chr

      - name: Run Single Step
        working-directory: backend/pipelines/chr_pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          STEP="${{ inputs.step }}"
          LOG_LEVEL="${{ inputs.log_level || 'WARNING' }}"
          SHOW_PROGRESS="${{ inputs.show_progress || 'true' }}"
          
          # Set default 3-year date range for animal_movements step
          if [[ "$STEP" == "animal_movements" && -z "${{ inputs.start_date }}" && -z "${{ inputs.end_date }}" ]]; then
            START_DATE=$(date -d "3 years ago" +%Y-01-01)
            END_DATE=$(date +%Y-%m-%d)
            echo "Auto-setting 3-year date range for animal_movements: $START_DATE to $END_DATE"
          fi
          
          CMD="python -m main --steps $STEP --log-level $LOG_LEVEL"
          if [[ "$SHOW_PROGRESS" == "true" ]]; then
            CMD="$CMD --progress"
          fi
          if [[ -n "${{ inputs.start_date }}" ]]; then
            CMD="$CMD --start-date ${{ inputs.start_date }}"
          elif [[ -n "$START_DATE" ]]; then
            CMD="$CMD --start-date $START_DATE"
          fi
          if [[ -n "${{ inputs.end_date }}" ]]; then
            CMD="$CMD --end-date ${{ inputs.end_date }}"
          elif [[ -n "$END_DATE" ]]; then
            CMD="$CMD --end-date $END_DATE"
          fi
          if [[ -n "${{ inputs.max_herds }}" ]]; then
            CMD="$CMD --limit-total-herds ${{ inputs.max_herds }}"
          fi
          if [[ -n "${{ inputs.limit_herds_per_species }}" ]]; then
            CMD="$CMD --limit-herds-per-species ${{ inputs.limit_herds_per_species }}"
          fi
          if [[ -n "${{ inputs.species_codes }}" ]]; then
            CMD="$CMD --test-species-codes ${{ inputs.species_codes }}"
          fi
          
          echo "Running single step command: $CMD"
          $CMD

      - name: Handle pipeline failure
        if: failure()
        run: |
          echo "❌ CHR Pipeline step '${{ inputs.step }}' failed. Please check the logs above for details."
          echo ""
          echo "🔧 Common issues:"
          echo "1. FVM credentials (FVM_USERNAME/FVM_PASSWORD) invalid or expired"
          echo "2. VetStat certificate issues (VETSTAT_CERTIFICATE/VETSTAT_CERTIFICATE_PASSWORD)"
          echo "3. Network connectivity issues with FVM services"
          echo "4. GCS authentication or bucket access issues"
          echo "5. Pipeline timeout or memory issues"
          echo ""
          echo "💡 Try running with smaller limits (max_herds, limit_herds_per_species) for testing"
          echo "💡 For animal_movements, consider using year_range parameter (e.g., '2023' or '2022-2023') to process smaller chunks"
          exit 1

  # Job 8: Pipeline Summary and Optimization Report
  pipeline-summary:
    runs-on: ubuntu-latest
    needs: [generate-monthly-matrix, bronze-foundation, bronze-parallel-group-1, bronze-animal-movements-by-month, bronze-animal-movements-fallback, bronze-herd-details, bronze-parallel-group-2, silver-processing, gold-processing]
    if: always() && !cancelled()
    
    steps:
      - name: Generate Pipeline Summary
        run: |
          echo "# 📊 CHR Pipeline Execution Summary"
          echo ""
          echo "## 🔧 Configuration Used"
          echo "- **Step**: ${{ inputs.step || 'all' }}"
          echo "- **Year Range**: ${{ inputs.year_range || '2022-2024' }}"
          echo "- **Monthly Processing**: ${{ needs.generate-monthly-matrix.outputs.process_by_month }}"
          echo "- **Log Level**: ${{ inputs.log_level || 'WARNING' }}"
          echo "- **Max Herds**: ${{ inputs.max_herds || 'unlimited' }}"
          echo "- **Species Codes**: ${{ inputs.species_codes || 'all' }}"
          echo ""
          
          echo "## 🚀 Performance Optimizations Applied"
          echo ""
          echo "### ✅ Monthly Matrix Processing"
          if [[ "${{ needs.generate-monthly-matrix.outputs.process_by_month }}" == "true" ]]; then
            echo "- **Status**: ENABLED ✅"
            echo "- **Months Processed**: ${{ needs.generate-monthly-matrix.outputs.months }}"
            echo "- **Benefits**:"
            echo "  - Prevents timeout issues by processing smaller date ranges (1 month vs 12 months)"
            echo "  - Allows parallel processing of different months (12x more parallelization)"
            echo "  - Enables faster failure recovery (failed month doesn't block others)"
            echo "  - Reduces memory usage per job (1.5 hours vs 3 hours timeout)"
            echo "  - Improved performance: ~7,000 animals per month vs ~87,000 per year"
          else
            echo "- **Status**: DISABLED (using traditional mode)"
            echo "- **Reason**: Step '${{ inputs.step }}' doesn't require monthly processing"
          fi
          echo ""
          
          echo "### ✅ High-Volume Herd Management"
          echo "- **Known Problematic Herds**: Pre-configured with 7-day chunking"
          echo "  - Herd 112389: Aggressive chunking enabled"
          echo "  - Herd 104641: Aggressive chunking enabled"
          echo "- **Auto-detection**: Large datasets automatically trigger chunking"
          echo "- **Error Handling**: Improved 'int' object iteration protection"
          echo ""
          
          echo "### ✅ Timeout Optimizations"
          echo "- **Individual Task Timeout**: 5 minutes (GitHub Actions) vs 10 minutes (local)"
          echo "- **Monthly Processing Timeout**: 1.5 hours per month (reduced from 3 hours per year)"
          echo "- **SOAP Request Timeout**: 3 minutes (GitHub Actions) vs 5 minutes (local)"
          echo "- **Aggregation Timeout**: 10 minutes maximum per herd"
          echo ""
          
          echo "## 📈 Job Status Summary"
          echo "| Job | Status |"
          echo "|-----|--------|"
          echo "| Foundation | ${{ needs.bronze-foundation.result || 'skipped' }} |"
          echo "| Group 1 (diko, spf_su) | ${{ needs.bronze-parallel-group-1.result || 'skipped' }} |"
          echo "| Animal Movements (Monthly) | ${{ needs.bronze-animal-movements-by-month.result || 'skipped' }} |"
          echo "| Animal Movements (Fallback) | ${{ needs.bronze-animal-movements-fallback.result || 'skipped' }} |"
          echo "| Herd Details | ${{ needs.bronze-herd-details.result || 'skipped' }} |"
          echo "| Group 2 (ejendom, vetstat) | ${{ needs.bronze-parallel-group-2.result || 'skipped' }} |"
          echo "| Silver Processing | ${{ needs.silver-processing.result || 'skipped' }} |"
          echo "| Gold Processing (Vet Timeline + Transport Analysis) | ${{ needs.gold-processing.result || 'skipped' }} |"
          echo ""
          
          # Determine overall success
          FAILED_JOBS=""
          if [[ "${{ needs.bronze-foundation.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS foundation"
          fi
          if [[ "${{ needs.bronze-parallel-group-1.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS group-1"
          fi
          if [[ "${{ needs.bronze-animal-movements-by-month.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS animal-movements-monthly"
          fi
          if [[ "${{ needs.bronze-animal-movements-fallback.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS animal-movements-fallback"
          fi
          if [[ "${{ needs.bronze-herd-details.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS herd-details"
          fi
          if [[ "${{ needs.bronze-parallel-group-2.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS group-2"
          fi
          if [[ "${{ needs.silver-processing.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS silver"
          fi
          if [[ "${{ needs.gold-processing.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS gold"
          fi
          
          if [[ -n "$FAILED_JOBS" ]]; then
            echo "## ❌ Pipeline Issues Detected"
            echo "**Failed Jobs**: $FAILED_JOBS"
            echo ""
            echo "### 🔧 Troubleshooting Steps"
            echo "1. **Check individual job logs** for specific error details"
            echo "2. **For timeout issues**: Consider smaller year_range (e.g., single year) or limit max_herds"
            echo "3. **For memory issues**: Reduce max_herds or limit_herds_per_species"
            echo "4. **For credential issues**: Verify FVM_USERNAME/FVM_PASSWORD secrets"
            echo "5. **For high-volume herds**: Check if automatic chunking was applied"
            echo "6. **Monthly processing**: Automatically divides workload into monthly chunks for better performance"
          else
            echo "## ✅ Pipeline Completed Successfully"
            echo "All jobs completed without critical failures."
          fi
          echo ""
          echo "---"
          echo "*This summary was generated automatically by the CHR Pipeline workflow*"