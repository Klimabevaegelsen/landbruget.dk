name: CHR Pipeline

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  workflow_dispatch:
    inputs:
      step:
        description: 'Pipeline step to run'
        type: choice
        required: true
        options:
          - all
          - bronze_foundation  # stamdata + herds + herd_details
          - bronze_data_collection  # diko + animal_movements + ejendom + vetstat
          - silver_processing  # all silver steps
          - stamdata
          - herds
          - herd_details
          - diko
          - animal_movements
          - ejendom
          - vetstat
        default: 'all'
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        type: string
        required: false
        default: ''
      end_date:
        description: 'End date (YYYY-MM-DD)'
        type: string
        required: false
        default: ''
      test_mode:
        description: 'Run in test mode'
        type: boolean
        default: false
      max_herds:
        description: 'Maximum number of herds to process'
        type: string
        default: ''
      species_codes:
        description: 'Comma-separated list of species codes'
        type: string
        default: ''
      log_level:
        description: 'Logging level'
        type: choice
        required: true
        options:
          - WARNING
          - INFO
          - DEBUG
          - ERROR
        default: 'WARNING'
      show_progress:
        description: 'Show progress information'
        type: boolean
        default: true
      limit_herds_per_species:
        description: 'Limit number of herds processed per species'
        type: string
        default: ''

jobs:
  # Job 1: Foundation Bronze Steps (stamdata, herds, herd_details)
  bronze-foundation:
    runs-on: ubuntu-latest
    if: ${{ inputs.step == 'all' || inputs.step == 'bronze_foundation' || inputs.step == 'stamdata' || inputs.step == 'herds' || inputs.step == 'herd_details' }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    outputs:
      export-timestamp: ${{ steps.run-foundation.outputs.export-timestamp }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        cd backend/pipelines/chr_pipeline
        uv pip install --system -e .

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Set up environment variables
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        FVM_USERNAME: ${{ secrets.FVM_USERNAME }}
        FVM_PASSWORD: ${{ secrets.FVM_PASSWORD }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        cd backend/pipelines/chr_pipeline
        echo "GCS_BUCKET=$GCS_BUCKET" >> .env
        echo "FVM_USERNAME=$FVM_USERNAME" >> .env
        echo "FVM_PASSWORD=$FVM_PASSWORD" >> .env
        echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
        
        mkdir -p /tmp/data/bronze/chr
        mkdir -p /tmp/data/silver/chr

    - name: Run Foundation Steps
      id: run-foundation
      working-directory: backend/pipelines/chr_pipeline
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        # Determine which foundation step to run
        if [[ "${{ inputs.step }}" == "all" || "${{ inputs.step }}" == "bronze_foundation" ]]; then
          STEP="herd_details"  # This will run stamdata -> herds -> herd_details
        else
          STEP="${{ inputs.step }}"
        fi
        
        LOG_LEVEL="${{ inputs.log_level || 'WARNING' }}"
        SHOW_PROGRESS="${{ inputs.show_progress || 'true' }}"
        
        CMD="python -m main --steps $STEP --log-level $LOG_LEVEL"
        if [[ "$SHOW_PROGRESS" == "true" ]]; then
          CMD="$CMD --progress"
        fi
        if [[ -n "${{ inputs.max_herds }}" ]]; then
          CMD="$CMD --limit-total-herds ${{ inputs.max_herds }}"
        fi
        if [[ -n "${{ inputs.limit_herds_per_species }}" ]]; then
          CMD="$CMD --limit-herds-per-species ${{ inputs.limit_herds_per_species }}"
        fi
        if [[ -n "${{ inputs.species_codes }}" ]]; then
          CMD="$CMD --test-species-codes ${{ inputs.species_codes }}"
        fi
        
        echo "Running foundation command: $CMD"
        $CMD
        
        # Extract export timestamp from the pipeline output for use by dependent jobs
        EXPORT_TIMESTAMP=$(find /tmp/data/bronze/chr -name "*.json" | head -1 | xargs dirname | xargs basename)
        echo "export-timestamp=$EXPORT_TIMESTAMP" >> $GITHUB_OUTPUT

  # Job 2: Data Collection Bronze Steps (diko, animal_movements, ejendom, vetstat)
  bronze-data-collection:
    runs-on: ubuntu-latest
    needs: bronze-foundation
    if: ${{ inputs.step == 'all' || inputs.step == 'bronze_data_collection' || inputs.step == 'diko' || inputs.step == 'animal_movements' || inputs.step == 'ejendom' || inputs.step == 'vetstat' }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        cd backend/pipelines/chr_pipeline
        uv pip install --system -e .

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Set up environment variables
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        FVM_USERNAME: ${{ secrets.FVM_USERNAME }}
        FVM_PASSWORD: ${{ secrets.FVM_PASSWORD }}
        VETSTAT_CERTIFICATE: ${{ secrets.VETSTAT_CERTIFICATE }}
        VETSTAT_CERTIFICATE_PASSWORD: ${{ secrets.VETSTAT_CERTIFICATE_PASSWORD }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        cd backend/pipelines/chr_pipeline
        echo "GCS_BUCKET=$GCS_BUCKET" >> .env
        echo "FVM_USERNAME=$FVM_USERNAME" >> .env
        echo "FVM_PASSWORD=$FVM_PASSWORD" >> .env
        echo "VETSTAT_CERTIFICATE=$VETSTAT_CERTIFICATE" >> .env
        echo "VETSTAT_CERTIFICATE_PASSWORD=$VETSTAT_CERTIFICATE_PASSWORD" >> .env
        echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
        
        mkdir -p /tmp/data/bronze/chr
        mkdir -p /tmp/data/silver/chr

    - name: Download Foundation Data
      working-directory: backend/pipelines/chr_pipeline
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      run: |
        # Download the foundation data from the previous job
        EXPORT_TIMESTAMP="${{ needs.bronze-foundation.outputs.export-timestamp }}"
        if [[ -n "$EXPORT_TIMESTAMP" ]]; then
          gsutil -m cp -r gs://$GCS_BUCKET/chr/bronze/$EXPORT_TIMESTAMP/* /tmp/data/bronze/chr/ || echo "No foundation data found to download"
        fi

    - name: Run Data Collection Steps
      working-directory: backend/pipelines/chr_pipeline
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        # Determine which data collection steps to run
        if [[ "${{ inputs.step }}" == "all" || "${{ inputs.step }}" == "bronze_data_collection" ]]; then
          STEPS="diko,animal_movements,ejendom,vetstat"
        else
          STEPS="${{ inputs.step }}"
        fi
        
        LOG_LEVEL="${{ inputs.log_level || 'WARNING' }}"
        SHOW_PROGRESS="${{ inputs.show_progress || 'true' }}"
        
        # Set default 3-year date range for animal_movements step
        if [[ ("$STEPS" == *"animal_movements"* || "${{ inputs.step }}" == "all") && -z "${{ inputs.start_date }}" && -z "${{ inputs.end_date }}" ]]; then
          START_DATE=$(date -d "3 years ago" +%Y-01-01)
          END_DATE=$(date +%Y-%m-%d)
          echo "Auto-setting 3-year date range for animal_movements: $START_DATE to $END_DATE"
        fi
        
        # Run each step individually to avoid timeout issues
        for STEP in $(echo $STEPS | tr ',' ' '); do
          CMD="python -m main --steps $STEP --log-level $LOG_LEVEL"
          if [[ "$SHOW_PROGRESS" == "true" ]]; then
            CMD="$CMD --progress"
          fi
          if [[ -n "${{ inputs.start_date }}" ]]; then
            CMD="$CMD --start-date ${{ inputs.start_date }}"
          elif [[ -n "$START_DATE" ]]; then
            CMD="$CMD --start-date $START_DATE"
          fi
          if [[ -n "${{ inputs.end_date }}" ]]; then
            CMD="$CMD --end-date ${{ inputs.end_date }}"
          elif [[ -n "$END_DATE" ]]; then
            CMD="$CMD --end-date $END_DATE"
          fi
          if [[ -n "${{ inputs.max_herds }}" ]]; then
            CMD="$CMD --limit-total-herds ${{ inputs.max_herds }}"
          fi
          if [[ -n "${{ inputs.limit_herds_per_species }}" ]]; then
            CMD="$CMD --limit-herds-per-species ${{ inputs.limit_herds_per_species }}"
          fi
          if [[ -n "${{ inputs.species_codes }}" ]]; then
            CMD="$CMD --test-species-codes ${{ inputs.species_codes }}"
          fi
          
          echo "Running data collection command for $STEP: $CMD"
          $CMD
        done

  # Job 3: Silver Processing
  silver-processing:
    runs-on: ubuntu-latest
    needs: [bronze-foundation, bronze-data-collection]
    if: ${{ inputs.step == 'all' || inputs.step == 'silver_processing' || startsWith(inputs.step, 'silver_') }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        cd backend/pipelines/chr_pipeline
        uv pip install --system -e .

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Set up environment variables
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        cd backend/pipelines/chr_pipeline
        echo "GCS_BUCKET=$GCS_BUCKET" >> .env
        echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
        
        mkdir -p /tmp/data/bronze/chr
        mkdir -p /tmp/data/silver/chr

    - name: Download Bronze Data
      working-directory: backend/pipelines/chr_pipeline
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      run: |
        # Download all bronze data from both previous jobs
        EXPORT_TIMESTAMP="${{ needs.bronze-foundation.outputs.export-timestamp }}"
        if [[ -n "$EXPORT_TIMESTAMP" ]]; then
          gsutil -m cp -r gs://$GCS_BUCKET/chr/bronze/$EXPORT_TIMESTAMP/* /tmp/data/bronze/chr/ || echo "No bronze data found to download"
        fi

    - name: Run Silver Processing
      working-directory: backend/pipelines/chr_pipeline
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        # Determine which silver step to run
        if [[ "${{ inputs.step }}" == "all" || "${{ inputs.step }}" == "silver_processing" ]]; then
          STEP="silver_all"
        else
          STEP="${{ inputs.step }}"
        fi
        
        LOG_LEVEL="${{ inputs.log_level || 'WARNING' }}"
        SHOW_PROGRESS="${{ inputs.show_progress || 'true' }}"
        
        CMD="python -m main --steps $STEP --log-level $LOG_LEVEL"
        if [[ "$SHOW_PROGRESS" == "true" ]]; then
          CMD="$CMD --progress"
        fi
        
        echo "Running silver processing command: $CMD"
        $CMD

  # Job 4: Handle single step runs that don't fit the above pattern
  single-step:
    runs-on: ubuntu-latest
    if: ${{ !contains(fromJson('["all", "bronze_foundation", "bronze_data_collection", "silver_processing", "stamdata", "herds", "herd_details", "diko", "animal_movements", "ejendom", "vetstat"]'), inputs.step) && !startsWith(inputs.step, 'silver_') }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        cd backend/pipelines/chr_pipeline
        uv pip install --system -e .

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Set up environment variables
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        FVM_USERNAME: ${{ secrets.FVM_USERNAME }}
        FVM_PASSWORD: ${{ secrets.FVM_PASSWORD }}
        VETSTAT_CERTIFICATE: ${{ secrets.VETSTAT_CERTIFICATE }}
        VETSTAT_CERTIFICATE_PASSWORD: ${{ secrets.VETSTAT_CERTIFICATE_PASSWORD }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        cd backend/pipelines/chr_pipeline
        echo "GCS_BUCKET=$GCS_BUCKET" >> .env
        echo "FVM_USERNAME=$FVM_USERNAME" >> .env
        echo "FVM_PASSWORD=$FVM_PASSWORD" >> .env
        echo "VETSTAT_CERTIFICATE=$VETSTAT_CERTIFICATE" >> .env
        echo "VETSTAT_CERTIFICATE_PASSWORD=$VETSTAT_CERTIFICATE_PASSWORD" >> .env
        echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
        
        mkdir -p /tmp/data/bronze/chr
        mkdir -p /tmp/data/silver/chr

    - name: Run Single Step
      working-directory: backend/pipelines/chr_pipeline
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        STEP="${{ inputs.step }}"
        LOG_LEVEL="${{ inputs.log_level || 'WARNING' }}"
        SHOW_PROGRESS="${{ inputs.show_progress || 'true' }}"
        
        # Set default 3-year date range for animal_movements step
        if [[ "$STEP" == "animal_movements" && -z "${{ inputs.start_date }}" && -z "${{ inputs.end_date }}" ]]; then
          START_DATE=$(date -d "3 years ago" +%Y-01-01)
          END_DATE=$(date +%Y-%m-%d)
          echo "Auto-setting 3-year date range for animal_movements: $START_DATE to $END_DATE"
        fi
        
        CMD="python -m main --steps $STEP --log-level $LOG_LEVEL"
        if [[ "$SHOW_PROGRESS" == "true" ]]; then
          CMD="$CMD --progress"
        fi
        if [[ -n "${{ inputs.start_date }}" ]]; then
          CMD="$CMD --start-date ${{ inputs.start_date }}"
        elif [[ -n "$START_DATE" ]]; then
          CMD="$CMD --start-date $START_DATE"
        fi
        if [[ -n "${{ inputs.end_date }}" ]]; then
          CMD="$CMD --end-date ${{ inputs.end_date }}"
        elif [[ -n "$END_DATE" ]]; then
          CMD="$CMD --end-date $END_DATE"
        fi
        if [[ -n "${{ inputs.max_herds }}" ]]; then
          CMD="$CMD --limit-total-herds ${{ inputs.max_herds }}"
        fi
        if [[ -n "${{ inputs.limit_herds_per_species }}" ]]; then
          CMD="$CMD --limit-herds-per-species ${{ inputs.limit_herds_per_species }}"
        fi
        if [[ -n "${{ inputs.species_codes }}" ]]; then
          CMD="$CMD --test-species-codes ${{ inputs.species_codes }}"
        fi
        
        echo "Running single step command: $CMD"
        $CMD

    - name: Handle pipeline failure
      if: failure()
      run: |
        STEP="${{ inputs.step }}"
        echo "Pipeline step '$STEP' failed. Please check the logs above for details."
        exit 1