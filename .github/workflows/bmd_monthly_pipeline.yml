name: BMD Monthly Data Scraper

on:
  schedule:
    # Run on the 1st of every month at 2 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:
    # Allow manual triggering
    inputs:
      environment:
        description: 'Environment to run the pipeline in'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production


jobs:
  run-bmd-scraper:
    name: Run BMD Scraper Pipeline
    runs-on: ubuntu-latest

    # Use environment variables
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv

          # Install unified pipeline dependencies FIRST (needed for R2 access)
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .

          # Install the BMD scraper package with appropriate extras
          cd ../bmd_scraper
          if [ "${{ env.ENVIRONMENT }}" == "production" ]; then
            uv pip install --system -e ".[production]"
          else
            uv pip install --system -e .
          fi

      - name: Create data directories
        run: |
          mkdir -p data/bronze/bmd
          mkdir -p data/silver/bmd

      - name: Run BMD Scraper Pipeline
        run: |
          cd backend/pipelines/bmd_scraper

          # Create .env file
          echo "ENVIRONMENT=${{ env.ENVIRONMENT }}" > .env
          echo "BMD_BASE_URL=https://bmd.mst.dk" >> .env
          echo "BRONZE_OUTPUT_DIR=$(pwd)/../../data/bronze/bmd" >> .env
          echo "SILVER_OUTPUT_DIR=$(pwd)/../../data/silver/bmd" >> .env

          # Add R2 settings for production
          if [ "${{ env.ENVIRONMENT }}" == "production" ]; then
            echo "R2_BUCKET=${{ secrets.R2_BUCKET }}" >> .env
          fi

          # Run the pipeline
          python main.py

      - name: Upload artifacts (Development only)
        if: env.ENVIRONMENT == 'development'
        uses: actions/upload-artifact@v4
        with:
          name: bmd-data
          path: |
            data/bronze/bmd
            data/silver/bmd
          retention-days: 30

      - name: Notify on success
        if: success()
        run: |
          echo "BMD Scraper Pipeline completed successfully on $(date)"
          # Add notifications (Slack, email, etc.) here if needed

      - name: Notify on failure
        if: failure()
        run: |
          echo "BMD Scraper Pipeline failed on $(date)"
          # Add failure notifications here
