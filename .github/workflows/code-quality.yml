# Code Quality Checks
# This workflow runs linting, formatting, and basic tests on pull requests
# All checks are BLOCKING - PRs will fail if code quality standards are not met

name: Code Quality

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - '**.ts'
      - '**.tsx'
      - 'pyproject.toml'
      - 'frontend/.oxlintrc.json'
      - 'frontend/oxlint-plugin-landbruget/**'
      - '.github/workflows/code-quality.yml'
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - '**.ts'
      - '**.tsx'


jobs:
  lint:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install ruff
      run: pip install ruff==0.15.5

    - name: Run ruff linting (all rules — zero tolerance)
      run: |
        # All configured rules in pyproject.toml must pass — zero violations allowed
        ruff check . --output-format github
      continue-on-error: false

  format-check:
    name: Python Formatting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install ruff
      run: pip install ruff==0.15.5

    - name: Check formatting
      run: |
        echo "## Formatting Check Results" >> $GITHUB_STEP_SUMMARY
        if ruff format --check --diff .; then
          echo "✅ All files are properly formatted" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Formatting issues found - PR blocked" >> $GITHUB_STEP_SUMMARY
          echo "Run \`ruff format .\` locally to auto-format" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

  import-check:
    name: Import Organization
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install ruff
      run: pip install ruff==0.15.5

    - name: Check import organization
      run: |
        echo "## Import Organization Check" >> $GITHUB_STEP_SUMMARY
        # Focus only on import-related issues
        if ruff check . --select I --output-format github; then
          echo "✅ Import organization looks good" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Import organization issues found - PR blocked" >> $GITHUB_STEP_SUMMARY
          echo "Run \`ruff check . --select I --fix\` locally to fix imports" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

  storage-migration-guard:
    name: Storage Migration Guard
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Check for new GCS library usage in Python source
      run: |
        echo "## Storage Migration Guard" >> $GITHUB_STEP_SUMMARY

        # Allowlisted legacy files that still legitimately use GCS libraries.
        # These should be migrated eventually — do NOT add new files here.
        ALLOWLIST=(
          "backend/pipelines/property_owners_sftp/local_property_processing.py"
          "backend/scripts/generate_baseline_metrics.py"
          "backend/common/validation/baseline_manager.py"
          "backend/pipelines/chr_pipeline/silver/chr_silver_processing.py"
          "backend/common/gcs/core.py"
        )
        ALLOWLIST_PATTERN=$(printf "|%s" "${ALLOWLIST[@]}")
        ALLOWLIST_PATTERN="${ALLOWLIST_PATTERN:1}"  # remove leading |

        FAILED=0

        # Check for google.cloud.storage imports in Python files
        MATCHES=$(grep -rEn "^[[:space:]]*(from[[:space:]]+google\.cloud[[:space:]]+import[[:space:]]+storage|import[[:space:]]+google\.cloud\.storage([[:space:]]|$))" \
          --include="*.py" \
          --exclude-dir=".venv" \
          --exclude-dir="venv" \
          --exclude-dir="site-packages" \
          . | grep -v -E "$ALLOWLIST_PATTERN" || true)
        if [ -n "$MATCHES" ]; then
          echo "### New google.cloud.storage imports found:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$MATCHES" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Use common.gcs instead of google.cloud.storage directly." >> $GITHUB_STEP_SUMMARY
          FAILED=1
        fi

        # Check for new gcsfs imports in Python files
        MATCHES=$(grep -rEn "^[[:space:]]*(import[[:space:]]+gcsfs([[:space:]]|$)|from[[:space:]]+gcsfs[[:space:]]+import[[:space:]])" \
          --include="*.py" \
          --exclude-dir=".venv" \
          --exclude-dir="venv" \
          --exclude-dir="site-packages" \
          . | grep -v -E "$ALLOWLIST_PATTERN" || true)
        if [ -n "$MATCHES" ]; then
          echo "### New gcsfs imports found:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$MATCHES" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Use common.gcs (s3fs-based) instead of gcsfs." >> $GITHUB_STEP_SUMMARY
          FAILED=1
        fi

        # Count hardcoded gs:// URLs in runtime Python code (informational — not blocking yet)
        # Many legacy files still use gs:// paths; this tracks migration progress over time.
        GS_COUNT=$(grep -rn 'gs://' \
          --include="*.py" \
          backend/pipelines/ backend/common/ backend/api/ \
          | grep -v "_test\.py\|test_\|/tests/" \
          | wc -l || echo "0")
        echo "### Hardcoded gs:// URL count (informational): $GS_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "Migrate these to \`StoragePath\` or \`r2://\` paths to reduce this number." >> $GITHUB_STEP_SUMMARY

        if [ "$FAILED" -eq 0 ]; then
          echo "No new GCS library usage detected." >> $GITHUB_STEP_SUMMARY
        else
          echo ""
          echo "ERROR: New GCS library usage detected. Use common.gcs module instead."
          exit 1
        fi

  pipeline-specific:
    name: Pipeline-Specific Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install ruff
      run: pip install ruff==0.15.5

    - name: Check for common pipeline issues
      run: |
        echo "## Pipeline-Specific Checks" >> $GITHUB_STEP_SUMMARY

        # Check for bare except statements
        BARE_EXCEPT=$(grep -r "except:" --include="*.py" . | wc -l || echo "0")
        echo "- Bare except statements found: $BARE_EXCEPT" >> $GITHUB_STEP_SUMMARY

        # Check for potential duplicate functions
        DUPLICATE_FUNCTIONS=$(grep -r "def create_base_request" --include="*.py" . | wc -l || echo "0")
        echo "- create_base_request functions found: $DUPLICATE_FUNCTIONS" >> $GITHUB_STEP_SUMMARY

        # Check for mixed import styles in CHR pipeline
        if [ -d "backend/pipelines/chr_pipeline" ]; then
          RELATIVE_IMPORTS=$(grep -r "from \." backend/pipelines/chr_pipeline/ --include="*.py" | wc -l || echo "0")
          echo "- CHR pipeline relative imports: $RELATIVE_IMPORTS" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "These metrics help track code quality improvements over time." >> $GITHUB_STEP_SUMMARY

  architectural-boundaries:
    name: Architectural Boundary Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Medallion import boundaries
      run: |
        echo "## Medallion Import Boundaries" >> $GITHUB_STEP_SUMMARY
        FAILED=0

        # Gold must not import from Bronze (gold should consume silver output, not raw data)
        GOLD_IMPORTS_BRONZE=$(grep -rn "from bronze\|from \.bronze\|from \.\.bronze\|import bronze" \
          --include="*.py" \
          backend/pipelines/*/gold/ 2>/dev/null || true)
        if [ -n "$GOLD_IMPORTS_BRONZE" ]; then
          echo "### ❌ Gold layer importing from Bronze:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$GOLD_IMPORTS_BRONZE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Gold modules should only consume Silver output. Move data access to Silver layer." >> $GITHUB_STEP_SUMMARY
          FAILED=1
        fi

        # Bronze must not import from Silver or Gold (bronze is raw ingestion only)
        BRONZE_IMPORTS_UPPER=$(grep -rn "from silver\|from \.silver\|from gold\|from \.gold" \
          --include="*.py" \
          backend/pipelines/*/bronze/ 2>/dev/null || true)
        if [ -n "$BRONZE_IMPORTS_UPPER" ]; then
          echo "### ❌ Bronze layer importing from Silver/Gold:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$BRONZE_IMPORTS_UPPER" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Bronze is raw data ingestion. It must not depend on Silver or Gold." >> $GITHUB_STEP_SUMMARY
          FAILED=1
        fi

        if [ "$FAILED" -eq 0 ]; then
          echo "✅ Medallion layer boundaries respected" >> $GITHUB_STEP_SUMMARY
        else
          exit 1
        fi

    - name: Shared logging check (new files only)
      run: |
        echo "## Shared Logging Check" >> $GITHUB_STEP_SUMMARY

        # Allowlist: existing files that use raw logging.getLogger()
        # These should be migrated over time — do NOT add new files here.
        LOGGING_ALLOWLIST=(
          "backend/pipelines/chr_pipeline/main.py"
          "backend/pipelines/svineflytning_pipeline/main.py"
          "backend/pipelines/drive_data_pipeline/main.py"
          "backend/pipelines/drive_data_pipeline/utils/error_handling.py"
          "backend/pipelines/bbr_buildings/main.py"
          "backend/pipelines/bmd_scraper/main.py"
          "backend/pipelines/unified_pipeline/src/unified_pipeline/base.py"
          "backend/pipelines/arbejdstilsynet_inspections/main.py"
          "backend/common/"
        )
        ALLOWLIST_PATTERN=$(printf "|%s" "${LOGGING_ALLOWLIST[@]}")
        ALLOWLIST_PATTERN="${ALLOWLIST_PATTERN:1}"

        # Check for new files using raw logging setup
        NEW_LOGGING=$(grep -rn "def setup_logging\|logging\.getLogger(" \
          --include="*.py" \
          backend/pipelines/ \
          | grep -v "_test\.py\|test_\|/tests/\|conftest" \
          | grep -v -E "$ALLOWLIST_PATTERN" || true)

        if [ -n "$NEW_LOGGING" ]; then
          echo "### ⚠️ New files using raw logging instead of shared utilities:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$NEW_LOGGING" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Use shared logging from \`backend/common/\` instead of \`logging.getLogger()\`." >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ No new raw logging usage detected" >> $GITHUB_STEP_SUMMARY
        fi

        # Count total raw logging for tracking migration progress
        RAW_LOGGING_COUNT=$(grep -rn "logging\.getLogger(" \
          --include="*.py" \
          backend/pipelines/ \
          | grep -v "_test\.py\|test_\|/tests/" \
          | wc -l || echo "0")
        echo "### Raw logging.getLogger() count (migration tracker): $RAW_LOGGING_COUNT" >> $GITHUB_STEP_SUMMARY

    - name: Hardcoded EPSG check (new files only)
      run: |
        echo "## Hardcoded EPSG Check" >> $GITHUB_STEP_SUMMARY

        # Count hardcoded EPSG strings (informational — tracking migration progress)
        EPSG_COUNT=$(grep -rn "'EPSG:\|\"EPSG:" \
          --include="*.py" \
          backend/pipelines/ backend/common/ \
          | grep -v "crs_utils\.py\|_test\.py\|test_\|/tests/" \
          | wc -l || echo "0")
        echo "### Hardcoded EPSG strings (migration tracker): $EPSG_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "Migrate to constants from \`backend/common/crs_utils.py\` to reduce this number." >> $GITHUB_STEP_SUMMARY

    - name: No cross-pipeline imports
      run: |
        echo "## Cross-Pipeline Import Check" >> $GITHUB_STEP_SUMMARY

        # Pipelines must not import from each other — shared code goes in common/
        CROSS_IMPORTS=$(grep -rn "from pipelines\.\|import pipelines\." \
          --include="*.py" \
          backend/pipelines/ \
          | grep -v "__pycache__\|\.pyc\|/tests/\|_test\.py\|test_\|conftest" || true)

        if [ -n "$CROSS_IMPORTS" ]; then
          echo "### ❌ Cross-pipeline imports detected:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$CROSS_IMPORTS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Pipelines must not import from each other. Move shared code to \`backend/common/\`." >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "✅ No cross-pipeline imports detected" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Pandas migration tracker
      run: |
        echo "## Processing Engine Migration" >> $GITHUB_STEP_SUMMARY

        # Track pandas usage in pipeline code (excluding tests)
        # Target: 0 — all data processing should use DuckDB
        PANDAS_COUNT=$(grep -rn "import pandas\|from pandas" \
          --include="*.py" \
          backend/pipelines/ \
          | grep -v "_test\.py\|test_\|/tests/\|conftest\|__pycache__" \
          | wc -l | tr -d ' ')
        echo "### Pandas imports in pipeline code: $PANDAS_COUNT (target: 0, use DuckDB)" >> $GITHUB_STEP_SUMMARY

        GEOPANDAS_COUNT=$(grep -rn "import geopandas\|from geopandas" \
          --include="*.py" \
          backend/pipelines/ \
          | grep -v "_test\.py\|test_\|/tests/\|conftest\|__pycache__" \
          | wc -l | tr -d ' ')
        echo "### GeoPandas imports in pipeline code: $GEOPANDAS_COUNT (target: 0, use duckdb-spatial)" >> $GITHUB_STEP_SUMMARY

    - name: Pipeline structure check
      run: |
        echo "## Pipeline Structure Check" >> $GITHUB_STEP_SUMMARY
        MISSING_MAIN=0

        # Every pipeline directory should have a main.py entry point
        for dir in backend/pipelines/*/; do
          pipeline_name=$(basename "$dir")
          # Skip __pycache__ and hidden dirs
          if [[ "$pipeline_name" == __* ]] || [[ "$pipeline_name" == .* ]]; then
            continue
          fi
          if [ ! -f "$dir/main.py" ]; then
            echo "⚠️ Pipeline \`$pipeline_name\` is missing \`main.py\` entry point" >> $GITHUB_STEP_SUMMARY
            MISSING_MAIN=$((MISSING_MAIN + 1))
          fi
        done

        if [ "$MISSING_MAIN" -eq 0 ]; then
          echo "✅ All pipelines have main.py entry points" >> $GITHUB_STEP_SUMMARY
        fi

  frontend-lint:
    name: Frontend Linting (oxlint)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Run oxlint
      working-directory: frontend
      run: |
        echo "## Frontend Lint Report (oxlint)" >> $GITHUB_STEP_SUMMARY

        # Run oxlint — warnings don't fail the build, errors do
        npx oxlint 2>&1 | tee /tmp/oxlint-output.txt

        # Extract summary
        SUMMARY=$(tail -1 /tmp/oxlint-output.txt)
        echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY

        # Fail if any errors (not warnings)
        if echo "$SUMMARY" | grep -q "and [1-9][0-9]* error"; then
          echo "❌ oxlint errors found — PR blocked" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
