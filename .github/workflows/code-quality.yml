name: Code Quality

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  backend-quality-checks:
    name: Backend Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pipeline: [unified_pipeline, dma_scraper, bmd_scraper, arbejdstilsynet_inspections, dmi_pipeline, chr_pipeline, svineflytning_pipeline]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          cd backend/pipelines/${{ matrix.pipeline }}
          if [ -f "pyproject.toml" ]; then
            uv sync --group dev
          fi

      - name: Run format check
        run: |
          cd backend/pipelines/${{ matrix.pipeline }}
          uv run ruff check . --select I --diff
          uv run ruff format . --diff

      - name: Run lint
        run: |
          cd backend/pipelines/${{ matrix.pipeline }}
          uv run ruff check .

      - name: Run type checking
        run: |
          cd backend/pipelines/${{ matrix.pipeline }}
          uv run mypy .
        continue-on-error: true  # Don't fail CI on mypy errors initially

      - name: Run tests
        run: |
          cd backend/pipelines/${{ matrix.pipeline }}
          uv run pytest .
        continue-on-error: true  # Don't fail CI if no tests exist yet

  frontend-quality-checks:
    name: Frontend Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Prettier check
        run: |
          cd frontend
          npm run format:check

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript check
        run: |
          cd frontend
          npm run build 