name: Generate PMTiles

on:
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      target_year:
        description: "Specific year to process (optional)"
        required: false
        type: string
      environmental_only:
        description: "Generate only environmental layers"
        required: false
        type: boolean
        default: false
      skip_upload:
        description: "Skip upload to R2"
        required: false
        type: boolean
        default: false
      skip_cleanup:
        description: "Skip cleanup of old PMTiles in R2"
        required: false
        type: boolean
        default: false
      keep_versions:
        description: "Number of versions to keep for year-specific PMTiles"
        required: false
        type: string
        default: "3"
      years_range:
        description: "Years range (e.g., '2020-2023' or '2024')"
        required: false
        type: string

jobs:
  detect-years:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.detect.outputs.years }}
      should_run_matrix: ${{ steps.detect.outputs.should_run_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          cd backend/pipelines/unified_pipeline
          uv pip install -e . --system

      - name: Setup Google Cloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Detect available years
        id: detect
        run: |
          cd backend/pipelines/unified_pipeline

          if [ "${{ github.event.inputs.target_year }}" != "" ]; then
            # Single year specified
            echo "years=[\"${{ github.event.inputs.target_year }}\"]" >> $GITHUB_OUTPUT
            echo "should_run_matrix=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.years_range }}" != "" ]; then
            # Years range specified
            range="${{ github.event.inputs.years_range }}"
            if [[ $range == *"-"* ]]; then
              # Range like "2020-2023"
              start_year=$(echo $range | cut -d'-' -f1)
              end_year=$(echo $range | cut -d'-' -f2)
              years_array="["
              for year in $(seq $start_year $end_year); do
                years_array="$years_array\"$year\","
              done
              years_array="${years_array%,}]"
              echo "years=$years_array" >> $GITHUB_OUTPUT
            else
              # Single year
              echo "years=[\"$range\"]" >> $GITHUB_OUTPUT
            fi
            echo "should_run_matrix=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.environmental_only }}" == "true" ]; then
            # Environmental only - no matrix needed
            echo "years=[]" >> $GITHUB_OUTPUT
            echo "should_run_matrix=false" >> $GITHUB_OUTPUT
          else
            # Auto-detect years
            python -c "
          import asyncio
          import json
          from unified_pipeline.gold.pmtiles_generator.config import PMTilesGeneratorConfig
          from unified_pipeline.gold.pmtiles_generator.year_detector import DataSourceYearDetector
          from unified_pipeline.util.gcs_access import GCSDataAccess

          async def detect_years():
              config = PMTilesGeneratorConfig()
              gcs_access = GCSDataAccess()
              detector = DataSourceYearDetector(config, gcs_access)
              available_years = await detector.detect_all_available_years()
              years_to_process = detector.get_years_to_process(available_years)

              # Limit to recent years for regular runs to avoid overwhelming GitHub Actions
              recent_years = [y for y in years_to_process if y >= 2020]
              print(json.dumps(recent_years))

          asyncio.run(detect_years())
          " > detected_years.json
            years=$(cat detected_years.json)
            echo "years=$years" >> $GITHUB_OUTPUT
            echo "should_run_matrix=true" >> $GITHUB_OUTPUT
          fi

  generate-environmental:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.environmental_only == 'true' || github.event_name == 'schedule' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe rclone

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          cd backend/pipelines/unified_pipeline
          uv pip install -e . --system

      - name: Setup Google Cloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Generate environmental PMTiles
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          cd backend/pipelines/unified_pipeline
          python -m src.unified_pipeline.gold.pmtiles_generator.main \
            --environmental-only \
            ${{ github.event.inputs.skip_upload == 'true' && '--no-upload' || '' }} \
            ${{ github.event.inputs.skip_cleanup == 'true' && '--no-cleanup' || '' }} \
            ${{ github.event.inputs.keep_versions && format('--keep-versions={0}', github.event.inputs.keep_versions) || '' }}

  generate-field-analysis:
    runs-on: ubuntu-latest
    needs: detect-years
    if: ${{ needs.detect-years.outputs.should_run_matrix == 'true' }}
    strategy:
      matrix:
        year: ${{ fromJson(needs.detect-years.outputs.years) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe rclone

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          cd backend/pipelines/unified_pipeline
          uv pip install -e . --system

      - name: Setup Google Cloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Generate PMTiles for year ${{ matrix.year }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          cd backend/pipelines/unified_pipeline
          python -m src.unified_pipeline.gold.pmtiles_generator.main \
            --target-year=${{ matrix.year }} \
            ${{ github.event.inputs.skip_upload == 'true' && '--no-upload' || '' }} \
            ${{ github.event.inputs.skip_cleanup == 'true' && '--no-cleanup' || '' }} \
            ${{ github.event.inputs.keep_versions && format('--keep-versions={0}', github.event.inputs.keep_versions) || '' }}

  generate-all:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.environmental_only != 'true' && github.event.inputs.target_year == '' && github.event.inputs.years_range == '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe rclone

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          cd backend/pipelines/unified_pipeline
          uv pip install -e . --system

      - name: Setup Google Cloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Generate all PMTiles
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          cd backend/pipelines/unified_pipeline
          python -m src.unified_pipeline.gold.pmtiles_generator.main \
            --max-parallel-years=2 \
            ${{ github.event.inputs.skip_upload == 'true' && '--no-upload' || '' }} \
            ${{ github.event.inputs.skip_cleanup == 'true' && '--no-cleanup' || '' }} \
            ${{ github.event.inputs.keep_versions && format('--keep-versions={0}', github.event.inputs.keep_versions) || '' }}

  notify-completion:
    runs-on: ubuntu-latest
    needs: [generate-environmental, generate-field-analysis, generate-all]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "Environmental job result: ${{ needs.generate-environmental.result }}"
          echo "Field analysis job result: ${{ needs.generate-field-analysis.result }}"
          echo "Generate all job result: ${{ needs.generate-all.result }}"

          # Count successful jobs
          success_count=0
          total_count=0

          if [ "${{ needs.generate-environmental.result }}" != "skipped" ]; then
            total_count=$((total_count + 1))
            if [ "${{ needs.generate-environmental.result }}" == "success" ]; then
              success_count=$((success_count + 1))
            fi
          fi

          if [ "${{ needs.generate-field-analysis.result }}" != "skipped" ]; then
            total_count=$((total_count + 1))
            if [ "${{ needs.generate-field-analysis.result }}" == "success" ]; then
              success_count=$((success_count + 1))
            fi
          fi

          if [ "${{ needs.generate-all.result }}" != "skipped" ]; then
            total_count=$((total_count + 1))
            if [ "${{ needs.generate-all.result }}" == "success" ]; then
              success_count=$((success_count + 1))
            fi
          fi

          echo "PMTiles generation completed: $success_count/$total_count jobs successful"

          if [ $success_count -eq 0 ] && [ $total_count -gt 0 ]; then
            echo "All PMTiles generation jobs failed"
            exit 1
          fi
