# R2 Data Sync and Schema Update
# Syncs GCS data to Cloudflare R2 weekly and updates Gemini schema documentation

name: R2 Data Sync

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would be synced without syncing)"
        required: false
        type: boolean
        default: false
      verbose:
        description: "Verbose output"
        required: false
        type: boolean
        default: false
      skip_sync:
        description: "Skip data sync (only update schema docs)"
        required: false
        type: boolean
        default: false
      skip_schema:
        description: "Skip schema generation and upload"
        required: false
        type: boolean
        default: false


jobs:
  sync-r2:
    name: Sync GCS to R2
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install rclone
        run: |
          echo "📦 Installing rclone..."
          curl -LsSf https://downloads.rclone.org/rclone-current-linux-amd64.zip -o rclone.zip
          unzip -q rclone.zip
          sudo mv rclone-*-linux-amd64/rclone /usr/local/bin/
          sudo chmod +x /usr/local/bin/rclone
          rclone version
          echo "✅ rclone installed successfully"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install required dependencies for the scripts
          pip install duckdb pyarrow google-genai
          echo "✅ Python dependencies installed"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure environment variables
        working-directory: backend/scripts
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GCS_ACCESS_KEY_ID: ${{ secrets.GCS_ACCESS_KEY_ID }}
          GCS_SECRET_ACCESS_KEY: ${{ secrets.GCS_SECRET_ACCESS_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_FILE_SEARCH_STORE_ID: ${{ secrets.GEMINI_FILE_SEARCH_STORE_ID }}
        run: |
          cat > .env << EOF
          GCS_BUCKET=$GCS_BUCKET
          R2_BUCKET=$R2_BUCKET
          R2_ACCOUNT_ID=$R2_ACCOUNT_ID
          R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          GCS_ACCESS_KEY_ID=$GCS_ACCESS_KEY_ID
          GCS_SECRET_ACCESS_KEY=$GCS_SECRET_ACCESS_KEY
          GOOGLE_API_KEY=$GOOGLE_API_KEY
          GEMINI_FILE_SEARCH_STORE_ID=$GEMINI_FILE_SEARCH_STORE_ID
          EOF
          echo "✅ Environment variables configured"

      - name: Run GCS to R2 sync
        if: ${{ !inputs.skip_sync }}
        working-directory: backend/scripts
        run: |
          echo "🚀 Starting GCS to R2 sync..."
          echo "⏰ Started at: $(date)"

          SYNC_ARGS=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            SYNC_ARGS="$SYNC_ARGS --dry-run"
            echo "🔍 Running in DRY RUN mode"
          fi
          if [[ "${{ inputs.verbose }}" == "true" ]]; then
            SYNC_ARGS="$SYNC_ARGS --verbose"
          fi

          python sync_to_r2.py $SYNC_ARGS

          if [[ $? -eq 0 ]]; then
            echo "✅ R2 sync completed successfully"
          else
            echo "❌ R2 sync failed"
            exit 1
          fi
          echo "⏰ Finished at: $(date)"

      - name: Upload sync manifest
        if: ${{ !inputs.dry_run && !inputs.skip_sync }}
        uses: actions/upload-artifact@v7
        with:
          name: r2-sync-manifest
          path: backend/scripts/manifest.json
          retention-days: 7

      - name: Generate schema documentation
        if: ${{ !inputs.skip_schema }}
        working-directory: backend/scripts
        run: |
          echo "📝 Generating schema documentation..."
          echo "⏰ Started at: $(date)"

          # Create schema output directory
          mkdir -p schema

          # Generate schema docs from R2/GCS data
          python generate_schema_docs.py \
            --output-dir schema \
            --bucket ${{ secrets.GCS_BUCKET }}

          if [[ $? -eq 0 ]]; then
            echo "✅ Schema documentation generated successfully"
            echo "📋 Generated files:"
            ls -lh schema/
          else
            echo "❌ Schema documentation generation failed"
            exit 1
          fi
          echo "⏰ Finished at: $(date)"

      - name: Upload schema to Gemini File Search
        if: ${{ !inputs.dry_run && !inputs.skip_schema }}
        working-directory: backend/scripts
        run: |
          echo "📤 Uploading schema to Gemini File Search..."
          echo "⏰ Started at: $(date)"

          # Upload schema docs to Gemini File Search Store
          python upload_schema.py \
            --schema-dir schema \
            --store-id ${{ secrets.GEMINI_FILE_SEARCH_STORE_ID }}

          if [[ $? -eq 0 ]]; then
            echo "✅ Schema uploaded to Gemini successfully"
          else
            echo "❌ Schema upload failed"
            exit 1
          fi
          echo "⏰ Finished at: $(date)"

      - name: Upload schema documentation artifacts
        if: ${{ !inputs.skip_schema }}
        uses: actions/upload-artifact@v7
        with:
          name: schema-documentation
          path: backend/scripts/schema/
          retention-days: 7

      - name: Cleanup temporary files
        if: always()
        run: |
          echo "🧹 Cleaning up temporary files..."
          cd backend/scripts
          rm -f .env
          rm -rf /tmp/duckdb* 2>/dev/null || true
          find /tmp -type f -size +50M -delete 2>/dev/null || true
          echo "✅ Cleanup completed"

      - name: Generate workflow summary
        if: always()
        run: |
          echo "# 📊 R2 Sync Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔧 Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: ${{ inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Verbose**: ${{ inputs.verbose || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Skip Sync**: ${{ inputs.skip_sync || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Skip Schema**: ${{ inputs.skip_schema || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Determine overall success
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "## ✅ Workflow Completed Successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All sync and schema update operations completed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Workflow Issues Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔧 Troubleshooting Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. **Check logs above** for specific error details" >> $GITHUB_STEP_SUMMARY
            echo "2. **Verify credentials**: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY" >> $GITHUB_STEP_SUMMARY
            echo "3. **Verify GCS access**: GCS_BUCKET, GCP_SA_KEY" >> $GITHUB_STEP_SUMMARY
            echo "4. **Verify Gemini API**: GOOGLE_API_KEY, GEMINI_FILE_SEARCH_STORE_ID" >> $GITHUB_STEP_SUMMARY
            echo "5. **Check rclone**: Ensure rclone is properly installed and configured" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*This summary was generated automatically by the R2 Data Sync workflow*" >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: sync-r2
    if: failure() && github.event_name == 'schedule'

    steps:
      - name: Log failure notification
        run: |
          echo "⚠️ Weekly R2 sync failed at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "Check workflow logs for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Add notification integration here (e.g., Slack, email, etc.)
          # For now, just log to workflow summary
          echo "# ⚠️ R2 Sync Failure Alert" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The weekly R2 sync failed. Please investigate the logs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
