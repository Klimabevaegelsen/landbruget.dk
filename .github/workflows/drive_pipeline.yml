name: Google Drive Data Pipeline

on:
  workflow_dispatch:
    inputs:
      subfolders:
        description: 'Specific subfolders to process (comma-separated)'
        type: string
        default: ''
      file_types:
        description: 'Specific file types to process (comma-separated, e.g., pdf,xlsx)'
        type: string
        default: ''
      bronze_only:
        description: 'Run only Bronze layer processing'
        type: boolean
        default: false
      silver_only:
        description: 'Run only Silver layer processing'
        type: boolean
        default: false
      use_matrix:
        description: 'Run as matrix job (one job per top-level folder)'
        type: boolean
        default: false
      max_parallel_jobs:
        description: 'Maximum number of parallel jobs (for matrix mode)'
        type: string
        default: '5'
      log_level:
        description: 'Logging level'
        type: choice
        required: true
        options:
          - INFO
          - DEBUG
          - WARNING
          - ERROR
        default: 'INFO'

jobs:
  discover-folders:
    if: ${{ inputs.use_matrix == true }}
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'
    
    outputs:
      folders: ${{ steps.get-folders.outputs.folders }}
      folder_count: ${{ steps.get-folders.outputs.folder_count }}
    
    env:
      ENVIRONMENT: production

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        cd backend/pipelines/drive_data_pipeline
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr poppler-utils
        uv pip install --system -e .

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Set up environment variables
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        cd backend/pipelines/drive_data_pipeline
        echo "ENVIRONMENT=production" >> .env
        echo "STORAGE_TYPE=gcs" >> .env
        echo "GCS_BUCKET=$GCS_BUCKET" >> .env
        echo "GOOGLE_DRIVE_FOLDER_ID=$GOOGLE_DRIVE_FOLDER_ID" >> .env
        echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
        echo "LOG_LEVEL=${{ inputs.log_level || 'INFO' }}" >> .env

    - name: Discover top-level folders
      id: get-folders
      working-directory: backend/pipelines/drive_data_pipeline
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        # Create a Python script to discover folders
        cat > discover_folders.py << 'EOF'
        import json
        import sys
        import os
        
        # Add the parent directory to sys.path to enable imports
        parent_dir = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
        if parent_dir not in sys.path:
            sys.path.insert(0, parent_dir)
        
        from drive_data_pipeline.bronze.drive import get_drive_service, GoogleDriveFetcher
        from drive_data_pipeline.config import get_settings
        
        try:
            print("DEBUG: Starting folder discovery...", file=sys.stderr)
            settings = get_settings()
            
            print(f"DEBUG: Google Drive Folder ID: {settings.google_drive_folder_id}", file=sys.stderr)
            print(f"DEBUG: Use public access: {settings.use_public_access}", file=sys.stderr)
            print(f"DEBUG: Credentials path exists: {settings.google_application_credentials and settings.google_application_credentials.exists() if settings.google_application_credentials else 'None'}", file=sys.stderr)
            
            if not settings.google_drive_folder_id:
                print("Error: GOOGLE_DRIVE_FOLDER_ID not set", file=sys.stderr)
                sys.exit(1)
            
            print("DEBUG: Authenticating with Google Drive...", file=sys.stderr)
            drive_service = get_drive_service(
                credentials_path=settings.google_application_credentials,
                use_public_access=settings.use_public_access,
            )
            
            print("DEBUG: Creating fetcher...", file=sys.stderr)
            fetcher = GoogleDriveFetcher(drive_service, use_public_access=settings.use_public_access)
            
            print("DEBUG: Listing folder contents (non-recursive)...", file=sys.stderr)
            folder = fetcher.list_folder_contents(
                folder_id=settings.google_drive_folder_id, 
                recursive=False
            )
            
            print(f"DEBUG: Main folder name: {folder.name}", file=sys.stderr)
            print(f"DEBUG: Main folder ID: {folder.id}", file=sys.stderr)
            print(f"DEBUG: Number of files in root: {len(folder.files)}", file=sys.stderr)
            print(f"DEBUG: Number of subfolders: {len(folder.subfolders)}", file=sys.stderr)
            
            # Get folder names, filtering out empty folders if desired
            folder_names = []
            print("DEBUG: Processing subfolders...", file=sys.stderr)
            for i, subfolder in enumerate(folder.subfolders):
                print(f"DEBUG: Subfolder {i+1}: {subfolder.name} (ID: {subfolder.id})", file=sys.stderr)
                folder_names.append(subfolder.name)
            
            # If specific subfolders were requested, filter to only those
            requested_subfolders = os.getenv('REQUESTED_SUBFOLDERS', '').strip()
            if requested_subfolders:
                print(f"DEBUG: Filtering by requested subfolders: {requested_subfolders}", file=sys.stderr)
                requested_list = [f.strip() for f in requested_subfolders.split(',')]
                original_count = len(folder_names)
                folder_names = [f for f in folder_names if f in requested_list]
                print(f"DEBUG: Filtered from {original_count} to {len(folder_names)} folders", file=sys.stderr)
            
            print(f"DEBUG: Final folder list: {folder_names}", file=sys.stderr)
            print(f"DEBUG: JSON output will be: {json.dumps(folder_names)}", file=sys.stderr)
            
            # Output ONLY the JSON to stdout (this is what gets captured)
            print(json.dumps(folder_names))
            
        except Exception as e:
            print(f"Error discovering folders: {e}", file=sys.stderr)
            import traceback
            traceback.print_exc(file=sys.stderr)
            sys.exit(1)
        EOF
        
        # Set requested subfolders if specified
        if [[ -n "${{ inputs.subfolders }}" ]]; then
          export REQUESTED_SUBFOLDERS="${{ inputs.subfolders }}"
        fi
        
        # Run the discovery script
        folders=$(python discover_folders.py | tail -n 1)
        folder_count=$(echo "$folders" | jq '. | length')
        
        echo "folders=$folders" >> $GITHUB_OUTPUT
        echo "folder_count=$folder_count" >> $GITHUB_OUTPUT
        
        echo "Discovered $folder_count folders for matrix processing"

  run-matrix:
    if: ${{ inputs.use_matrix == true && needs.discover-folders.outputs.folders != '[]' && needs.discover-folders.outputs.folders != '' }}
    needs: discover-folders
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'
    
    strategy:
      max-parallel: ${{ fromJson(inputs.max_parallel_jobs) }}
      fail-fast: false  # Don't stop other jobs if one fails
      matrix:
        folder: ${{ fromJson(needs.discover-folders.outputs.folders) }}
    
    env:
      ENVIRONMENT: production

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        cd backend/pipelines/drive_data_pipeline
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr poppler-utils
        uv pip install --system -e .

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Set up environment variables
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        cd backend/pipelines/drive_data_pipeline
        echo "ENVIRONMENT=production" >> .env
        echo "STORAGE_TYPE=gcs" >> .env
        echo "GCS_BUCKET=$GCS_BUCKET" >> .env
        echo "GOOGLE_DRIVE_FOLDER_ID=$GOOGLE_DRIVE_FOLDER_ID" >> .env
        echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
        echo "LOG_LEVEL=${{ inputs.log_level || 'INFO' }}" >> .env

    - name: Run pipeline for folder - ${{ matrix.folder }}
      working-directory: backend/pipelines/drive_data_pipeline
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        # Build command for this specific folder
        CMD="python main.py --subfolders '${{ matrix.folder }}'"
        
        if [[ "${{ inputs.bronze_only }}" == "true" ]]; then
          CMD="$CMD --bronze-only"
        elif [[ "${{ inputs.silver_only }}" == "true" ]]; then
          CMD="$CMD --silver-only"
        fi
        
        if [[ -n "${{ inputs.file_types }}" ]]; then
          CMD="$CMD --file-types '${{ inputs.file_types }}'"
        fi
        
        if [[ -n "${{ inputs.log_level }}" ]]; then
          CMD="$CMD --log-level ${{ inputs.log_level }}"
        fi
        
        CMD="$CMD --verbose"
        
        echo "Processing folder '${{ matrix.folder }}' with command: $CMD"
        eval $CMD

    - name: Handle pipeline failure for folder - ${{ matrix.folder }}
      if: failure()
      run: |
        echo "Pipeline failed for folder '${{ matrix.folder }}'. Check logs above for details."
        exit 1

  run-single:
    if: ${{ inputs.use_matrix != true }}
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      ENVIRONMENT: production

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        cd backend/pipelines/drive_data_pipeline
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr poppler-utils
        uv pip install --system -e .

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Set up environment variables
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        cd backend/pipelines/drive_data_pipeline
        echo "ENVIRONMENT=production" >> .env
        echo "STORAGE_TYPE=gcs" >> .env
        echo "GCS_BUCKET=$GCS_BUCKET" >> .env
        echo "GOOGLE_DRIVE_FOLDER_ID=$GOOGLE_DRIVE_FOLDER_ID" >> .env
        echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
        echo "LOG_LEVEL=${{ inputs.log_level || 'INFO' }}" >> .env

    - name: Run Google Drive Pipeline (Single Mode)
      working-directory: backend/pipelines/drive_data_pipeline
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        # Build command based on inputs
        CMD="python main.py"
        
        if [[ "${{ inputs.bronze_only }}" == "true" ]]; then
          CMD="$CMD --bronze-only"
        elif [[ "${{ inputs.silver_only }}" == "true" ]]; then
          CMD="$CMD --silver-only"
        fi
        
        if [[ -n "${{ inputs.subfolders }}" ]]; then
          CMD="$CMD --subfolders '${{ inputs.subfolders }}'"
        fi
        
        if [[ -n "${{ inputs.file_types }}" ]]; then
          CMD="$CMD --file-types '${{ inputs.file_types }}'"
        fi
        
        if [[ -n "${{ inputs.log_level }}" ]]; then
          CMD="$CMD --log-level ${{ inputs.log_level }}"
        fi
        
        CMD="$CMD --verbose"
        
        echo "Running command: $CMD"
        eval $CMD

    - name: Handle pipeline failure
      if: failure()
      run: |
        echo "Google Drive Pipeline failed. Please check the logs above for details."
        exit 1 