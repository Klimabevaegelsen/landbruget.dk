name: Weekly Property Owners SFTP to GCS Transfer Pipeline

on:
  schedule:
    # Run every Monday at 2 AM UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:
    # Allow manual triggering for testing

env:
  LANDBRUGSDATA_UUID_NAMESPACE: ${{ secrets.LANDBRUGSDATA_UUID_NAMESPACE }}


jobs:
  transfer-and-process:
    name: Transfer and Process Property Owners Data
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Create SFTP Transfer and Processing VM
        run: |
          # Generate unique VM name with timestamp
          VM_NAME="property-owners-pipeline-$(date +%Y%m%d-%H%M%S)"
          PROJECT_ID="landbrugsdata-1"
          ZONE="europe-west1-b"

          # Clean up any existing property-owners-pipeline VMs to release the static IP
          echo "Checking for existing property-owners-pipeline VMs..."
          EXISTING_VMS=$(gcloud compute instances list --filter="name~'property-owners-pipeline'" --format="value(name,status,zone)" --project=$PROJECT_ID || true)
          if [ -n "$EXISTING_VMS" ]; then
            echo "Found existing VMs:"
            echo "$EXISTING_VMS"
            while IFS=$'\t' read -r vm_name vm_status vm_zone; do
              if [ "$vm_status" = "TERMINATED" ]; then
                echo "Deleting terminated VM: $vm_name in zone: $(basename $vm_zone)"
                gcloud compute instances delete "$vm_name" --zone="$(basename $vm_zone)" --project=$PROJECT_ID --quiet || echo "Failed to delete $vm_name (may already be deleted)"
              elif [ "$vm_status" = "RUNNING" ] || [ "$vm_status" = "STOPPING" ]; then
                echo "⚠️ VM $vm_name is $vm_status - forcing shutdown to release static IP"
                echo "Stopping VM: $vm_name in zone: $(basename $vm_zone)"
                gcloud compute instances stop "$vm_name" --zone="$(basename $vm_zone)" --project=$PROJECT_ID --quiet || echo "Failed to stop $vm_name"
                echo "Waiting 30 seconds for VM to stop..."
                sleep 30
                echo "Deleting stopped VM: $vm_name in zone: $(basename $vm_zone)"
                gcloud compute instances delete "$vm_name" --zone="$(basename $vm_zone)" --project=$PROJECT_ID --quiet || echo "Failed to delete $vm_name"
              fi
            done <<< "$EXISTING_VMS"
          else
            echo "No existing property-owners-pipeline VMs found."
          fi

          echo "Creating optimized SFTP transfer and processing VM: $VM_NAME"

          # Create the VM with optimized specs and new startup script
          # Note: Using standard (non-preemptible) instance to ensure processing completes
          gcloud compute instances create $VM_NAME \
            --project=$PROJECT_ID \
            --zone=$ZONE \
            --machine-type=e2-standard-8 \
            --network-interface=address=sftp-transfer-static-ip,network-tier=PREMIUM,subnet=default \
            --boot-disk-size=30GB \
            --boot-disk-type=pd-ssd \
            --image-family=debian-12 \
            --image-project=debian-cloud \
            --scopes=https://www.googleapis.com/auth/cloud-platform \
            --metadata=enable-oslogin=true,LANDBRUGSDATA_UUID_NAMESPACE=${{ secrets.LANDBRUGSDATA_UUID_NAMESPACE }} \
            --metadata-from-file=startup-script=backend/pipelines/property_owners_sftp/sftp-transfer-startup-with-processing.sh \
            --maintenance-policy=MIGRATE

          echo "✅ VM $VM_NAME created successfully"
          echo "The VM will automatically:"
          echo "  1. Install dependencies (Python, ijson, pyarrow)"
          echo "  2. Download latest ZIP from SFTP server"
          echo "  3. Extract and process JSON with privacy transformations"
          echo "  4. Upload processed Parquet to: gs://landbruget-data/silver/property_owners/"
          echo "  5. Upload original ZIP backup to: gs://landbruget-data/bronze/property_owners/"
          echo "  6. Delete itself when complete"
          echo ""
          echo "VM Specs: e2-standard-8 (8 cores, 32GB RAM, 30GB SSD) - Standard instance"
          echo "Expected processing time: 10-30 minutes (optimized for large datasets)"

          # Early check: wait 5 minutes then verify startup script is progressing
          echo "Waiting 5 minutes for VM startup and package installation..."
          sleep 300

          if gcloud compute instances describe $VM_NAME --zone=$ZONE --project=$PROJECT_ID >/dev/null 2>&1; then
            echo "📋 Early serial port check (last 30 lines):"
            gcloud compute instances get-serial-port-output $VM_NAME --zone=$ZONE --project=$PROJECT_ID 2>&1 | tail -30 || echo "Could not get serial port output"
          fi

          # Wait remaining time (40 more minutes = 45 total)
          echo "Waiting 40 more minutes for SFTP transfer and processing..."
          sleep 2400

          if gcloud compute instances describe $VM_NAME --zone=$ZONE --project=$PROJECT_ID >/dev/null 2>&1; then
            echo "⚠️ VM $VM_NAME still exists after 45 minutes - processing may have failed or still running."

            echo "📋 Serial port output (last 50 lines):"
            gcloud compute instances get-serial-port-output $VM_NAME --zone=$ZONE --project=$PROJECT_ID 2>&1 | tail -50 || echo "Could not get serial port output"

            # Give it another 15 minutes for large datasets
            echo "Giving it another 15 minutes for large dataset processing..."
            sleep 900

            if gcloud compute instances describe $VM_NAME --zone=$ZONE --project=$PROJECT_ID >/dev/null 2>&1; then
              echo "❌ VM $VM_NAME still exists after 60 minutes - FORCING SHUTDOWN to prevent cost overrun"

              # Get serial port output first (works even if SSH fails)
              echo "🔍 Getting serial port output for debugging..."
              gcloud compute instances get-serial-port-output $VM_NAME --zone=$ZONE --project=$PROJECT_ID 2>&1 | tail -100 || echo "Could not get serial port output"

              # Try to get the actual log file and process status
              echo "🔍 Getting VM log file and status..."
              gcloud compute ssh $VM_NAME --zone=$ZONE --project=$PROJECT_ID --command="
                echo '=== STARTUP SCRIPT LOG ==='
                cat /var/log/sftp-transfer.log 2>/dev/null | tail -80 || echo 'No log file found'
                echo '=== PROCESS LIST ==='
                ps aux | grep -v '\[' | head -30
                echo '=== DISK USAGE ==='
                df -h / 2>/dev/null || echo 'Could not check disk'
                echo '=== STARTUP SCRIPT STATUS ==='
                # Check if startup script is still tracked by systemd
                journalctl -u google-startup-scripts.service --no-pager -n 30 2>/dev/null || echo 'No systemd journal entry'
                echo '=== END TIMEOUT CLEANUP ==='
              " 2>/dev/null || echo "Could not connect via SSH for timeout cleanup"

              # Force delete the VM
              echo "🗑️ Force deleting VM $VM_NAME..."
              gcloud compute instances delete $VM_NAME --zone=$ZONE --project=$PROJECT_ID --quiet
              echo "✅ VM force deleted to prevent further costs"
              exit 1
            else
              echo "✅ VM completed processing and self-deleted"
            fi
          else
            echo "✅ VM has been deleted - transfer and processing completed successfully"
          fi

  sync-to-r2:
    name: Sync Property Owners to R2
    runs-on: ubuntu-latest
    needs: transfer-and-process

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Install rclone
        run: |
          curl -LsSf https://downloads.rclone.org/rclone-current-linux-amd64.zip -o rclone.zip
          unzip -q rclone.zip
          sudo mv rclone-*-linux-amd64/rclone /usr/local/bin/
          sudo chmod +x /usr/local/bin/rclone
          rclone version

      - name: Configure rclone remotes
        run: |
          # GCS remote (uses application default credentials)
          rclone config create gcs "google cloud storage" --non-interactive

          # R2 remote (S3-compatible)
          rclone config create r2 s3 \
            access_key_id=${{ secrets.R2_ACCESS_KEY_ID }} \
            secret_access_key=${{ secrets.R2_SECRET_ACCESS_KEY }} \
            endpoint=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            provider=Cloudflare \
            --non-interactive

      - name: Sync property_owners from GCS to R2
        run: |
          echo "🚀 Syncing property_owners from GCS to R2..."
          rclone sync \
            gcs:${{ secrets.GCS_BUCKET }}/silver/property_owners \
            r2:${{ secrets.R2_BUCKET }}/silver/property_owners \
            --transfers 8 \
            --checkers 8 \
            --stats 10s \
            --stats-one-line \
            --verbose
          echo "✅ Property owners synced to R2"
