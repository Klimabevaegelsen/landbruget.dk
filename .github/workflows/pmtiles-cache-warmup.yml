name: PMTiles Cache Warmup

on:
  # Run after data pipeline completes
  workflow_run:
    workflows: ["Data Pipeline"]
    types: [completed]
    branches: [main]

  # Manual trigger
  workflow_dispatch:
    inputs:
      priority_only:
        description: "Warm only high-priority files"
        required: false
        default: "false"
        type: boolean

  # Weekly schedule (Mondays at 3 AM after data updates)
  schedule:
    - cron: "0 3 * * 1"

jobs:
  warmup-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Warm PMTiles Cache
        env:
          PMTILES_WARMUP_TOKEN: ${{ secrets.PMTILES_WARMUP_TOKEN }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://landbruget.dk' }}
        run: |
          echo "🔥 Starting PMTiles cache warmup..."

          # High priority files that should always be warmed
          HIGH_PRIORITY_FILES=(
            "field_analysis_2023.pmtiles"
            "field_analysis_2024.pmtiles"
            "bnbo_areas.pmtiles"
            "buildings_proximity_2024.pmtiles"
          )

          # All files for complete warmup
          ALL_FILES=(
            "${HIGH_PRIORITY_FILES[@]}"
            "field_analysis_2022.pmtiles"
            "field_analysis_2021.pmtiles"
            "field_analysis_2020.pmtiles"
            "field_analysis_2019.pmtiles"
            "field_analysis_2018.pmtiles"
            "field_analysis_2017.pmtiles"
            "field_analysis_2016.pmtiles"
            "field_analysis_2015.pmtiles"
            "wetlands_all_2024.pmtiles"
            "water_projects_2024.pmtiles"
          )

          # Determine which files to warm
          if [[ "${{ github.event.inputs.priority_only }}" == "true" ]]; then
            FILES_TO_WARM=("${HIGH_PRIORITY_FILES[@]}")
            echo "📋 Warming high-priority files only"
          else
            FILES_TO_WARM=("${ALL_FILES[@]}")
            echo "📋 Warming all PMTiles files"
          fi

          # Function to warm a single file
          warm_file() {
            local filename=$1
            local url="${FRONTEND_URL}/api/pmtiles/pmtiles/${filename}"

            echo "🔥 Warming: ${filename}"

            # Make a range request to warm the cache (PMTiles header)
            local response=$(curl -s -L -w "%{http_code}|%{size_download}|%{time_total}" \
              -H "Range: bytes=0-16383" \
              -H "User-Agent: GitHub-Actions-Warmup/1.0" \
              -H "X-Cache-Warming: true" \
              -o /dev/null \
              "${url}")

            local http_code=$(echo $response | cut -d'|' -f1)
            local size=$(echo $response | cut -d'|' -f2)
            local time=$(echo $response | cut -d'|' -f3)

            if [[ $http_code -eq 206 || $http_code -eq 200 ]]; then
              echo "✅ Warmed: ${filename} (${size} bytes, ${time}s)"
              return 0
            else
              echo "❌ Failed: ${filename} (HTTP ${http_code})"
              return 1
            fi
          }

          # Warm files in batches
          BATCH_SIZE=3
          SUCCESS_COUNT=0
          ERROR_COUNT=0

          for ((i=0; i<${#FILES_TO_WARM[@]}; i+=BATCH_SIZE)); do
            batch=("${FILES_TO_WARM[@]:i:BATCH_SIZE}")

            echo "📦 Processing batch: ${batch[*]}"

            # Process batch in parallel
            pids=()
            for filename in "${batch[@]}"; do
              warm_file "$filename" &
              pids+=($!)
            done

            # Wait for batch to complete
            for pid in "${pids[@]}"; do
              if wait $pid; then
                ((SUCCESS_COUNT++))
              else
                ((ERROR_COUNT++))
              fi
            done

            # Small delay between batches
            if [[ $((i + BATCH_SIZE)) -lt ${#FILES_TO_WARM[@]} ]]; then
              echo "⏳ Waiting 2 seconds before next batch..."
              sleep 2
            fi
          done

          echo "🎯 PMTiles cache warmup completed!"
          echo "📊 Results: ${SUCCESS_COUNT} success, ${ERROR_COUNT} errors"

          # Fail the job if more than 20% of files failed
          TOTAL_FILES=${#FILES_TO_WARM[@]}
          FAILURE_RATE=$((ERROR_COUNT * 100 / TOTAL_FILES))

          if [[ $FAILURE_RATE -gt 20 ]]; then
            echo "❌ Too many failures (${FAILURE_RATE}% failure rate)"
            exit 1
          fi

      - name: Verify Cache Status
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://landbruget.dk' }}
        run: |
          echo "🔍 Verifying cache status..."

          # Check a few key files to ensure they're accessible
          KEY_FILES=("field_analysis_2023.pmtiles" "bnbo_areas.pmtiles")

          for filename in "${KEY_FILES[@]}"; do
            url="${FRONTEND_URL}/api/pmtiles/pmtiles/${filename}"

            response=$(curl -s -w "%{http_code}" -I "${url}")
            http_code=$(echo $response | tail -c 4)

            if [[ $http_code -eq 200 ]]; then
              echo "✅ Verified: ${filename}"
            else
              echo "❌ Verification failed: ${filename} (HTTP ${http_code})"
            fi
          done

      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ PMTiles cache warmup failed. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })

  # Optional: Warm specific regions based on user analytics
  warmup-popular-regions:
    runs-on: ubuntu-latest
    needs: warmup-cache
    if: github.event_name == 'schedule' # Only run on scheduled warmups

    steps:
      - name: Warm Popular Geographic Regions
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://landbruget.dk' }}
        run: |
          echo "🗺️ Warming popular geographic regions..."

          # Define popular regions (you can get these from analytics)
          declare -A POPULAR_REGIONS=(
            ["copenhagen"]="12.5683,55.6761,14"    # lng,lat,zoom
            ["aarhus"]="10.2134,56.1629,12"
            ["aalborg"]="9.9187,57.0488,12"
            ["odense"]="10.4036,55.4038,12"
            ["zealand"]="11.9,55.4,9"               # Broader regions
            ["jutland"]="9.5,56.0,8"
          )

          for region in "${!POPULAR_REGIONS[@]}"; do
            coords=${POPULAR_REGIONS[$region]}
            echo "🎯 Pre-warming tiles for ${region} region (${coords})"

            # You could make requests to specific tile coordinates here
            # This is a simplified version - in practice you'd calculate tile URLs
            # based on the zoom levels and coordinates

            sleep 1
          done

          echo "✅ Popular regions warmup completed"
