name: BBR Buildings Pipeline

on:
  workflow_dispatch:
    inputs:
      layer:
        description: 'Pipeline layer to run'
        type: choice
        required: true
        options:
          - bronze
          - silver
          - both
        default: 'both'

      sample_size:
        description: 'Sample size for testing (0 for full dataset)'
        type: number
        default: 0
      enhance_classification:
        description: 'Enhance building classification with additional data'
        type: boolean
        default: false
      log_level:
        description: 'Logging level'
        type: choice
        required: true
        options:
          - INFO
          - DEBUG
          - WARNING
          - ERROR
        default: 'INFO'

jobs:
  # Parallel fetching jobs for bronze layer
  fetch-geodanmark:
    runs-on: ubuntu-latest
    if: ${{ inputs.layer == 'bronze' || inputs.layer == 'both' }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      ENVIRONMENT: production

    outputs:
      artifact-name: ${{ steps.upload-geodanmark.outputs.artifact-name }}
      buildings-count: ${{ steps.fetch-geodanmark.outputs.buildings-count }}

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space for GeoDanmark download
      run: |
        echo "=== Initial disk usage ==="
        df -h
        
        echo "=== Freeing up disk space for GeoDanmark processing ==="
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/share/swift
        
        sudo docker system prune -af
        sudo docker image prune -af
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        
        echo "=== Disk usage after cleanup ==="
        df -h
        
        AVAILABLE_GB=$(df / | tail -1 | awk '{print int($4/1024/1024)}')
        echo "Available space: ${AVAILABLE_GB}GB"
        
        if [ $AVAILABLE_GB -lt 15 ]; then
          echo "❌ ERROR: Not enough disk space for GeoDanmark! Available: ${AVAILABLE_GB}GB, Required: ~15GB"
          exit 1
        fi
        
        echo "✅ Sufficient disk space for GeoDanmark: ${AVAILABLE_GB}GB"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        # Install unified pipeline dependencies FIRST (needed for GCS access)
        cd backend/pipelines/unified_pipeline
        uv pip install --system -e .
        
        # Install BBR buildings pipeline dependencies
        cd ../bbr_buildings
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev
        uv pip install --system -e .

    - name: Set up environment variables
      env:
        DATAFORDELER_USERNAME: ${{ secrets.DATAFORDELER_USERNAME }}
        DATAFORDELER_PASSWORD: ${{ secrets.DATAFORDELER_PASSWORD }}
      run: |
        cd backend/pipelines/bbr_buildings
        echo "ENVIRONMENT=production" >> .env
        echo "LOG_LEVEL=${{ inputs.log_level || 'INFO' }}" >> .env
        if [[ -n "$DATAFORDELER_USERNAME" ]]; then
          echo "DATAFORDELER_USERNAME=$DATAFORDELER_USERNAME" >> .env
        fi
        if [[ -n "$DATAFORDELER_PASSWORD" ]]; then
          echo "DATAFORDELER_PASSWORD=$DATAFORDELER_PASSWORD" >> .env
        fi

    - name: Fetch GeoDanmark Buildings
      id: fetch-geodanmark
      working-directory: backend/pipelines/bbr_buildings
      env:
        DATAFORDELER_USERNAME: ${{ secrets.DATAFORDELER_USERNAME }}
        DATAFORDELER_PASSWORD: ${{ secrets.DATAFORDELER_PASSWORD }}
      run: |
        echo "🚀 Starting GeoDanmark WFS bulk download..."
        
        # Monitor disk space during execution
        (while true; do
          sleep 300  # Check every 5 minutes
          echo "$(date): Disk usage: $(df -h . | tail -1)"
          echo "$(date): Memory usage: $(free -h | grep Mem)"
          
          AVAILABLE_MB=$(df . | tail -1 | awk '{print int($4/1024)}')
          if [ $AVAILABLE_MB -lt 2048 ]; then
            echo "⚠️ WARNING: Low disk space: ${AVAILABLE_MB}MB remaining"
          fi
        done) &
        MONITOR_PID=$!
        
        # Run GeoDanmark bulk fetcher directly
        python run_geodanmark_fetch.py || {
          EXIT_CODE=$?
          kill $MONITOR_PID 2>/dev/null || true
          exit $EXIT_CODE
        }
        
        kill $MONITOR_PID 2>/dev/null || true
        
        echo "✅ GeoDanmark download completed!"
        ls -lh data/

    - name: Upload GeoDanmark Data
      id: upload-geodanmark
      uses: actions/upload-artifact@v4
      with:
        name: geodanmark-buildings-${{ github.run_id }}
        path: |
          backend/pipelines/bbr_buildings/data/geodanmark_buildings_complete.geoparquet
        retention-days: 1
        compression-level: 6

  fetch-inspire-bbr:
    runs-on: ubuntu-latest
    if: ${{ inputs.layer == 'bronze' || inputs.layer == 'both' }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      ENVIRONMENT: production

    outputs:
      artifact-name: ${{ steps.upload-inspire.outputs.artifact-name }}
      buildings-count: ${{ steps.fetch-inspire.outputs.buildings-count }}

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space for INSPIRE BBR processing
      run: |
        echo "=== Initial disk usage ==="
        df -h
        
        echo "=== Freeing up disk space for INSPIRE BBR processing ==="
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/share/swift
        
        sudo docker system prune -af
        sudo docker image prune -af
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        
        echo "=== Disk usage after cleanup ==="
        df -h
        
        AVAILABLE_GB=$(df / | tail -1 | awk '{print int($4/1024/1024)}')
        echo "Available space: ${AVAILABLE_GB}GB"
        
        if [ $AVAILABLE_GB -lt 10 ]; then
          echo "❌ ERROR: Not enough disk space for INSPIRE BBR! Available: ${AVAILABLE_GB}GB, Required: ~10GB"
          exit 1
        fi
        
        echo "✅ Sufficient disk space for INSPIRE BBR: ${AVAILABLE_GB}GB"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        # Install unified pipeline dependencies FIRST (needed for GCS access)
        cd backend/pipelines/unified_pipeline
        uv pip install --system -e .
        
        # Install BBR buildings pipeline dependencies
        cd ../bbr_buildings
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev
        uv pip install --system -e .

    - name: Set up environment variables
      env:
        DATAFORDELER_GRAPHQL_API_KEY: ${{ secrets.DATAFORDELER_GRAPHQL_API_KEY }}
      run: |
        cd backend/pipelines/bbr_buildings
        echo "ENVIRONMENT=production" >> .env
        echo "LOG_LEVEL=${{ inputs.log_level || 'INFO' }}" >> .env
        if [[ -n "$DATAFORDELER_GRAPHQL_API_KEY" ]]; then
          echo "DATAFORDELER_GRAPHQL_API_KEY=$DATAFORDELER_GRAPHQL_API_KEY" >> .env
        fi

    - name: Fetch INSPIRE BBR Data
      id: fetch-inspire
      working-directory: backend/pipelines/bbr_buildings
      env:
        DATAFORDELER_GRAPHQL_API_KEY: ${{ secrets.DATAFORDELER_GRAPHQL_API_KEY }}
      run: |
        echo "🏢 Starting INSPIRE BBR data fetch with GraphQL enrichment..."
        
        # Create output directory
        mkdir -p data/bronze
        
        # Run INSPIRE BBR fetcher directly
        python run_inspire_fetch.py ${{ inputs.sample_size || 0 }} || {
          echo "❌ INSPIRE BBR fetch failed"
          exit 1
        }
        
        echo "✅ INSPIRE BBR fetch completed!"
        ls -lh data/

    - name: Upload INSPIRE BBR Data
      id: upload-inspire
      uses: actions/upload-artifact@v4
      with:
        name: inspire-bbr-data-${{ github.run_id }}
        path: |
          backend/pipelines/bbr_buildings/data/inspire_building_ids.json
          backend/pipelines/bbr_buildings/data/inspire_attributes.parquet
          backend/pipelines/bbr_buildings/data/bronze/
        retention-days: 1
        compression-level: 6

  # Bronze layer processing job - combines the parallel fetch results
  process-bronze:
    runs-on: ubuntu-latest
    needs: [fetch-geodanmark, fetch-inspire-bbr]
    if: ${{ inputs.layer == 'bronze' || inputs.layer == 'both' }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      ENVIRONMENT: production

    outputs:
      bronze-output-dir: ${{ steps.process-bronze.outputs.bronze-output-dir }}
      joined-buildings-count: ${{ steps.process-bronze.outputs.joined-buildings-count }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        cd backend/pipelines/bbr_buildings
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev
        uv pip install --system -e .

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Download GeoDanmark Data
      uses: actions/download-artifact@v4
      with:
        name: geodanmark-buildings-${{ github.run_id }}
        path: backend/pipelines/bbr_buildings/data/

    - name: Download INSPIRE BBR Data
      uses: actions/download-artifact@v4
      with:
        name: inspire-bbr-data-${{ github.run_id }}
        path: backend/pipelines/bbr_buildings/

    - name: Process Bronze Layer - Spatial Join
      id: process-bronze
      working-directory: backend/pipelines/bbr_buildings
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        echo "🔗 Starting spatial join of GeoDanmark and INSPIRE BBR data..."
        echo "📊 GeoDanmark buildings: ${{ needs.fetch-geodanmark.outputs.buildings-count }}"
        echo "📊 INSPIRE BBR buildings: ${{ needs.fetch-inspire-bbr.outputs.buildings-count }}"
        
        # Set up environment
        echo "ENVIRONMENT=production" >> .env
        echo "STORAGE_TYPE=gcs" >> .env
        echo "GCS_BUCKET=${{ secrets.GCS_BUCKET }}" >> .env
        echo "GOOGLE_CLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT }}" >> .env
        echo "LOG_LEVEL=${{ inputs.log_level || 'INFO' }}" >> .env
        
        # Install psutil for memory monitoring
        uv pip install --system psutil
        
        # Run bronze layer UUID join (no spatial operations)
        python main.py --layer bronze
        
        echo "✅ Bronze layer UUID join completed!"
        
        # Aggressive cleanup to manage disk space
        echo "🧹 Cleaning up large files to manage disk space..."
        rm -f data/geodanmark_buildings_complete.geoparquet
        rm -f data/inspire_building_ids.json
        rm -f data/inspire_attributes.parquet
        ls -lah data/
        df -h

    - name: Upload Bronze Results to GCS
      working-directory: backend/pipelines/bbr_buildings
      run: |
        if [ -d "data/bronze" ]; then
          echo "📤 Uploading bronze results to GCS..."
          gsutil -m cp -r data/bronze/* gs://${{ secrets.GCS_BUCKET }}/bronze/bbr_buildings/
          echo "✅ Bronze results uploaded to GCS"
        fi

    - name: Upload Bronze Pipeline Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bbr-bronze-results-${{ github.run_id }}
        path: |
          backend/pipelines/bbr_buildings/data/bronze/
        retention-days: 7

  # Silver layer processing job
  process-silver:
    runs-on: ubuntu-latest
    needs: [process-bronze]
    if: ${{ inputs.layer == 'silver' || inputs.layer == 'both' }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      ENVIRONMENT: production

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        cd backend/pipelines/bbr_buildings
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev
        uv pip install --system -e .

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Download Bronze Results
      uses: actions/download-artifact@v4
      with:
        name: bbr-bronze-results-${{ github.run_id }}
        path: backend/pipelines/bbr_buildings/data/bronze/

    - name: Set up environment variables
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        cd backend/pipelines/bbr_buildings
        echo "ENVIRONMENT=production" >> .env
        echo "STORAGE_TYPE=gcs" >> .env
        echo "GCS_BUCKET=$GCS_BUCKET" >> .env
        echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
        echo "LOG_LEVEL=${{ inputs.log_level || 'INFO' }}" >> .env

    - name: Run Silver Layer Processing
      working-directory: backend/pipelines/bbr_buildings
      run: |
        echo "🥈 Starting silver layer processing..."
        echo "📊 Processing ${{ needs.process-bronze.outputs.joined-buildings-count }} joined buildings"
        
        # Find the bronze output directory
        BRONZE_DIR=$(find data/bronze -maxdepth 1 -type d -name "20*" | sort -r | head -n 1)
        if [[ -z "$BRONZE_DIR" ]]; then
          echo "❌ Error: No bronze layer output found"
          exit 1
        fi
        
        echo "📂 Using bronze data from: $BRONZE_DIR"
        
        # Build silver command
        CMD="python main.py --layer silver --input-dir $BRONZE_DIR"
        
        # Add enhancement flag
        if [[ "${{ inputs.enhance_classification }}" == "true" ]]; then
          CMD="$CMD --enhance-classification"
        fi
        
        # Add log level
        CMD="$CMD --log-level ${{ inputs.log_level }}"
        
        echo "Running command: $CMD"
        $CMD
        
        echo "✅ Silver layer processing completed!"

    - name: Upload Silver Results to GCS
      working-directory: backend/pipelines/bbr_buildings
      run: |
        if [ -d "data/silver" ]; then
          echo "📤 Uploading silver results to GCS..."
          gsutil -m cp -r data/silver/* gs://${{ secrets.GCS_BUCKET }}/silver/bbr_buildings/
          echo "✅ Silver results uploaded to GCS"
        fi

    - name: Upload Silver Pipeline Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bbr-silver-results-${{ github.run_id }}
        path: |
          backend/pipelines/bbr_buildings/data/silver/
        retention-days: 7

  # Summary job
  pipeline-summary:
    runs-on: ubuntu-latest
    needs: [fetch-geodanmark, fetch-inspire-bbr, process-bronze, process-silver]
    if: always() && (inputs.layer == 'both' || (inputs.layer == 'bronze' && needs.process-bronze.result == 'success') || (inputs.layer == 'silver' && needs.process-silver.result == 'success'))

    steps:
    - name: Pipeline Summary
      run: |
        echo "# BBR Buildings Pipeline Summary 📊" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Execution Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Pipeline Layer**: ${{ inputs.layer }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Sample Size**: ${{ inputs.sample_size == 0 && 'Full Dataset' || inputs.sample_size }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Log Level**: ${{ inputs.log_level }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ inputs.layer }}" == "bronze" || "${{ inputs.layer }}" == "both" ]]; then
          echo "## Bronze Layer Results" >> $GITHUB_STEP_SUMMARY
          echo "- **GeoDanmark Buildings**: ${{ needs.fetch-geodanmark.outputs.buildings-count || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **INSPIRE BBR Buildings**: ${{ needs.fetch-inspire-bbr.outputs.buildings-count || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Joined Buildings**: ${{ needs.process-bronze.outputs.joined-buildings-count || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "## Job Status" >> $GITHUB_STEP_SUMMARY
        echo "- **Fetch GeoDanmark**: ${{ needs.fetch-geodanmark.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Fetch INSPIRE BBR**: ${{ needs.fetch-inspire-bbr.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Process Bronze**: ${{ needs.process-bronze.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Process Silver**: ${{ needs.process-silver.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        
        # Check for failures
        if [[ "${{ needs.fetch-geodanmark.result }}" == "failure" || "${{ needs.fetch-inspire-bbr.result }}" == "failure" || "${{ needs.process-bronze.result }}" == "failure" || "${{ needs.process-silver.result }}" == "failure" ]]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ❌ Pipeline Issues" >> $GITHUB_STEP_SUMMARY
          echo "Some jobs failed. Check the individual job logs for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Common Issues:" >> $GITHUB_STEP_SUMMARY
          echo "- Missing Datafordeleren credentials" >> $GITHUB_STEP_SUMMARY
          echo "- Network connectivity issues" >> $GITHUB_STEP_SUMMARY
          echo "- Insufficient disk space" >> $GITHUB_STEP_SUMMARY
          echo "- WFS service limits or timeouts" >> $GITHUB_STEP_SUMMARY
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Pipeline Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "All jobs completed successfully. Data has been uploaded to GCS." >> $GITHUB_STEP_SUMMARY
        fi

  # Cleanup job
  cleanup:
    runs-on: ubuntu-latest
    needs: [fetch-geodanmark, fetch-inspire-bbr, process-bronze, process-silver]
    if: always()

    steps:
    - name: Cleanup Temporary Artifacts
      run: |
        echo "🧹 Cleaning up temporary artifacts..."
        # Note: GitHub automatically cleans up artifacts after retention period
        # This is just a placeholder for any additional cleanup needed
        echo "✅ Cleanup completed" 