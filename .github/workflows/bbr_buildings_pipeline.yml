name: BBR Buildings Pipeline

on:
  workflow_dispatch:
    inputs:
      layer:
        description: 'Pipeline layer to run'
        type: choice
        required: true
        options:
          - bronze
          - silver
          - both
          - test-gcs-fix
        default: 'both'

      sample_size:
        description: 'Sample size for testing (0 for full dataset)'
        type: number
        default: 0
      bronze_timestamp:
        description: 'Bronze timestamp for silver layer (e.g., 20250715_230139)'
        type: string
        required: false
      enhance_classification:
        description: 'Enhance building classification with additional data'
        type: boolean
        default: false
      log_level:
        description: 'Logging level'
        type: choice
        required: true
        options:
          - INFO
          - DEBUG
          - WARNING
          - ERROR
        default: 'INFO'

jobs:
  # Generate shared timestamp for all bronze layer jobs
  generate-timestamp:
    runs-on: ubuntu-latest
    if: ${{ inputs.layer == 'bronze' || inputs.layer == 'both' }}
    
    outputs:
      bronze-timestamp: ${{ steps.timestamp.outputs.timestamp }}
    
    steps:
    - name: Generate bronze timestamp
      id: timestamp
      run: |
        # Generate proper timestamp in YYYYMMDD_HHMMSS format like other pipelines
        BRONZE_TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
        echo "timestamp=$BRONZE_TIMESTAMP" >> $GITHUB_OUTPUT
        echo "Bronze timestamp: $BRONZE_TIMESTAMP"
        
        # Create timestamp file for artifact sharing
        echo "$BRONZE_TIMESTAMP" > /tmp/bronze_timestamp.txt
        
    - name: Upload bronze timestamp artifact
      uses: actions/upload-artifact@v4
      with:
        name: bronze-timestamp
        path: /tmp/bronze_timestamp.txt
        retention-days: 1

  # Bronze layer: Parallel data fetching and direct GCS upload
  fetch-geodanmark:
    runs-on: ubuntu-latest
    needs: [generate-timestamp]
    if: ${{ inputs.layer == 'bronze' || inputs.layer == 'both' }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      ENVIRONMENT: production

    outputs:
      buildings-count: ${{ steps.fetch-geodanmark.outputs.buildings-count }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Download bronze timestamp artifact
      uses: actions/download-artifact@v4
      with:
        name: bronze-timestamp
        path: /tmp/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        # Install unified pipeline dependencies FIRST (needed for GCS access)
        cd backend/pipelines/unified_pipeline
        uv pip install --system -e .
        
        # Install BBR buildings pipeline dependencies
        cd ../bbr_buildings
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev
        uv pip install --system -e .

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Set up environment variables
      env:
        DATAFORDELER_USERNAME: ${{ secrets.DATAFORDELER_USERNAME }}
        DATAFORDELER_PASSWORD: ${{ secrets.DATAFORDELER_PASSWORD }}
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      run: |
        cd backend/pipelines/bbr_buildings
        echo "ENVIRONMENT=production" >> .env
        echo "DATAFORDELER_USERNAME=$DATAFORDELER_USERNAME" >> .env
        echo "DATAFORDELER_PASSWORD=$DATAFORDELER_PASSWORD" >> .env
        echo "GCS_BUCKET=$GCS_BUCKET" >> .env
        echo "LOG_LEVEL=${{ inputs.log_level || 'INFO' }}" >> .env

    - name: Run GeoDanmark Data Fetch and Upload
      id: fetch-geodanmark
      working-directory: backend/pipelines/bbr_buildings
      env:
        DATAFORDELER_USERNAME: ${{ secrets.DATAFORDELER_USERNAME }}
        DATAFORDELER_PASSWORD: ${{ secrets.DATAFORDELER_PASSWORD }}
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      run: |
        echo "🚀 Starting GeoDanmark WFS bulk download..."
        
        # Monitor disk space during execution
        (while true; do
          sleep 300  # Check every 5 minutes
          echo "$(date): Disk usage: $(df -h . | tail -1)"
          echo "$(date): Memory usage: $(free -h | grep Mem)"
          
          AVAILABLE_MB=$(df . | tail -1 | awk '{print int($4/1024)}')
          if [ $AVAILABLE_MB -lt 2048 ]; then
            echo "⚠️ WARNING: Low disk space: ${AVAILABLE_MB}MB remaining"
          fi
        done) &
        MONITOR_PID=$!
        
        # Run GeoDanmark bulk fetcher directly - this will upload to GCS
        python run_geodanmark_fetch.py || {
          EXIT_CODE=$?
          kill $MONITOR_PID 2>/dev/null || true
          exit $EXIT_CODE
        }
        
        kill $MONITOR_PID 2>/dev/null || true
        
        echo "✅ GeoDanmark download and GCS upload completed!"
        ls -lh data/

  fetch-inspire-bbr:
    runs-on: ubuntu-latest
    needs: [generate-timestamp]
    if: ${{ inputs.layer == 'bronze' || inputs.layer == 'both' }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      ENVIRONMENT: production

    outputs:
      buildings-count: ${{ steps.fetch-inspire.outputs.buildings-count }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Download bronze timestamp artifact
      uses: actions/download-artifact@v4
      with:
        name: bronze-timestamp
        path: /tmp/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        # Install unified pipeline dependencies FIRST (needed for GCS access)
        cd backend/pipelines/unified_pipeline
        uv pip install --system -e .
        
        # Install BBR buildings pipeline dependencies
        cd ../bbr_buildings
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev
        uv pip install --system -e .

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Set up environment variables
      env:
        DATAFORDELER_GRAPHQL_API_KEY: ${{ secrets.DATAFORDELER_GRAPHQL_API_KEY }}
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      run: |
        cd backend/pipelines/bbr_buildings
        echo "ENVIRONMENT=production" >> .env
        echo "LOG_LEVEL=${{ inputs.log_level || 'INFO' }}" >> .env
        echo "GCS_BUCKET=$GCS_BUCKET" >> .env
        if [[ -n "$DATAFORDELER_GRAPHQL_API_KEY" ]]; then
          echo "DATAFORDELER_GRAPHQL_API_KEY=$DATAFORDELER_GRAPHQL_API_KEY" >> .env
        fi

    - name: Fetch INSPIRE BBR Data and Upload
      id: fetch-inspire
      working-directory: backend/pipelines/bbr_buildings
      env:
        DATAFORDELER_GRAPHQL_API_KEY: ${{ secrets.DATAFORDELER_GRAPHQL_API_KEY }}
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      run: |
        echo "🏢 Starting INSPIRE BBR data fetch with GraphQL enrichment..."
        
        # Create output directory
        mkdir -p data/bronze
        
        # Run INSPIRE BBR fetcher directly - this will upload to GCS
        python run_inspire_fetch.py ${{ inputs.sample_size || 0 }} || {
          echo "❌ INSPIRE BBR fetch failed"
          exit 1
        }
        
        echo "✅ INSPIRE BBR fetch and GCS upload completed!"
        ls -lh data/

  # Silver layer processing job - reads from GCS and processes everything
  process-silver:
    runs-on: ubuntu-latest
    needs: [generate-timestamp, fetch-geodanmark, fetch-inspire-bbr]
    if: ${{ always() && (inputs.layer == 'silver' || inputs.layer == 'both') }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      ENVIRONMENT: production

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        # Install unified pipeline dependencies FIRST (needed for GCS access)
        cd backend/pipelines/unified_pipeline
        uv pip install --system -e .
        
        # Install BBR buildings pipeline dependencies
        cd ../bbr_buildings
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev
        uv pip install --system -e .

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Set up environment variables
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        cd backend/pipelines/bbr_buildings
        echo "ENVIRONMENT=production" >> .env
        echo "STORAGE_TYPE=gcs" >> .env
        echo "GCS_BUCKET=$GCS_BUCKET" >> .env
        echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
        echo "LOG_LEVEL=${{ inputs.log_level || 'INFO' }}" >> .env

    - name: Run Silver Layer Processing - Read from GCS and Process
      working-directory: backend/pipelines/bbr_buildings
      run: |
        echo "🥈 Starting silver layer processing..."
        echo "📊 Processing GeoDanmark buildings: ${{ needs.fetch-geodanmark.outputs.buildings-count }}"
        echo "📊 Processing INSPIRE BBR buildings: ${{ needs.fetch-inspire-bbr.outputs.buildings-count }}"
        
        # Build silver command
        CMD="python main.py --layer silver"
        
        # Add bronze timestamp if available (prefer input, then shared timestamp from generate-timestamp job)
        BRONZE_TIMESTAMP="${{ inputs.bronze_timestamp || needs.generate-timestamp.outputs.bronze-timestamp }}"
        if [[ -n "$BRONZE_TIMESTAMP" ]]; then
          CMD="$CMD --bronze-timestamp $BRONZE_TIMESTAMP"
          echo "🕐 Using bronze timestamp: $BRONZE_TIMESTAMP"
        fi
        
        # Add enhancement flag
        if [[ "${{ inputs.enhance_classification }}" == "true" ]]; then
          CMD="$CMD --enhance-classification"
        fi
        
        # Add log level
        CMD="$CMD --log-level ${{ inputs.log_level }}"
        
        echo "Running command: $CMD"
        $CMD
        
        echo "✅ Silver layer processing completed!"

    - name: Upload Silver Pipeline Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: silver-pipeline-results
        path: |
          backend/pipelines/bbr_buildings/data/silver/
          backend/pipelines/bbr_buildings/logs/
        retention-days: 7
        compression-level: 6

  # Test GCS fix - Silver layer only with existing bronze data
  test-gcs-fix:
    runs-on: ubuntu-latest
    if: ${{ inputs.layer == 'test-gcs-fix' }}
    
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      ENVIRONMENT: production

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        # Install unified pipeline dependencies FIRST (needed for GCS access)
        cd backend/pipelines/unified_pipeline
        uv pip install --system -e .
        
        # Install BBR buildings pipeline dependencies
        cd ../bbr_buildings
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev
        uv pip install --system -e .

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Set up environment variables
      env:
        GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      run: |
        cd backend/pipelines/bbr_buildings
        echo "ENVIRONMENT=production" >> .env
        echo "STORAGE_TYPE=gcs" >> .env
        echo "GCS_BUCKET=$GCS_BUCKET" >> .env
        echo "GOOGLE_CLOUD_PROJECT=$GOOGLE_CLOUD_PROJECT" >> .env
        echo "LOG_LEVEL=INFO" >> .env

    - name: Test GCS Import Fix
      working-directory: backend/pipelines/bbr_buildings
      run: |
        echo "🧪 Testing GCS import fix with existing bronze data..."
        echo "📊 Using bronze timestamp: 20250717_083013"
        
        # First test the import works at all
        python -c "
        try:
            from unified_pipeline.util.gcs_access import GCSDataAccess
            print('✅ GCSDataAccess import successful')
            gcs = GCSDataAccess()
            print('✅ GCSDataAccess instance created')
        except Exception as e:
            print(f'❌ Import failed: {e}')
            exit(1)
        "
        
        # Now test silver layer processing
        echo "🥈 Testing silver layer processing..."
        python main.py --layer silver --bronze-timestamp 20250717_083013 --log-level INFO
        
        echo "✅ Silver layer processing completed successfully!"
        echo "🎉 GCS import fix is working!"

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gcs-fix-test-results
        path: |
          backend/pipelines/bbr_buildings/data/silver/
          backend/pipelines/bbr_buildings/logs/
        retention-days: 3
        compression-level: 6 