name: BBR Buildings Pipeline

on:
  workflow_dispatch:
    inputs:
      layer:
        description: 'Pipeline layer to run'
        type: choice
        required: true
        options:
          - bronze
          - silver
          - both
        default: 'both'

      sample_size:
        description: 'Sample size for testing (0 for full dataset)'
        type: number
        default: 0
      bronze_timestamp:
        description: 'Bronze timestamp for silver layer (e.g., 20250715_230139). Leave empty to use latest available.'
        type: string
        required: false
      enhance_classification:
        description: 'Enhance building classification with additional data'
        type: boolean
        default: false
      log_level:
        description: 'Logging level'
        type: choice
        required: true
        options:
          - INFO
          - DEBUG
          - WARNING
          - ERROR
        default: 'INFO'


jobs:
  # Generate shared timestamp for all bronze layer jobs
  generate-timestamp:
    runs-on: ubuntu-latest
    if: ${{ inputs.layer == 'bronze' || inputs.layer == 'both' }}

    outputs:
      bronze-timestamp: ${{ steps.timestamp.outputs.timestamp }}

    steps:
    - name: Generate bronze timestamp
      id: timestamp
      run: |
        # Generate proper timestamp in YYYYMMDD_HHMMSS format like other pipelines
        BRONZE_TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
        echo "timestamp=$BRONZE_TIMESTAMP" >> $GITHUB_OUTPUT
        echo "Bronze timestamp: $BRONZE_TIMESTAMP"

        # Create timestamp file for artifact sharing
        echo "$BRONZE_TIMESTAMP" > /tmp/bronze_timestamp.txt

    - name: Upload bronze timestamp artifact
      uses: actions/upload-artifact@v4
      with:
        name: bronze-timestamp
        path: /tmp/bronze_timestamp.txt
        retention-days: 1

  # Bronze layer: Parallel data fetching and direct R2 upload
  fetch-geodanmark:
    runs-on: ubuntu-latest
    needs: [generate-timestamp]
    if: ${{ inputs.layer == 'bronze' || inputs.layer == 'both' }}

    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      ENVIRONMENT: production
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}

    outputs:
      buildings-count: ${{ steps.fetch-geodanmark.outputs.buildings-count }}

    steps:
    - uses: actions/checkout@v6

    - name: Download bronze timestamp artifact
      uses: actions/download-artifact@v8
      with:
        name: bronze-timestamp
        path: /tmp/

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        # Install unified pipeline dependencies FIRST (needed for R2 access)
        cd backend/pipelines/unified_pipeline
        uv pip install --system -e .

        # Install BBR buildings pipeline dependencies
        cd ../bbr_buildings
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev
        uv pip install --system -e .

    - name: Set up environment variables
      env:
        DATAFORDELER_USERNAME: ${{ secrets.DATAFORDELER_USERNAME }}
        DATAFORDELER_PASSWORD: ${{ secrets.DATAFORDELER_PASSWORD }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
      run: |
        cd backend/pipelines/bbr_buildings
        echo "ENVIRONMENT=production" >> .env
        echo "DATAFORDELER_USERNAME=$DATAFORDELER_USERNAME" >> .env
        echo "DATAFORDELER_PASSWORD=$DATAFORDELER_PASSWORD" >> .env
        echo "R2_BUCKET=$R2_BUCKET" >> .env
        echo "LOG_LEVEL=${{ inputs.log_level || 'INFO' }}" >> .env

    - name: Run GeoDanmark Data Fetch and Upload
      id: fetch-geodanmark
      working-directory: backend/pipelines/bbr_buildings
      env:
        DATAFORDELER_USERNAME: ${{ secrets.DATAFORDELER_USERNAME }}
        DATAFORDELER_PASSWORD: ${{ secrets.DATAFORDELER_PASSWORD }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
      run: |
        echo "🚀 Starting GeoDanmark WFS bulk download..."

        # Monitor disk space during execution
        {
          while true; do
            sleep 300  # Check every 5 minutes
            TIMESTAMP=$(date)
            DISK_USAGE=$(df -h . | tail -1)
            MEMORY_USAGE=$(free -h | grep Mem)
            echo "${TIMESTAMP}: Disk usage: ${DISK_USAGE}"
            echo "${TIMESTAMP}: Memory usage: ${MEMORY_USAGE}"

            AVAILABLE_MB=$(df . | tail -1 | awk '{print int($4/1024)}')
            if [ $AVAILABLE_MB -lt 2048 ]; then
              echo "⚠️ WARNING: Low disk space: ${AVAILABLE_MB}MB remaining"
            fi
          done
        } &
        MONITOR_PID=$!

        # Run GeoDanmark bulk fetcher directly - this will upload to R2
        python run_geodanmark_fetch.py || {
          EXIT_CODE=$?
          kill $MONITOR_PID 2>/dev/null || true
          exit $EXIT_CODE
        }

        kill $MONITOR_PID 2>/dev/null || true

        echo "✅ GeoDanmark download and R2 upload completed!"
        ls -lh data/

  fetch-inspire-bbr:
    runs-on: ubuntu-latest
    needs: [generate-timestamp]
    if: ${{ inputs.layer == 'bronze' || inputs.layer == 'both' }}

    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      ENVIRONMENT: production
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}

    outputs:
      buildings-count: ${{ steps.fetch-inspire.outputs.buildings-count }}

    steps:
    - uses: actions/checkout@v6

    - name: Download bronze timestamp artifact
      uses: actions/download-artifact@v8
      with:
        name: bronze-timestamp
        path: /tmp/

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        # Install unified pipeline dependencies FIRST (needed for R2 access)
        cd backend/pipelines/unified_pipeline
        uv pip install --system -e .

        # Install BBR buildings pipeline dependencies
        cd ../bbr_buildings
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev
        uv pip install --system -e .

    - name: Set up environment variables
      env:
        DATAFORDELER_GRAPHQL_API_KEY: ${{ secrets.DATAFORDELER_GRAPHQL_API_KEY }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
      run: |
        cd backend/pipelines/bbr_buildings
        echo "ENVIRONMENT=production" >> .env
        echo "LOG_LEVEL=${{ inputs.log_level || 'INFO' }}" >> .env
        echo "R2_BUCKET=$R2_BUCKET" >> .env
        if [[ -n "$DATAFORDELER_GRAPHQL_API_KEY" ]]; then
          echo "DATAFORDELER_GRAPHQL_API_KEY=$DATAFORDELER_GRAPHQL_API_KEY" >> .env
        fi

    - name: Fetch INSPIRE BBR Data and Upload
      id: fetch-inspire
      working-directory: backend/pipelines/bbr_buildings
      env:
        DATAFORDELER_GRAPHQL_API_KEY: ${{ secrets.DATAFORDELER_GRAPHQL_API_KEY }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
      run: |
        echo "🏢 Starting INSPIRE BBR data fetch with GraphQL enrichment..."

        # Create output directory
        mkdir -p data/bronze

        # Run INSPIRE BBR fetcher directly - this will upload to R2
        python run_inspire_fetch.py ${{ inputs.sample_size || 0 }} || {
          echo "❌ INSPIRE BBR fetch failed"
          exit 1
        }

        echo "✅ INSPIRE BBR fetch and R2 upload completed!"
        ls -lh data/

  # Silver layer processing job - reads from R2 and processes everything
  process-silver:
    runs-on: ubuntu-latest
    needs: [generate-timestamp, fetch-geodanmark, fetch-inspire-bbr]
    if: ${{ always() && (inputs.layer == 'silver' || inputs.layer == 'both') && !cancelled() }}

    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      ENVIRONMENT: production
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        # Install unified pipeline dependencies FIRST (needed for R2 access)
        cd backend/pipelines/unified_pipeline
        uv pip install --system -e .

        # Install BBR buildings pipeline dependencies
        cd ../bbr_buildings
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev
        uv pip install --system -e .

    - name: Set up environment variables
      env:
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      run: |
        cd backend/pipelines/bbr_buildings
        echo "ENVIRONMENT=production" >> .env
        echo "STORAGE_TYPE=r2" >> .env
        echo "R2_BUCKET=$R2_BUCKET" >> .env
        echo "R2_ACCOUNT_ID=$R2_ACCOUNT_ID" >> .env
        echo "LOG_LEVEL=${{ inputs.log_level || 'INFO' }}" >> .env

    - name: Run Silver Layer Processing - Read from R2 and Process
      working-directory: backend/pipelines/bbr_buildings
      env:
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      run: |
        echo "🥈 Starting silver layer processing..."
        R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

        # Build silver command
        CMD="python main.py --layer silver"

        # Determine bronze timestamp to use
        # Priority: 1) Input parameter, 2) Generated timestamp from bronze jobs, 3) Auto-detect latest
        BRONZE_TIMESTAMP="${{ inputs.bronze_timestamp }}"
        GENERATED_TIMESTAMP="${{ needs.generate-timestamp.outputs.bronze-timestamp }}"

        if [[ -n "$BRONZE_TIMESTAMP" ]]; then
          echo "🎯 Using provided bronze timestamp: $BRONZE_TIMESTAMP"
        elif [[ -n "$GENERATED_TIMESTAMP" ]]; then
          BRONZE_TIMESTAMP="$GENERATED_TIMESTAMP"
          echo "🔗 Using generated bronze timestamp from current run: $BRONZE_TIMESTAMP"
        else
          echo "🔍 No bronze timestamp provided, finding latest available..."

          # Find latest GeoDanmark bronze timestamp
          LATEST_GEODANMARK=$(aws s3 ls s3://$R2_BUCKET/bronze/bbr_buildings/geodanmark/ --endpoint-url $R2_ENDPOINT | grep -oE '[0-9]{8}_[0-9]{6}' | sort | tail -n 1)

          # Find latest INSPIRE bronze timestamp
          LATEST_INSPIRE=$(aws s3 ls s3://$R2_BUCKET/bronze/bbr_buildings/inspire/ --endpoint-url $R2_ENDPOINT | grep -oE '[0-9]{8}_[0-9]{6}' | sort | tail -n 1)

          echo "🔍 Found GeoDanmark timestamp: '$LATEST_GEODANMARK'"
          echo "🔍 Found INSPIRE timestamp: '$LATEST_INSPIRE'"

          # Use the most recent timestamp that has both datasets
          if [[ -n "$LATEST_GEODANMARK" && "$LATEST_GEODANMARK" == "$LATEST_INSPIRE" ]]; then
            BRONZE_TIMESTAMP="$LATEST_GEODANMARK"
            echo "✅ Found matching bronze data: $BRONZE_TIMESTAMP"
          elif [[ -n "$LATEST_GEODANMARK" && -n "$LATEST_INSPIRE" ]]; then
            echo "📋 Available GeoDanmark timestamps:"
            aws s3 ls s3://$R2_BUCKET/bronze/bbr_buildings/geodanmark/ --endpoint-url $R2_ENDPOINT | grep -oE '[0-9]{8}_[0-9]{6}' | sort -r | head -3
            echo "📋 Available INSPIRE timestamps:"
            aws s3 ls s3://$R2_BUCKET/bronze/bbr_buildings/inspire/ --endpoint-url $R2_ENDPOINT | grep -oE '[0-9]{8}_[0-9]{6}' | sort -r | head -3

            # Use the newer of the two (they should typically match)
            if [[ "$LATEST_GEODANMARK" > "$LATEST_INSPIRE" ]]; then
              BRONZE_TIMESTAMP="$LATEST_GEODANMARK"
              echo "⚠️ Using latest GeoDanmark data: $BRONZE_TIMESTAMP"
            else
              BRONZE_TIMESTAMP="$LATEST_INSPIRE"
              echo "⚠️ Using latest INSPIRE data: $BRONZE_TIMESTAMP"
            fi
          else
            echo "❌ No valid bronze timestamps found"
            echo "🔍 Debugging - listing raw GeoDanmark directory:"
            aws s3 ls s3://$R2_BUCKET/bronze/bbr_buildings/geodanmark/ --endpoint-url $R2_ENDPOINT || echo "Failed to list GeoDanmark directory"
            echo "🔍 Debugging - listing raw INSPIRE directory:"
            aws s3 ls s3://$R2_BUCKET/bronze/bbr_buildings/inspire/ --endpoint-url $R2_ENDPOINT || echo "Failed to list INSPIRE directory"
          fi
        fi

        # Add timestamp to command
        if [[ -n "$BRONZE_TIMESTAMP" ]]; then
          CMD="$CMD --bronze-timestamp $BRONZE_TIMESTAMP"
          echo "🕐 Final bronze timestamp: $BRONZE_TIMESTAMP"
        else
          echo "❌ No bronze timestamp available - pipeline will fail"
          exit 1
        fi

        # Add enhancement flag
        if [[ "${{ inputs.enhance_classification }}" == "true" ]]; then
          CMD="$CMD --enhance-classification"
        fi

        # Add log level
        CMD="$CMD --log-level ${{ inputs.log_level }}"

        echo "Running command: $CMD"
        $CMD

        echo "✅ Silver layer processing completed!"

    - name: Upload Silver Pipeline Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: silver-pipeline-results
        path: |
          backend/pipelines/bbr_buildings/data/silver/
          backend/pipelines/bbr_buildings/logs/
        retention-days: 7
        compression-level: 6
