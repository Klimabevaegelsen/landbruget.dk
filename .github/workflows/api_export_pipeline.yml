name: API Export Pipeline

on:
  schedule:
    # Run every Tuesday at 4 AM UTC (after weekly data pipelines complete)
    - cron: '0 4 * * 2'
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only specific exporters (comma-separated: homepage,search,municipalities,drift_exposure,pesticides,companies)'
        required: false
        type: string
  workflow_call:
    inputs:
      only:
        description: 'Run only specific exporters'
        required: false
        type: string

jobs:
  resolve-exporters:
    name: Resolve exporter matrix
    runs-on: ubuntu-latest
    outputs:
      exporters: ${{ steps.set-matrix.outputs.exporters }}

    steps:
      - name: Resolve exporter list
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          ONLY_INPUT="${{ inputs.only || '' }}"
          if [ -n "$ONLY_INPUT" ]; then
            EXPORTERS_JSON="$(printf '%s' "$ONLY_INPUT" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | sed '/^$/d' | jq -R . | jq -cs .)"
          else
            EXPORTERS_JSON='["homepage","search","municipalities","pesticides","drift_exposure","companies"]'
          fi

          echo "Resolved exporters: $EXPORTERS_JSON"
          echo "exporters=$EXPORTERS_JSON" >> "$GITHUB_OUTPUT"

  export-json:
    name: Export JSON to R2 (${{ matrix.exporter }})
    needs: resolve-exporters
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exporter: ${{ fromJson(needs.resolve-exporters.outputs.exporters) }}

    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET || 'landbruget-data' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv

          # Install common package (needed for storage/DuckDB auth)
          cd backend/pipelines/unified_pipeline
          uv pip install --system -e .

          # Install api_export dependencies
          uv pip install --system duckdb s3fs python-dotenv

      - name: Run API Export Pipeline
        run: |
          cd backend/pipelines/api_export
          python main.py --only "${{ matrix.exporter }}"

      - name: Notify on success
        if: success()
        run: |
          echo "API Export Pipeline for ${{ matrix.exporter }} completed successfully on $(date)"

      - name: Notify on failure
        if: failure()
        run: |
          echo "API Export Pipeline for ${{ matrix.exporter }} failed on $(date)"

  invalidate-cache:
    name: Invalidate Next.js server cache
    if: ${{ success() }}
    needs: export-json
    runs-on: ubuntu-latest
    env:
      VERCEL_URL: ${{ vars.VERCEL_URL || 'https://landbruget.dk' }}
    steps:
      - name: Revalidate cache
        run: |
          echo "Invalidating Next.js server-side caches..."
          HTTP=$(curl -s -w "%{http_code}" -o /tmp/revalidate.txt -X POST \
            "${VERCEL_URL}/api/revalidate-cache")
          echo "Revalidation response: $HTTP"
          cat /tmp/revalidate.txt
          echo ""
          if [ "$HTTP" != "200" ]; then
            echo "⚠️ Cache invalidation returned $HTTP (non-fatal)"
          fi
