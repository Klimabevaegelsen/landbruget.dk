# Pre-commit hooks configuration
# Install with: uv add --dev pre-commit && pre-commit install
# Run manually with: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags in GitHub Actions
      - id: check-added-large-files
        args: ['--maxkb=1000']  # Prevent files larger than 1MB
      - id: check-merge-conflict
      - id: debug-statements
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      # Formatter
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      # Custom hook to prevent committing to data directories
      - id: check-data-directories
        name: Prevent commits to data directories
        entry: bash
        args: [-c, 'if git diff --cached --name-only | grep -E "^(data_cache|data_local)/"; then echo "Error: Do not commit files in data_cache/ or data_local/"; exit 1; fi']
        language: system
        pass_filenames: false
        always_run: true

      # Custom hook to check for debugging code
      - id: check-debug-code
        name: Check for debugging code
        entry: bash
        args: [-c, 'if git diff --cached --name-only -z | xargs -0 grep -l "print(" 2>/dev/null | grep -v test; then echo "Warning: Found print() statements in non-test files"; fi']
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

# Configuration for specific file types
exclude: |
  (?x)^(
    data_cache/.*|
    data_local/.*|
    \.git/.*|
    .*\.pyc|
    __pycache__/.*|
    \.pytest_cache/.*|
    \.ruff_cache/.*
  )$
