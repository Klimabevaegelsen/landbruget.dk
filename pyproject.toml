[project]
name = "landbruget-dk"
version = "0.1.0"
description = "Agricultural data analysis platform"
requires-python = ">=3.11"
dynamic = ["readme"]
dependencies = [
    # Core Data Processing
    "numpy~=2.0.0",
    "pyarrow~=18.0.0",
    # Geospatial Processing - User prefers duckdb-spatial over geopandas
    "ibis-framework[duckdb]~=10.6.0",
    "duckdb~=1.3.1",
    # Note: spatial extension is loaded at runtime with: duckdb.install_extension("spatial")
    "shapely~=2.0.6",
    "pyproj~=3.7.0",
    "fiona~=1.10.1",
    # Cloud Services
    "s3fs>=2024.1.0",
    "google-cloud-bigquery~=3.29.0",
    "google-cloud-secret-manager~=2.24.0",
    "fsspec~=2025.5.1",
    # Web Framework
    "fastapi~=0.115.7",
    "uvicorn~=0.34.0",
    "pydantic~=2.10.6",
    # HTTP and API Clients
    "aiohttp~=3.11.11",
    "requests~=2.31.0",
    "zeep~=4.3.1",
    "paramiko~=3.5.0",
    "certifi~=2025.6.15",
    "pyOpenSSL~=25.0.0",
    # Data Pipeline and Validation
    "apache-beam[gcp]==2.66.0",
    "backoff~=2.2.1",
    # PDF Processing
    "pdfplumber~=0.11.5",
    # Utilities
    "python-dotenv~=1.1.1",
    "tqdm~=4.67.1",
    "psutil~=6.1.1",
    "cryptography~=44.0.0",
    "lxml~=5.3.0",
    "ijson~=3.3.0",
    "loguru~=0.7.3",
    "simple-singleton~=2.0.0",
    # Development tools
    "ruff~=0.8.0",
    "pytest~=8.3.0",
    "jupyter~=1.1.1",
    "pip>=25.1.1",
    "xmlschema>=4.1.0",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.10",
    "tenacity>=9.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N806", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.3.0",
]

[tool.pytest.ini_options]
testpaths = ["backend"]
pythonpath = [
    "backend",
    "backend/common",
    "backend/pipelines",
    "backend/pipelines/chr_pipeline",
    "backend/pipelines/unified_pipeline/src",
    "backend/pipelines/drive_data_pipeline",
]
# Ignore problematic paths that cause import cycles
norecursedirs = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "*.egg-info",
    ".venv",
    "venv",
    "standalone_tests",  # Scripts in drive_data_pipeline
]
# Don't import __init__.py files in test directories as conftest
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Ignore standalone scripts that start with test_ but aren't actual tests
addopts = [
    "--ignore=backend/pipelines/drive_data_pipeline/test_visa_pdf.py",
    "--ignore=backend/pipelines/drive_data_pipeline/test_drive_pipeline.py",
    "--ignore=backend/pipelines/drive_data_pipeline/test_fertiliser_basic.py",
    "--ignore=backend/pipelines/drive_data_pipeline/test_work_permits_pipeline.py",
    "--ignore=backend/pipelines/drive_data_pipeline/setup_and_test.py",
]
markers = [
    "pre_merge: marks tests that must pass before merging to main",
    "gcs_required: marks tests that require GCS access",
]
