[project]
name = "landbruget-dk"
version = "0.1.0"
description = "Agricultural data analysis platform"
requires-python = ">=3.11"
license = { text = "MIT" }
dynamic = ["readme"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { certifi = false, coverage = false, pypdf = false, click = false, geopandas = false, google-api-python-client = false, google-auth = false, pyarrow = false, pyogrio = false }
environments = [
    "sys_platform == 'darwin' and python_version >= '3.11' and python_version < '3.13'",
    "sys_platform == 'linux' and python_version >= '3.11' and python_version < '3.13'",
]
# Keep shared backend versions in one place for the uv workspace.
# Pipeline-specific compatibility constraints such as xmlsec/lxml stay local.
constraint-dependencies = [
    "duckdb>=1.5.0",
    "pydantic>=2.11.4",
    "s3fs>=2026.3.0",
    "ruff>=0.15.10",
    "ty>=0.0.29",
]

[tool.uv.workspace]
members = [
    "backend/common",
    "backend/pipelines/*",
]
exclude = [
    "backend/pipelines/base",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (undefined names, unused imports, etc.)
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie (misc improvements)
    "RET",    # flake8-return (return statement improvements)
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "FURB",   # refurb (modern Python idioms)
    "T20",    # flake8-print (no print statements — use logging)
    "LOG",    # flake8-logging (proper logging patterns)
    "S",      # flake8-bandit (security checks)
    "ERA",    # eradicate (commented-out code)
    "TID",    # flake8-tidy-imports (banned legacy imports)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N806",   # variable in function should be lowercase
    "N803",   # argument name should be lowercase
    "S101",   # allow assert (used in tests and pipeline guards)
    "S603",   # subprocess-without-shell-equals-true — pipeline scripts legitimately call subprocesses
    "S607",   # start-process-with-partial-path — pipeline scripts use system tools
    "S608",   # hardcoded-sql-expression — DuckDB queries are not injection vectors
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["S101", "T20"]
"*_test.py" = ["S101", "T20"]
"conftest.py" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"common.gcs".msg = "Use `common.storage` instead (#844)"
"common.gcs.core".msg = "Use `common.storage.core` instead (#844)"
"common.gcs.core.GCSDataAccess".msg = "Use `common.storage.StorageAccess` instead (#844)"
"common.gcs.filesystem".msg = "Use `common.storage.filesystem` instead (#844)"
"common.gcs.monitoring".msg = "Use `common.storage.monitoring` instead (#844)"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.3.0",
]

[tool.pytest.ini_options]
testpaths = ["backend"]
pythonpath = [
    "backend",
    "backend/pipelines",
    "backend/pipelines/chr_pipeline",
    "backend/pipelines/unified_pipeline/src",
    "backend/pipelines/drive_data_pipeline",
]
# Ignore problematic paths that cause import cycles
norecursedirs = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "*.egg-info",
    ".venv",
    "venv",
    "standalone_tests",  # Scripts in drive_data_pipeline
]
# Don't import __init__.py files in test directories as conftest
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Ignore standalone scripts that start with test_ but aren't actual tests
addopts = [
    "--ignore=backend/pipelines/drive_data_pipeline/test_visa_pdf.py",
    "--ignore=backend/pipelines/drive_data_pipeline/test_drive_pipeline.py",
    "--ignore=backend/pipelines/drive_data_pipeline/test_fertiliser_basic.py",
    "--ignore=backend/pipelines/drive_data_pipeline/test_work_permits_pipeline.py",
    "--ignore=backend/pipelines/drive_data_pipeline/setup_and_test.py",
]
markers = [
    "pre_merge: marks tests that must pass before merging to main",
    "cloud_required: marks tests that require cloud storage access",
]
