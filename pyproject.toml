[project]
name = "landbruget-dk"
version = "0.1.0"
description = "Agricultural data analysis platform"
requires-python = ">=3.11"
dynamic = ["readme"]
dependencies = [
    # Core Data Processing
    "pandas~=2.2.3",
    "numpy~=2.2.2",
    "pyarrow<17.0.0,>=3.0.0",
    
    # Geospatial Processing - User prefers duckdb-spatial over geopandas
    "ibis-framework[duckdb]~=10.6.0",
    "duckdb~=1.3.1",
    # Note: spatial extension is loaded at runtime with: duckdb.install_extension("spatial")
    "geopandas~=1.0.1",  # Keep as backup for now
    "shapely~=2.0.6",
    "pyproj~=3.7.0",
    "fiona~=1.10.1",
    
    # Cloud Services
    "google-cloud-storage~=2.19.0",
    "google-cloud-bigquery~=3.29.0",
    "google-cloud-secret-manager~=2.22.1",
    "fsspec~=2024.12.0",
    "gcsfs~=2024.12.0",
    
    # Web Framework
    "fastapi~=0.115.7",
    "uvicorn~=0.34.0",
    "pydantic~=2.10.6",
    
    # HTTP and API Clients
    "aiohttp~=3.11.11",
    "requests~=2.32.3",
    "zeep~=4.3.1",
    "paramiko~=3.5.0",
    "certifi~=2024.12.14",
    "pyOpenSSL~=25.0.0",
    
    # Data Pipeline and Validation
    "apache-beam~=2.62.0",
    "backoff~=2.2.1",
    
    # PDF Processing
    "pdfplumber~=0.11.5",
    
    # Utilities
    "python-dotenv~=1.0.1",
    "tqdm~=4.67.1",
    "psutil~=6.1.1",
    "cryptography~=44.0.0",
    "lxml~=5.3.0",
    "ijson~=3.3.0",
    
    # Development tools
    "ruff~=0.8.0",
    "pytest~=8.3.0",
    "jupyter~=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N806", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space" 