# Pipeline Dependency Graph — Single Source of Truth
# Read by: Claude rules, GitHub Actions cascade dispatcher
# When upstream runs, all downstream pipelines must also run.
#
# Traced from actual R2 read paths in pipeline code.
# See .claude/rules/pipelines.md for cascade chain summary.

pipelines:
  # ── TIER 0: Foundation (external APIs, no pipeline deps) ──

  unified_pipeline:
    workflow: unified_pipeline_monthly.yml
    description: "18+ Danish government data sources (FVM, Geodatastyrelsen, DMI, DST, etc.)"
    downstream:
      - property_cadastral_merge
      - field_area_analysis
      - field_production
      - pesticide_disaggregation
      - generate_pmtiles
    paths:
      - backend/pipelines/unified_pipeline/**
      - backend/common/**
    outputs:
      - silver/cadastral
      - silver/agricultural_fields
      - silver/fvm_marker_{year}
      - silver/bnbo_status_dissolved
      - silver/skovrejsning_dissolved
      - silver/wetlands_dissolved
      - silver/water_projects_dissolved
      - silver/soil_types
      - silver/water_typology
      - silver/dst_zone_mapping
      - silver/dst_hst77
      - silver/dst_gartn1
      - silver/dst_fro
      - silver/dst_halm1
      - silver/dmi
      - silver/jordbrugsanalyser  # NOTE: must run BEFORE fvm_wfs enrichment — the EjerNr CVR bridge
                                   # (_backfill_cvr_via_ejernr) reads silver/jordbrugsanalyser_markers_{year}
                                   # to fill gap-year (2015) marker CVRs.
      - silver/kemidata_surface_water_pesticides
      - cvr_collections/agricultural_fields

  bmd_scraper:
    workflow: bmd_monthly_pipeline.yml
    description: "Pesticide registration database (bmd.mst.dk)"
    downstream:
      - pesticide_disaggregation
      - pesticide_compliance
      - h3_pfas_analysis
      - generate_pmtiles
    paths:
      - backend/pipelines/bmd_scraper/**
    outputs:
      - silver/bmd
      - silver/pesticides_{year}_{year+1}

  drive_data_pipeline:
    workflow: drive_pipeline.yml
    description: "Google Drive regulatory documents"
    downstream:
      - property_cadastral_merge
      - arbejdstilsynet_inspections
      - worker_safety
      - work_permits
    paths:
      - backend/pipelines/drive_data_pipeline/**
    outputs:
      - silver/property_owners
      - silver/arbejdstilsynet_inspections
      - silver/worker_safety
      - silver/work_permits

  bbr_buildings_pipeline:
    workflow: bbr_buildings_pipeline.yml
    description: "Building footprints (GeoDanmark + INSPIRE)"
    downstream:
      - pesticide_proximity
      - pesticide_drift_exposure
      - generate_pmtiles
    paths:
      - backend/pipelines/bbr_buildings/**
    outputs:
      - silver/bbr_buildings

  chr_pipeline:
    workflow: chr_pipeline.yml
    description: "Livestock tracking (CHR registry)"
    downstream: []
    paths:
      - backend/pipelines/chr_pipeline/**
    outputs:
      - silver/chr
      - gold/chr

  svineflytning_pipeline:
    workflow: svineflytning_pipeline.yml
    description: "Pig movement tracking"
    downstream: []
    paths:
      - backend/pipelines/svineflytning_pipeline/**

  dma_scraper:
    workflow: dma_pipeline.yml
    description: "DMA pesticide approval database"
    downstream: []
    paths:
      - backend/pipelines/dma_pipeline/**

  carbon_emissions:
    workflow: climate_pipeline.yml
    description: "Carbon emissions modeling"
    downstream: []
    paths:
      - backend/pipelines/unified_pipeline/src/unified_pipeline/gold/carbon_emissions/**

  # ── TIER 1: Depends on TIER 0 silver outputs ──

  property_cadastral_merge:
    workflow: unified_pipeline_monthly.yml # runs as monthly dependent batch
    description: "Property ownership + cadastral merge (BFE join)"
    upstream:
      - unified_pipeline # silver/cadastral
      - drive_data_pipeline # silver/property_owners
    downstream:
      - field_area_analysis
      - cvr_enrichment
    outputs:
      - gold/property_cadastral_merged
      - cvr_collections/property_cadastral_merge

  field_area_analysis:
    workflow: field_area_analysis_multi_stage.yml
    description: "Multi-stage field environmental coverage (5 stages)"
    upstream:
      - unified_pipeline # silver/fvm_marker, bnbo, wetlands, water_projects, soil_types
      - property_cadastral_merge # gold/property_cadastral_merged
    downstream:
      - generate_pmtiles
    outputs:
      - gold/field_environmental_analysis_fields_{year}

  field_production:
    workflow: field_production_matrix.yml
    description: "Field-level production estimates (FVM + DST yield data)"
    upstream:
      - unified_pipeline # silver/fvm_marker, silver/dst_*
    downstream:
      - generate_pmtiles
    outputs:
      - gold/field_production_{year}

  pesticide_disaggregation:
    workflow: pesticide_disaggregation_matrix.yml
    description: "Company→field pesticide disaggregation (Y+1 pattern, 92% coverage)"
    upstream:
      - unified_pipeline # silver/fvm_marker_{year+1}
      - bmd_scraper # silver/pesticides_{year}_{year+1}
    downstream:
      - pesticide_proximity
      - pesticide_drift_exposure
      - pesticide_compliance
      - h3_pfas_analysis
    outputs:
      - gold/pesticide_disaggregation_{year}_{year+1}
    notes: "Uses Y+1 temporal pattern — pesticide year Y matched against field year Y+1"

  arbejdstilsynet_inspections:
    workflow: unified_pipeline_monthly.yml
    description: "Work safety inspection data (gold layer)"
    upstream:
      - drive_data_pipeline # silver/arbejdstilsynet_inspections
    downstream: []
    outputs:
      - gold/arbejdstilsynet_inspections

  worker_safety:
    workflow: unified_pipeline_monthly.yml
    description: "Worker safety statistics (gold layer)"
    upstream:
      - drive_data_pipeline # silver/worker_safety
    downstream: []
    outputs:
      - gold/worker_safety

  work_permits:
    workflow: unified_pipeline_monthly.yml
    description: "Work permit data (gold layer)"
    upstream:
      - drive_data_pipeline # silver/work_permits
    downstream: []
    outputs:
      - gold/work_permits

  # ── TIER 2: Depends on TIER 1 gold outputs ──

  pesticide_proximity:
    workflow: unified_pipeline.yml # runs as step after disaggregation
    description: "Building/water proximity analysis (100m-1km buffers)"
    upstream:
      - pesticide_disaggregation # gold/pesticide_disaggregation_{Y}_{Y+1}
      - unified_pipeline # silver/fvm_marker_{year+1}, silver/water_typology
      - bbr_buildings_pipeline # silver/bbr_buildings
    downstream:
      - generate_pmtiles
    outputs:
      - gold/pesticide_proximity_{year}_{year+1}

  pesticide_drift_exposure:
    workflow: unified_pipeline.yml # runs as step after disaggregation (same job as proximity)
    description: "Rautmann drift-weighted pesticide exposure per building (500m radius)"
    upstream:
      - pesticide_disaggregation # gold/pesticide_disaggregation_{Y}_{Y+1}
      - unified_pipeline # silver/fvm_marker_{year+1}
      - bbr_buildings_pipeline # silver/bbr_buildings
    downstream:
      - generate_pmtiles
    outputs:
      - gold/pesticide_drift_exposure_{year}_{year+1}
    notes: "Tier 1: Rautmann power-law drift curves. Tier 2 (future): wind-direction weighting from WRF wind roses."

  pesticide_compliance:
    workflow: pesticide_compliance_matrix.yml
    description: "Regulatory violation detection"
    upstream:
      - pesticide_disaggregation # gold/pesticide_disaggregation_{Y}_{Y+1}
      - bmd_scraper # silver/bmd
    downstream: []
    outputs:
      - gold/pesticide_compliance_{year}_{year+1}

  h3_pfas_analysis:
    workflow: h3-pfas-analysis.yml
    description: "H3 hexagonal PFAS exposure mapping"
    upstream:
      - pesticide_disaggregation # gold/pesticide_disaggregation_{Y}_{Y+1}
      - unified_pipeline # silver/fvm_marker_{year+1}
      - bmd_scraper # silver/bmd
    downstream:
      - generate_pmtiles
    outputs:
      - gold/h3_pfas_total_{year}
      - gold/kommune_pfas_total_{year}

  cvr_enrichment:
    workflow: cvr_enrichment_pipeline.yml
    description: "Company data enrichment (6-step: collect→fetch→geocode→consolidate)"
    upstream:
      - property_cadastral_merge # cvr_collections/property_cadastral_merge
    downstream: []
    outputs:
      - gold/cvr_enrichment

  api_export:
    workflow: api_export_pipeline.yml
    description: "Pre-compute JSON API files from gold-layer parquet, upload to R2 CDN"
    upstream:
      - cvr_enrichment # gold/cvr_enrichment (search index, company profiles)
      - field_production # gold/field_production (homepage rankings, municipality data)
      - pesticide_disaggregation # gold/pesticide_disaggregation (pesticide analysis)
      - worker_safety # gold/worker_safety
      - work_permits # gold/work_permits
    downstream: []
    paths:
      - backend/pipelines/api_export/**
    outputs:
      - R2 api/v1/*.json (homepage, search, companies, municipalities, pesticides)
    notes: "Replaces Supabase edge functions. Runs after gold-layer pipelines complete."

  # ── TIER 3: Terminal ──

  generate_pmtiles:
    workflow: generate-pmtiles.yml
    description: "Map tiles from all gold layers for visualization"
    upstream:
      - unified_pipeline # silver/fvm_marker, bnbo, wetlands, water_projects, skovrejsning
      - field_area_analysis # gold/field_environmental_analysis_fields
      - field_production # gold/field_production
      - pesticide_proximity # gold/pesticide_proximity
      - pesticide_drift_exposure # gold/pesticide_drift_exposure
      - h3_pfas_analysis # gold/h3_pfas_total, kommune_pfas_total
      - bbr_buildings_pipeline # silver/bbr_buildings
      - bmd_scraper # silver/bmd
    downstream:
      - pmtiles_cache_warmup
    outputs:
      - PMTiles in R2 pesticidkortet bucket

  pmtiles_cache_warmup:
    workflow: pmtiles-cache-warmup.yml
    description: "CDN cache warming after tile generation"
    upstream:
      - generate_pmtiles
    downstream: []
