# Ruff configuration for Landbruget.dk backend
line-length = 120

[lint]
# Enable comprehensive rule sets for code quality
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (undefined names, unused imports, etc.)
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie (misc improvements)
    "RET",    # flake8-return (return statement improvements)
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "FURB",   # refurb (modern Python idioms)
]

ignore = []

[lint.per-file-ignores]
# __init__.py files can have unused imports (re-exports)
"__init__.py" = ["F401"]
