[project]
name = "unified-pipeline"
version = "0.1.0"
description = "Unified pipeline for fetching and processing data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    {name = "Rahul Sahoo", email = "rahulsahoo66@gmail.com"},
]
dependencies = [
    "aiohttp>=3.13.5",
    "certifi>=2026.5.20",
    "click>=8.4.1",
    "cryptography>=48.0.0",
    "s3fs",
    "loguru>=0.7.3",
    "lxml>=6.1.1,<6.2",
    "psutil>=7.2.2",
    "pyarrow>=24.0.0",
    "pydantic-settings>=2.14.1",
    "pydantic",
    "python-dotenv>=1.1.0",
    "simple-singleton>=2.0.0",
    "tenacity>=9.1.4",
    "tqdm>=4.67.3",
    "xmltodict>=0.13.0",
    "zeep>=4.3.2",
    "duckdb",
    "pyreadr>=0.5.6",
    "beautifulsoup4>=4.14.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "shapely>=2.0.0",
    "tabulate>=0.10.0",
    "landbruget-common",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unified_pipeline"]
include = ["*.py"]

[tool.hatch.build]
only-packages = true
artifacts = ["*.py"]

[tool.uv]
managed = true

[tool.uv.sources]
landbruget-common = { workspace = true }

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "geopandas>=1.1.3",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
follow_untyped_imports = true

# Add explicit package configuration to resolve duplicate module issue
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "backend.pipelines.*"
ignore_errors = true


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "RUF",    # Ruff-specific rules
    "PERF",   # performance
    "RET",    # return statements
    "SIM",    # simplify
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (formatter handles)
    "RUF001", # ambiguous unicode (Danish characters)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "B008",   # function calls in argument defaults
    "SIM108", # ternary operator (less readable)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]
"src/tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "../.."]
testpaths = ["src/tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external resources",
]
