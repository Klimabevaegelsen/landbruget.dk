[project]
name = "arbejdstilsynet-inspections"
version = "0.1.0"
description = "Pipeline for Arbejdstilsynet inspections data"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your@email.com"}
]
dependencies = [
    "python-dotenv",
    "pandas",
    "gcsfs",
    "google-cloud-storage",
    "pyarrow",
    "loguru",
    "playwright",
    "fastapi",
    "uvicorn",
    "pydantic",
    "numpy",
    "duckdb==1.2.2",  # Kept for now
    'ibis-framework[duckdb]>=10.5.0' # Aligned with CHR pipeline
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bronze", "silver"]
include = ["*.py"]

[tool.hatch.build]
only-packages = true
artifacts = ["*.py"]

[tool.uv]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]
ignore = []

[tool.ruff.lint.isort]
