[pytest]
# Pytest configuration for arbejdstilsynet_inspections pipeline

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = tests

# Markers
markers =
    slow: Slow running tests
    integration: Integration tests requiring full setup
    unit: Fast unit tests

# Minimum version
minversion = 8.0

# Asyncio mode (using anyio plugin)
asyncio_default_fixture_loop_scope = function
