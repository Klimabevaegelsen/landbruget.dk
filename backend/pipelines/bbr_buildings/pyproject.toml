[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bbr_buildings_pipeline"
version = "1.0.0"
description = "A data pipeline that fetches and processes Danish BBR building data according to the medallion architecture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Landbrugsdata Team" }
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "duckdb>=0.9.0",
    "ibis-framework[duckdb,geospatial]>=7.0.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyogrio>=0.7.0",
    "pydantic>=2.4.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "google-cloud-storage>=2.10.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.1",
    "ruff>=0.0.290",
    "black>=23.9.1",
    "isort>=5.12.0",
    "pre-commit>=3.4.0",
    "types-requests>=2.31.0",
    "types-beautifulsoup4>=4.12.0",
]

[project.scripts]
bbr-buildings = "bbr_buildings_pipeline.main:main"

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "B", "I", "N", "UP", "ANN", "A"]
ignore = ["ANN101", "ANN401"]

[tool.ruff.isort]
known-third-party = ["requests", "beautifulsoup4", "duckdb", "ibis", "geopandas", "shapely", "pyogrio", "pydantic", "dotenv", "pyarrow", "pandas", "google"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "--cov=. --cov-report=term-missing -v --ignore=tests" 