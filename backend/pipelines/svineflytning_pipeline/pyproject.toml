[project]
name = "svineflytning-pipeline"
version = "0.1.0"
description = "Pipeline for fetching and processing pig movement data from SvineflytningWS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Landbruget.dk Team" },
]
dependencies = [
    "zeep~=4.3.1",
    "certifi~=2024.12.14",
    "google-cloud-secret-manager~=2.22.1",
    "lxml~=5.3.0",
    "xmlsec==1.3.14",
    "s3fs>=2024.1.0",
    "python-dotenv~=1.0.1",
    "cryptography",
    "tqdm~=4.66.2",
    "xmltodict~=0.13.0",
    "tenacity~=8.2.3",
    "ijson~=3.2.3",
    "duckdb~=1.1.3",
    "landbruget-common",
]

[tool.uv]

[tool.uv.sources]
landbruget-common = { path = "../../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bronze", "silver"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "RUF",    # Ruff-specific rules
    "PERF",   # performance
    "RET",    # return statements
    "SIM",    # simplify
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (formatter handles)
    "RUF001", # ambiguous unicode (Danish characters)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "B008",   # function calls in argument defaults
    "SIM108", # ternary operator (less readable)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
