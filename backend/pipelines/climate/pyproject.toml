[project]
name = "climate-pipeline"
version = "0.1.0"
description = "Climate emissions calculation pipeline for Danish agricultural operations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Landbruget.dk Team" },
]
dependencies = [
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "s3fs>=2024.1.0",
    "pyarrow>=14.0.0",
    "duckdb>=1.5.0",
    "loguru>=0.7.0",
    "landbruget-common",
]

[tool.uv]

[tool.uv.sources]
landbruget-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "RUF",    # Ruff-specific rules
    "PERF",   # performance
    "RET",    # return statements
    "SIM",    # simplify
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (formatter handles)
    "RUF001", # ambiguous unicode (Danish characters)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "B008",   # function calls in argument defaults
    "SIM108", # ternary operator (less readable)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
