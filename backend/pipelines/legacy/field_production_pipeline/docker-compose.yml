version: '3.8'

services:
  field-production-pipeline:
    build: .
    container_name: field-production-pipeline
    volumes:
      # Mount data cache for local development
      - ../../../data_cache:/app/data_cache:ro
      # Mount output directory
      - ./data:/app/data
      # Mount source code for development
      - .:/app
    environment:
      # Set log level
      - LOG_LEVEL=INFO
      # Set Python path
      - PYTHONPATH=/app:/app/backend:/app/backend/pipelines
    command: python main.py --help

  # Service for running specific year
  field-overview-2024:
    build: .
    container_name: field-overview-2024
    volumes:
      - ../../../data_cache:/app/data_cache:ro
      - ./data:/app/data
      - .:/app
    environment:
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app:/app/backend:/app/backend/pipelines
    command: python main.py --year 2024 --output-dir /app/data

  # Service for running all years
  field-overview-all:
    build: .
    container_name: field-overview-all
    volumes:
      - ../../../data_cache:/app/data_cache:ro
      - ./data:/app/data
      - .:/app
    environment:
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app:/app/backend:/app/backend/pipelines
    command: python main.py --all-years --output-dir /app/data 