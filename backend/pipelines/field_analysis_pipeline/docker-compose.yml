version: '3.8'

services:
  field-analysis-pipeline:
    build: .
    container_name: field-analysis-pipeline
    environment:
      # Analysis Configuration
      - ANALYSIS_YEAR=2025
      - BATCH_SIZE=1000
      - MEMORY_LIMIT_GB=14
      - THREAD_COUNT=4
      
      # GCS Configuration (override these in production)
      - FIELDS_DATA_PATH=gs://landbrugsdata-raw-data/silver/agricultural_fields/data_cache/agricultural_fields_{year}_data.parquet
      - PROPERTIES_DATA_PATH=gs://landbrugsdata-raw-data/silver/property_cadastral_merged/data_cache/property_cadastral_merged/2025-06-22.parquet
      - SOIL_DATA_PATH=gs://landbrugsdata-raw-data/silver/soil_types/data_cache/soil_types/data.parquet
      - BNBO_DATA_PATH=gs://landbrugsdata-raw-data/silver/bnbo_status/data_cache/bnbo_status/dissolved.parquet
      - WETLANDS_DATA_PATH=gs://landbrugsdata-raw-data/silver/wetlands/data_cache/wetlands/dissolved.parquet
      - WATER_PROJECTS_DATA_PATH=gs://landbrugsdata-raw-data/silver/water_projects/data_cache/water_projects/dissolved.parquet
      
      # Google Cloud credentials (mount service account key)
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account.json
      
    volumes:
      # Mount GCS service account credentials
      - ${GOOGLE_APPLICATION_CREDENTIALS_PATH:-./credentials}:/app/credentials:ro
      
      # Mount output directory for local development
      - ./silver:/app/silver
      
    command: >
      python main.py 
      --year ${ANALYSIS_YEAR:-2025}
      --batch-size ${BATCH_SIZE:-1000}
      --memory-limit ${MEMORY_LIMIT:-14GB}
      --threads ${THREAD_COUNT:-4}
      ${MAX_BATCHES:+--max-batches ${MAX_BATCHES}}
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '4'
        reservations:
          memory: 8G
          cpus: '2' 