[project]
name = "drive_data_pipeline"
version = "0.1.0"
description = "A data pipeline that fetches files from Google Drive and processes them according to the medallion architecture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Landbruget.dk Team" },
]
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.3.1",
    "google-auth-httplib2>=0.3.1",
    "duckdb",
    "pydantic",
    "python-dotenv>=1.0.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.2",
    "pypdf>=3.15.1",
    "pdfplumber>=0.10.2",
    "tabula-py>=2.10.0",
    "JPype1>=1.4.1",
    "s3fs",
    "tenacity>=9.1.4",
    "loguru>=0.7.3",
    "shapely>=2.0.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.10",
    "landbruget-common",
]

[tool.uv]

[tool.uv.sources]
landbruget-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drive_data_pipeline"]

[project.scripts]
drive-pipeline = "drive_data_pipeline.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "ruff",
    "ty",
    "types-requests>=2.33.0.20260408",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "RUF",    # Ruff-specific rules
    "PERF",   # performance
    "RET",    # return statements
    "SIM",    # simplify
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (formatter handles)
    "RUF001", # ambiguous unicode (Danish characters)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "B008",   # function calls in argument defaults
    "SIM108", # ternary operator (less readable)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "-v"
markers = [
    "integration: integration-style coverage for drive_data_pipeline",
]
