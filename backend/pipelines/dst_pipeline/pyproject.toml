[project]
name = "dst-api-pipeline"
version = "0.1.0"
description = "Bronze layer pipeline for fetching data from Danmarks Statistik API."
readme = "README.md" 
requires-python = ">=3.11" 
license = { text = "MIT" } 
authors = [
    { name = "Your Name", email = "your@email.com" },
]
dependencies = [
    "requests>=2.31.0",
    "google-cloud-storage>=3.1.0",
    "python-dotenv>=1.1.0",
    "tqdm>=4.66.2",
    "pandas>=2.2.3",
    "pyarrow>=20.0.0",  
    "ibis-framework[duckdb,geospatial]>=10.5.0",
    "gcsfs>=2025.3.2",
    "duckdb>=1.2.2",
    # Dependencies for unified_pipeline imports
    "loguru>=0.7.3",
    "simple-singleton>=2.0.0",
    "psutil>=6.1.0",
    "fsspec>=2024.12.0",
    "cryptography>=44.0.3",
    "tenacity>=9.1.2",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [".", "bronze", "silver"] 
include = ["README.md", "*.py"] 

[tool.hatch.build]
only-packages = true
artifacts = ["*.py"]

[tool.uv] 