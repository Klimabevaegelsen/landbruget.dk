[project]
name = "chr-pipeline"
version = "0.1.0"
description = "Bronze layer pipeline for fetching CHR data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your@email.com" },
]
dependencies = [
    "zeep~=4.3.1",
    "certifi~=2025.6.15",
    "google-cloud-secret-manager~=2.24.0",
    "lxml==5.2.1",
    "xmlsec==1.3.14",
    "google-cloud-storage~=3.1.1",
    "python-dotenv~=1.1.1",
    "cryptography",
    "tqdm~=4.67.1",
    "pandas~=2.3.0",
    "geopandas~=1.1.1",
    "pyarrow~=20.0.0",
    'ibis-framework[duckdb,geospatial]~=10.6.0',
    "gcsfs~=2025.5.1",
    "loguru~=0.7.3",
    "simple-singleton~=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [".", "bronze", "silver"]
include = ["README.md", "*.py"]

[tool.hatch.build]
only-packages = true
artifacts = ["*.py"]

[tool.uv]
# Using binary wheels for both lxml and xmlsec as they are now compatible
# See: https://github.com/xmlsec/python-xmlsec/issues/316
# xmlsec 1.3.14+ provides statically linked wheels compatible with lxml
