[project]
name = "chr-pipeline"
version = "0.1.0"
description = "Bronze layer pipeline for fetching CHR data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your@email.com" },
]
dependencies = [
    "zeep~=4.3.1",
    "certifi~=2025.6.15",
    "google-cloud-secret-manager~=2.24.0",
    "lxml==5.2.1",
    "xmlsec==1.3.14",
    "s3fs>=2024.1.0",
    "python-dotenv~=1.1.1",
    "cryptography",
    "tqdm~=4.67.1",
    "pyarrow~=20.0.0",
    'ibis-framework[duckdb,geospatial]~=10.6.0',
    "duckdb~=1.5.0",
    "loguru~=0.7.3",
    "simple-singleton~=2.0.0",
    "aiohttp~=3.10.11",
    "landbruget-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [".", "bronze", "silver"]
include = ["README.md", "*.py"]

[tool.hatch.build]
only-packages = true
artifacts = ["*.py"]

[tool.uv]
# Using binary wheels for both lxml and xmlsec as they are now compatible
# See: https://github.com/xmlsec/python-xmlsec/issues/316
# xmlsec 1.3.14+ provides statically linked wheels compatible with lxml

[tool.uv.sources]
landbruget-common = { path = "../../common", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "RUF",    # Ruff-specific rules
    "PERF",   # performance
    "RET",    # return statements
    "SIM",    # simplify
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (formatter handles)
    "RUF001", # ambiguous unicode (Danish characters)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "B008",   # function calls in argument defaults
    "SIM108", # ternary operator (less readable)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
