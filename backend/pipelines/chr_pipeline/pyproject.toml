[project]
name = "chr-pipeline"
version = "0.1.0"
description = "Bronze layer pipeline for fetching CHR data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your@email.com" },
]
dependencies = [
    "zeep~=4.3.3",
    "certifi~=2026.6.17",
    "lxml>=6.1.1,<6.2",
    "xmlsec==1.3.17",
    "s3fs",
    "python-dotenv~=1.1.1",
    "cryptography>=46.0.7",
    "tqdm~=4.68.3",
    "pyarrow~=24.0.0",
    "duckdb",
    "loguru~=0.7.3",
    "simple-singleton~=2.0.0",
    "aiohttp>=3.14.1,<3.15",
    "landbruget-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [".", "bronze", "silver"]
include = ["README.md", "*.py"]

[tool.hatch.build]
only-packages = true
artifacts = ["*.py"]

[tool.uv]

[tool.uv.sources]
landbruget-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=4.0.0",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "RUF",    # Ruff-specific rules
    "PERF",   # performance
    "RET",    # return statements
    "SIM",    # simplify
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (formatter handles)
    "RUF001", # ambiguous unicode (Danish characters)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "B008",   # function calls in argument defaults
    "SIM108", # ternary operator (less readable)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
