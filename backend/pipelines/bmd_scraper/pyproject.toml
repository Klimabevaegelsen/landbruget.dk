[project]
name = "bmd_scraper"
version = "0.1.0"
description = "Data pipeline for extracting and processing data from the Danish Bekæmpelsesmiddel Database"
requires-python = ">=3.9"
license = {text = "Proprietary"}
readme = "README.md"
dependencies = [
    "requests>=2.25.1",
    "beautifulsoup4>=4.9.3",
    "pandas>=1.3.0",
    "python-dotenv",
    "pyarrow",
    "duckdb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bronze", "silver"]
include = ["*.py"]

[tool.hatch.build]
only-packages = true
artifacts = ["*.py"]

[tool.uv]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.12",
]

production = [
    "google-cloud-storage>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]
ignore = []

[tool.ruff.lint.isort] 