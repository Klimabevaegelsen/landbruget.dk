[project]
name = "dmi_pipeline"
version = "0.1.0"
description = "Pipeline for processing DMI climate data"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "duckdb>=0.9.0",
    "geopandas>=0.14.0",
    "pandas>=2.1.0",
    "fastapi>=0.104.0",
    "pyarrow>=14.0.0",
    "tqdm>=4.66.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bronze", "silver"]
include = ["*.py"]

[tool.hatch.build]
only-packages = true
artifacts = ["*.py"]

[tool.uv]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]
ignore = []

[tool.ruff.lint.isort]