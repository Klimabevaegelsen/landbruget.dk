[project]
name = "dmi_pipeline"
version = "0.1.0"
description = "Pipeline for processing DMI climate data"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11.0",
    "duckdb>=1.3.1",
    "geopandas>=1.1.0",
    "pandas>=2.3.0",
    "fastapi>=0.115.0",
    "pyarrow>=20.0.0",
    "tqdm>=4.67.1",
    "google-cloud-storage>=3.1.1",
    "python-dotenv>=1.1.1",
    "gcsfs>=2025.5.1",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.9.1",
    "ibis-framework[duckdb,geospatial]>=10.6.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bronze", "silver"]
