[project]
name = "field-production-pipeline"
version = "0.1.0"
description = "Pipeline for generating agricultural field production estimates using DST data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Landbrugsdata Team", email = "team@landbrugsdata.dk" },
]
dependencies = [
    # Core data processing
    "pandas>=2.2.0",
    "numpy>=1.24.0",
    
    # Geospatial data processing
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    
    # Database and spatial processing
    # DuckDB v1.2.2+ required for SPATIAL_JOIN operator support (PR #545)
    "duckdb>=1.2.2",
    # Note: spatial extension is now integrated into main duckdb package
    
    # Parquet support (CRITICAL - was missing)
    "pyarrow>=16.1.0",
    
    # Cloud storage
    "google-cloud-storage>=2.19.0",
    "gcsfs>=2024.2.0",
    
    # Utilities
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [".", "bronze", "silver"]
include = ["README.md", "*.py"]

[tool.hatch.build]
only-packages = true
artifacts = ["*.py"]

[tool.uv]
# Optimize for geospatial dependencies
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=22.1.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
] 