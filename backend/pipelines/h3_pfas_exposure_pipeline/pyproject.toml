[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "h3_pfas_exposure_pipeline"
version = "1.0.0"
description = "H3-based PFAS exposure analysis pipeline using optimized spatial processing"
requires-python = ">=3.11"
license = {text = "Proprietary"}
readme = "README.md"
dependencies = [
    # Core dependencies
    "duckdb>=1.3.1",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    
    # Data processing
    "fsspec>=2023.12.0",
    "gcsfs>=2025.3.2",
    
    # GCS and cloud storage
    "google-cloud-storage>=2.0.0",
    "google-auth>=2.0.0",
    
    # Utilities
    "simple-singleton>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.1.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

production = [
    "google-cloud-storage>=2.0.0",
    "google-auth>=2.0.0",
]

[tool.setuptools]
packages = ["h3_pfas_exposure"]
package-dir = {"" = "src"}

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N",  # pep8-naming
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "N806",  # variable in function should be lowercase (for DuckDB column names)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*/tests/*" = ["S101"]  # Allow assert in tests

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "duckdb.*",
    "gcsfs.*",
    "google.cloud.*",
    "loguru.*",
]
ignore_missing_imports = true 