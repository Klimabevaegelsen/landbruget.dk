[project]
name = "h3_pfas_exposure_pipeline"
version = "1.0.0"
description = "H3-based PFAS exposure analysis pipeline using optimized spatial processing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Landbruget.dk Team" },
]
dependencies = [
    # Core dependencies
    "duckdb>=1.3.1",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    # Data processing
    "fsspec>=2023.12.0",
    "gcsfs>=2025.3.2",
    # GCS and cloud storage
    "google-cloud-storage>=2.0.0",
    "google-auth>=2.0.0",
    # Utilities
    "simple-singleton>=2.0.0",
    "psutil>=5.9.0",
    "tqdm>=4.66.0",
    "landbruget-common",
]

[tool.uv]

[tool.uv.sources]
landbruget-common = { path = "../../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h3_pfas_exposure"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "RUF",    # Ruff-specific rules
    "PERF",   # performance
    "RET",    # return statements
    "SIM",    # simplify
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (formatter handles)
    "RUF001", # ambiguous unicode (Danish characters)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "B008",   # function calls in argument defaults
    "SIM108", # ternary operator (less readable)
    "N806",   # variable in function should be lowercase (for DuckDB column names)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
