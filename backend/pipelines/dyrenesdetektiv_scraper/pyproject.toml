[project]
name = "dyrenesdetektiv_scraper"
version = "0.1.0"
description = "Scrapes Danish animal welfare control records from dyrenesdetektiv.dk (sourced from Fødevarestyrelsen)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Landbruget.dk Team" },
]
dependencies = [
    "click>=8.0.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.14.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "duckdb",
    "s3fs",
    "landbruget-common",
]

[tool.uv]

[tool.uv.sources]
landbruget-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bronze", "silver"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "requests-mock>=1.12.0",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "RUF",
    "PERF",
    "RET",
    "SIM",
    "C4",
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "B008",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
