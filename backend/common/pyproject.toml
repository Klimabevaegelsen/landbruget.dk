[project]
name = "landbruget-common"
version = "0.1.0"
description = "Shared utilities for Landbruget.dk data pipelines"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic",
    "s3fs",
    "duckdb",
    "google-cloud-secret-manager>=2.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Treat the current directory as the "common" package
# This allows imports like "from common.storage import ..."
[tool.hatch.build.targets.wheel.force-include]
"." = "common"
