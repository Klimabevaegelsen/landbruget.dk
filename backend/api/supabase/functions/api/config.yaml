metadata:
  configVersion: "1.4"  # Increment version for documentation addition

pageBuilder:
  - _key: company-identity
    _type: infoCard
    title: "Virksomhed identitet"
    documentation:
      title: "Virksomhedsdata og CVR-oplysninger"
      description: "Grundlæggende virksomhedsoplysninger hentet fra CVR-registret"
      sources:
        - name: "CVR enrichment workflow"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/cvr_enrichment.md"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#weekly-workflows-every-monday-2-am-utc"
    dataSource:
      params:
        source: "companies"
        record:
          mappings:
            - label: "Navn"
              column: "company_name"
            - label: "CVR"
              column: "cvr_number"
            - label: "Adresse"
              column: "address"
            - label: "Postnummer"
              column: "postal_code"
            - label: "By"
              column: "city"
            - label: "Reklamebeskyttelse"
              column: "advertisement_protection"
              format: "boolean"

  - _key: company-ownership
    _type: dataGrid
    title: "Ejerforhold (oversigt)"
    documentation:
      title: "Ejerforhold og selskabsstruktur"
      description: "Ejerskabsdata fra Property Owners SFTP Pipeline med privacybeskyttelse"
      sources:
        - name: "Property owners SFTP pipeline"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/SPECIALIZED_PIPELINES_COMPREHENSIVE.md#property-owners-sftp-pipeline-privacy-compliant-property-data-processing"
        - name: "Property cadastral merge workflow"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/property_cadastral_merge.md"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#property-owners-sftp-processing"
    dataSource:
      params:
        source: "company_owners"
        table:
          columns:
            - key: "owner"
              label: "Ejer / Enhed"
              column: "owner_name"
            - key: "share_bucket"
              label: "Ejerandel (Bucket)"
              column: "ownership_percentage"

  - _key: company-leadership
    _type: dataGrid
    title: "Ledelse"
    documentation:
      title: "Virksomhedsledelse"
      description: "Oplysninger om virksomhedens ledelse og nøglepersoner fra CVR-registret"
      sources:
        - name: "CVR enrichment workflow"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/cvr_enrichment.md"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#weekly-workflows-every-monday-2-am-utc"
    dataSource:
      params:
        source: "company_leadership"
        table:
          columns:
            - key: "name"
              label: "Navn"
              column: "person_name"
            - key: "role"
              label: "Stilling"
              column: "role_title"
            - key: "since"
              label: "Siden"
              column: "start_date"
              format: "date"

  - _key: company-map-overview
    _type: mapChart
    title: "Kort: produktionssteder, marker, virksomhedens adresse"
    documentation:
      title: "Geografisk oversigt"
      description: "Kombineret kort med produktionssteder fra CHR, marker fra FVM og virksomhedsadresser"
      sources:
        - name: "CHR pipeline (produktionssteder)"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/chr_pipeline/README_COMPREHENSIVE.md"
        - name: "FVM WFS workflow (marker)"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/fvm_wfs.md"
        - name: "CVR enrichment (adresser)"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/cvr_enrichment.md"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#cross-pipeline-data-dependencies"
    dataSource:
      params:
        map:
          layers:
            - name: "Produktionssteder"
              source: "production_sites"
              geometryColumn: "location_geom"
              properties:
                - "site_name"
                - "chr"
                - "capacity"
              style: "production_site_marker"
            - name: "Marker"
              source: "field_boundaries"
              geometryColumn: "geom"
              properties:
                - "field_identifier"
                - "area_ha"
              style: "field"
            - name: "Virksomhedens adresse"
              source: "companies"
              geometryColumn: "address_geom"
              properties:
                - "address"
              style: "hq_marker"

  - _key: financials-latest-kpis
    _type: kpiGroup
    title: "Finansielle nøgletal (seneste år)"
    documentation:
      title: "Finansielle nøgletal"
      description: "Seneste finansielle nøgletal for virksomheden baseret på CVR regnskabsdata"
      sources:
        - name: "CVR enrichment workflow"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/cvr_enrichment.md"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#weekly-workflows-every-monday-2-am-utc"
    dataSource:
      params:
        source: "yearly_financials"
        kpis:
          timeContext: "last_n_years"
          n: 1
          metrics:
            - key: "net_profit"
              label: "Nettoresultat"
              column: "net_profit_loss"
              format: "currency"
            - key: "operating_profit"
              label: "Driftsresultat"
              column: "operating_profit_loss"
              format: "currency"
            - key: "total_assets"
              label: "Samlede Aktiver"
              column: "total_assets"
              format: "currency"
            - key: "equity_ratio"
              label: "Soliditetsgrad"
              column: "equity_ratio"
              format: "percentage"

  - _key: financials-history
    _type: barChart
    title: "Økonomisk udvikling (pr. år)"
    documentation:
      title: "Økonomisk udvikling over tid"
      description: "Historisk udvikling i virksomhedens finansielle nøgletal baseret på CVR regnskabsdata"
      sources:
        - name: "CVR enrichment workflow"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/cvr_enrichment.md"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#weekly-workflows-every-monday-2-am-utc"
    dataSource:
      params:
        source: "yearly_financials"
        timeSeries:
          timeColumn: "reporting_year"
          metrics:
            - key: "net_profit"
              column: "net_profit_loss"
              seriesName: "Nettoresultat"
            - key: "operating_profit"
              column: "operating_profit_loss"
              seriesName: "Driftsresultat"
            - key: "total_assets"
              column: "total_assets"
              seriesName: "Samlede aktiver"
        orderBy:
          - column: "reporting_year"
            direction: "asc"

  - _key: financials-detailed-kpis
    _type: kpiGroup
    title: "Detaljerede finansielle nøgletal"
    documentation:
      title: "Detaljerede finansielle nøgletal"
      description: "Udvidede finansielle nøgletal inkluderende medarbejderoplysninger, likviditet og rentabilitetsmål fra CVR regnskabsdata"
      sources:
        - name: "CVR enrichment workflow"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/cvr_enrichment.md"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#weekly-workflows-every-monday-2-am-utc"
    dataSource:
      params:
        source: "yearly_financials"
        kpis:
          timeContext: "last_n_years"
          n: 1
          metrics:
            - key: "total_equity"
              label: "Egenkapital"
              column: "total_equity"
              format: "currency"
            - key: "employee_costs"
              label: "Lønomkostninger"
              column: "employee_benefits_expense"
              format: "currency"
            - key: "employees"
              label: "Antal Medarbejdere"
              column: "average_number_of_employees"
              format: "number"
            - key: "cash"
              label: "Likvide Midler"
              column: "cash_and_cash_equivalents"
              format: "currency"
            - key: "return_on_assets"
              label: "Forrentning af Aktiver"
              column: "return_on_assets"
              format: "percentage"
            - key: "profit_per_employee"
              label: "Resultat pr. Medarbejder"
              column: "profit_per_employee"
              format: "currency"

  - _key: subsidies-history-stacked
    _type: stackedBarChart
    title: "Tilskud fordelt på type (pr. år)"
    documentation:
      title: "Landbrugstilskud Over Tid"
      description: "Historisk oversigt over landbrugstilskud fordelt på forskellige støtteordninger fra Drive Data Pipeline"
      sources:
        - name: "Drive data pipeline (subsidies)"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/drive_data_pipeline/README_COMPREHENSIVE.md#subsidies-landbrugstilskud"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#drive-data-pipeline-google-drive-integration"
    dataSource:
      params:
        source: "subsidy_details"
        timeSeries:
          timeColumn: "year"
          valueColumn: "amount_dkk"
          groupByColumn: "subsidy_type"
        orderBy:
          - column: "year"
            direction: "asc"

  - _key: land-use-kpis
    _type: kpiGroup
    title: "Arealanvendelse nøgletal"
    documentation:
      title: "Arealanvendelse og Markoversigt"
      description: "Nøgletal for landbrugsarealanvendelse baseret på FVM-data inkluderende økologisk dyrkning og markoversigt"
      sources:
        - name: "Field area analysis workflow"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/field_area_analysis.md"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#field-area-analysis-workflow"
    dataSource:
      params:
        source: "land_use_summary"
        kpis:
          timeContext: "last_n_years"
          n: 1
          metrics:
            - key: "total_ha"
              label: "Antal Hektar (Total)"
              column: "total_area_ha"
              format: "number"
            - key: "organic_ha"
              label: "Økologisk Hektar (Total)"
              column: "organic_area_ha"
              format: "number"
            - key: "rank_dk_ha"
              label: "Rankering på landsplan (Ha)"
              column: "rank_dk_total_area"
            - key: "rank_mun_ha"
              label: "Rankering i kommunen (Ha)"
              column: "rank_municipality_total_area"
            - key: "rank_dk_org"
              label: "Rankering på landsplan (Ha Øko)"
              column: "rank_dk_organic_total_area"
            - key: "rank_mun_org"
              label: "Rankering i kommunen (Ha Øko)"
              column: "rank_municipality_organic_total_area"

  - _key: land-use-crop-distribution
    _type: horizontalStackedBarChart
    title: "Afgrødefordeling (seneste år, øko/konv)"
    documentation:
      title: "Afgrødefordeling Økologisk vs Konventionel"
      description: "Fordeling af afgrøder på virksomhedens marker opdelt i økologisk og konventionel dyrkning baseret på FVM-data"
      sources:
        - name: "FVM WFS workflow (afgrødedata)"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/fvm_wfs.md"
        - name: "Field production workflow"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/field_production.md"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#field-production-workflow"
    dataSource:
      params:
        source: "field_yearly_data"
        category:
          timeContext: "last_n_years"
          n: 1
          categoryColumn: "crop_name"
          valueColumn: "area_ha"
          stackByColumn: "is_organic"
          topN: 9
          orderBy:
            - column: "area_ha"
              direction: "desc"

  - _key: land-use-field-map
    _type: mapChart
    title: "Markernes placering & status (seneste år)"
    documentation:
      title: "Interaktivt Markkort"
      description: "Geografisk oversigt over alle virksomhedens marker med information om afgrøder, økologisk status og arealanvendelse"
      sources:
        - name: "Cadastral workflow"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/cadastral.md"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#cadastral-workflow"
    dataSource:
      params:
        map:
          layers:
            - name: "Marker"
              source: "field_boundaries"
              geometryColumn: "geom"
              properties:
                - "field_identifier"
                - "field_name"
                - "area_ha"
                - "crop_name"
                - "is_organic"
              style: "field_detailed"

  - _key: environmental-compliance-overview
    _type: kpiGroup
    title: "Miljøoverholdelse - oversigt"
    documentation:
      title: "Miljøoverholdelse og Beskyttelsesområder"
      description: "Oversigt over miljøoverholdelse inkluderende problematiske områder, BNBO-beskyttelse og vådområder"
      sources:
        - name: "BNBO workflow (drikkevandsbeskyttelse)"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/bnbo.md"
        - name: "Lavbundsjorde workflow"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/wetlands.md"
        - name: "Water projects workflow"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/water_projects.md"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#environmental-protection-workflows"
    dataSource:
      params:
        source: "environmental_compliance_summary"
        kpis:
          timeContext: "last_n_years"
          n: 1
          metrics:
            - key: "total_problematic_ha"
              label: "Problematiske Områder (Ha)"
              column: "total_problematic_hectares"
              format: "number"
            - key: "total_dealt_with_ha"
              label: "Håndterede Områder (Ha)"
              column: "total_dealt_with_hectares"
              format: "number"
            - key: "compliance_percentage"
              label: "Overholdelsesgrad"
              column: "compliance_percentage"
              format: "percentage"
            - key: "water_coverage_percentage"
              label: "Areal til Klima- eller Miljøprojekter"
              column: "water_coverage_percentage"
              format: "percentage"

  - _key: bnbo-environmental-status-chart
    _type: comboChart
    title: "BNBO miljøstatus - områder og klima- eller miljøprojekter"
    documentation:
      title: "BNBO Boringsnære Beskyttelsesområder Status"
      description: "Status for boringsnære beskyttelsesområder (BNBO) omkring drikkevandsboringer hvor sprøjtemidler kan forurene grundvandet. Inkluderer områder der kræver handling og gennemførte tiltag for drikkevandsbeskyttelse"
      sources:
        - name: "BNBO workflow (drikkevandsbeskyttelse)"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/bnbo.md"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#bnbo-workflow"
    dataSource:
      params:
        source: "bnbo_environmental_status"
        timeSeries:
          timeColumn: "year"
          metrics:
            - key: "action_required"
              seriesName: "Kræver handling (ha)"
              column: "action_required_hectares"
              type: "bar"
              yAxis: "left"
            - key: "completed"
              seriesName: "Gennemført (ha)"
              column: "completed_hectares"
              type: "bar"
              yAxis: "left"
            - key: "water_covered"
              seriesName: "Areal til klima- eller miljøprojekter (ha)"
              column: "water_covered_hectares"
              type: "bar"
              yAxis: "left"
            - key: "compliance_rate"
              seriesName: "Overholdelsesgrad (%)"
              column: "compliance_rate"
              type: "line"
              yAxis: "right"
        orderBy:
          - column: "year"
            direction: "asc"

  - _key: wetlands-environmental-status-chart
    _type: comboChart
    title: "Lavbundsjorde miljøstatus - områder og klima- eller miljøprojekter"
    documentation:
      title: "Lavbundsjorde status"
      description: "Status for lavbundsjorde inkluderende områder der kræver miljøtiltag og gennemførte projekter"
      sources:
        - name: "Lavbundsjorde workflow"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/wetlands.md"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#wetlands-workflow"
    dataSource:
      params:
        source: "wetlands_environmental_status"
        timeSeries:
          timeColumn: "year"
          metrics:
            - key: "action_required"
              seriesName: "Kræver handling (ha)"
              column: "action_required_hectares"
              type: "bar"
              yAxis: "left"
            - key: "completed"
              seriesName: "Gennemført (ha)"
              column: "completed_hectares"
              type: "bar"
              yAxis: "left"
            - key: "water_covered"
              seriesName: "Areal til klima- eller miljøprojekter (ha)"
              column: "water_covered_hectares"
              type: "bar"
              yAxis: "left"
            - key: "protection_rate"
              seriesName: "Beskyttelsesgrad (%)"
              column: "protection_rate"
              type: "line"
              yAxis: "right"
        orderBy:
          - column: "year"
            direction: "asc"

  - _key: environmental-action-status-chart
    _type: horizontalStackedBarChart
    title: "Miljøhandlingsstatus - fordeling på område type"
    dataSource:
      params:
        source: "environmental_action_status"
        category:
          timeContext: "last_n_years"
          n: 1
          categoryColumn: "area_type"
          valueColumn: "area_hectares"
          stackByColumn: "action_status"

  - _key: water-coverage-effectiveness-chart
    _type: stackedBarChart
    title: "Miljø- og klimaprojekt effektivitet pr. år"
    dataSource:
      params:
        source: "water_coverage_effectiveness"
        timeSeries:
          timeColumn: "year"
          valueColumn: "coverage_hectares"
          groupByColumn: "coverage_type"
        orderBy:
          - column: "year"
            direction: "asc"

  - _key: environmental-compliance-kpis
    _type: kpiGroup
    title: "Miljøoverholdelse nøgletal & placering"
    dataSource:
      params:
        source: "environmental_compliance_ranking"
        kpis:
          timeContext: "last_n_years"
          n: 1
          metrics:
            - key: "total_non_compliant_ha"
              label: "Ikke-Overholdelse (Ha)"
              column: "total_non_compliant_hectares"
              format: "number"
            - key: "environmental_risk_score"
              label: "Miljørisiko Score"
              column: "environmental_risk_score"
              format: "number"
            - key: "rank_dk_compliance"
              label: "Rankering på landsplan (Overholdelse)"
              column: "rank_dk_compliance"
            - key: "rank_mun_compliance"
              label: "Rankering i kommunen (Overholdelse)"
              column: "rank_municipality_compliance"
            - key: "rank_dk_water_coverage"
              label: "Rankering på landsplan (Klima- eller Miljøprojekter)"
              column: "rank_dk_water_coverage"
            - key: "rank_mun_water_coverage"
              label: "Rankering i kommunen (Klima- eller Miljøprojekter)"
              column: "rank_municipality_water_coverage"

  - _key: environment-kpis
    _type: kpiGroup
    title: "Miljø nøgletal"
    documentation:
      title: "Miljøpåvirkning og Bæredygtighed"
      description: "Miljønøgletal inkluderende gødningsforbrug, kvælstofudledning og pesticidbelastning baseret på feltdata og pesticidregistreringer"
      sources:
        - name: "Pesticide disaggregation workflow"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/pesticide_disaggregation.md"
        - name: "Field production workflow"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/unified_pipeline/docs/workflows/field_production.md"
        - name: "Drive data pipeline (fertiliser)"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/drive_data_pipeline/README_COMPREHENSIVE.md#fertiliser-gødning"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#environmental-impact-analysis"
    dataSource:
      params:
        source: "environment_summary"
        kpis:
          timeContext: "last_n_years"
          n: 1
          metrics:
            - key: "fertiliser_kg"
              label: "Kg Gødning Brugt"
              column: "total_fertiliser_kg"
            - key: "nitrogen_leached_kg"
              label: "Kg Kvælstof Udledt"
              column: "total_n_leached_kg"
            - key: "nitrogen_leached_kg_ha"
              label: "Kg Kvælstof Udledt pr. Ha"
              column: "n_leached_kg_per_ha"
            - key: "pesticide_load"
              label: "Pesticidbelastning (Total)"
              column: "total_pesticide_load_index"
            - key: "pesticide_load_ha"
              label: "Pesticidbelastning pr. Ha"
              column: "pesticide_load_index_per_ha"
            - key: "rank_dk_fertiliser"
              label: "Rankering på landsplan (Gødning)"
              column: "rank_dk_total_fertiliser_kg"
            - key: "rank_mun_fertiliser"
              label: "Rankering i kommunen (Gødning)"
              column: "rank_municipality_total_fertiliser_kg"
            - key: "rank_dk_n_leached_ha"
              label: "Rankering på landsplan (N/Ha)"
              column: "rank_dk_n_leached_kg_per_ha"
            - key: "rank_mun_n_leached_ha"
              label: "Rankering i kommunen (N/Ha)"
              column: "rank_municipality_n_leached_kg_per_ha"
            - key: "rank_dk_pest_load_ha"
