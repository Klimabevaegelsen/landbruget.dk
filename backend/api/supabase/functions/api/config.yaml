      sources:
        - name: "CHR pipeline (husdyr og antibiotika)"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/chr_pipeline/README_COMPREHENSIVE.md"
        - name: "Svineflytning pipeline (dyretransporter)"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/SPECIALIZED_PIPELINES_COMPREHENSIVE.md#svineflytning-pipeline-pig-movement-tracking"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#chr-pipeline-animal-health-and-movement-data"
    dataSource:
      params:
        source: "animal_welfare_summary"
        kpis:
          timeContext: "last_n_years"
          n: 1
          metrics:
            - key: "sites"
              label: "Antal Produktionssteder"
              column: "site_count"
            - key: "prod_equiv"
              label: "Kapacitet (Antal dyr)"
              column: "total_animal_equivalents"
            - key: "antibiotics_total"
              label: "Antibiotika Total (DDD)"
              column: "total_ddd_usage"
            - key: "animals_transported"
              label: "Antal Dyr Transporteret"
              column: "total_animals_transported"
            - key: "rank_dk_prod"
              label: "Rankering på landsplan (Prod. Ækv.)"
              column: "rank_dk_total_animal_equivalents"
            - key: "rank_mun_prod"
              label: "Rankering i kommunen (Prod. Ækv.)"
              column: "rank_municipality_total_animal_equivalents"
            - key: "rank_dk_antibiotics"
              label: "Rankering på landsplan (Antibiotika)"
              column: "rank_dk_total_ddd_usage"
            - key: "rank_mun_antibiotics"
              label: "Rankering i kommunen (Antibiotika)"
              column: "rank_municipality_total_ddd_usage"
            - key: "rank_dk_transport"
              label: "Rankering på landsplan (Transport)"
              column: "rank_dk_total_animals_transported"
            - key: "rank_mun_transport"
              label: "Rankering i kommunen (Transport)"
              column: "rank_municipality_total_animals_transported"

  - _key: animal-welfare-production-species-chart
    _type: stackedBarChart
