    documentation:
      title: "Dyreproduktion Fordelt på Arter"
      description: "Historisk udvikling i husdyrproduktion fordelt på forskellige dyrearter baseret på CHR-registreringer"
      sources:
        - name: "CHR pipeline (husdyrproduktion)"
          url: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/backend/pipelines/chr_pipeline/README_COMPREHENSIVE.md"
      dataLineage: "https://github.com/Klimabevaegelsen/landbruget.dk/blob/main/docs/DATA_LINEAGE_COMPREHENSIVE.md#chr-pipeline-animal-health-and-movement-data"
