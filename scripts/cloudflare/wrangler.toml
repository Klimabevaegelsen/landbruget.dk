name = "pmtiles-cache-warmer"
main = "pmtiles-cache-warmer.js"
compatibility_date = "2024-01-01"

# Cron trigger to warm cache every Monday at 2 AM (after your data updates)
[triggers]
crons = ["0 2 * * 1"]

# Route configuration - this will handle all PMTiles requests
[[routes]]
pattern = "data.pesticidkortet.dk/pmtiles/*"
zone_name = "pesticidkortet.dk"

# Environment variables (optional)
[vars]
CACHE_DURATION = "31536000"  # 1 year in seconds
LOG_LEVEL = "info"
